<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车型管理 - 列表页</title>
    <!--
      页面用途：车型管理列表页，以「可折叠行」展示车型（外层行）与其版本（内层行）
                核心功能：查询/重置（默认 4 个条件，可展开全部 11 个）、新建车型、车型/版本编辑删除、选中导出/全量导出、分页
      操作列：车型级操作（车型详情/编辑车型/新建版本/删除车型）位于外层车型行最右侧「操作」列；
              版本级操作（版本详情/编辑版本/新建版本/删除版本）保留在内层版本表最右侧「操作」列，两级操作互不混用；
              两级操作文案统一采用「带层级后缀」口径（对齐 PRD 3.1.4），内外操作列同宽 280px
      查询区收起/展开：复用公共组件 components/filter-component.js（legacy 自动绑定，data-visible-count="4"）
      交互逻辑：点击车型行展开/收起版本行；版本行复选用于导出，PRD 明确「不支持跨页导出」，
                故翻页、切换每页条数、重新查询/重置时清空选中集；删除前校验「该车型版本的关联车辆数」
                （版本删除唯一校验项，>0 阻断并提示台数 + 「查看车辆」跳转车辆资产列表带参筛选）；
                车型删除唯一校验项为「是否仍存在版本」，不做车辆引用校验（引用锚定在版本维度）；
                导出确认弹窗使用公共 .modal-overlay + Common.openModal/closeModal 控制显隐（默认隐藏，靠 .active 显示）；
                删除确认（含引用校验提示）统一改用 Common.confirm，公共层负责遮罩 + ESC + 危险按钮高亮
    -->
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/form.css">
    <style>
        /* ========== 查询筛选区（间距 24px 复用 common.css .search-bar，此处仅补卡片外观） ========== */
        .search-bar {
            background: var(--bg-container);
            border-radius: var(--radius);
            padding: 20px 24px 16px;
            box-shadow: var(--shadow-sm);
        }
        .search-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px;
        }
        /* 展开更多/收起由 components/filter-component.js 接管：默认 flex 显示，
           超出 data-visible-count 的条件由组件内联 display:none 收起 */
        .search-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-item label {
            font-size: 14px; color: var(--text-secondary); white-space: nowrap;
        }
        .search-item input,
        .search-item select {
            height: 32px; border: 1px solid var(--border-input);
            border-radius: var(--radius); padding: 0 12px;
            font-size: 14px; color: var(--text-primary); outline: none;
            transition: border-color .2s; min-width: 160px;
        }
        .search-item input:focus,
        .search-item select:focus { border-color: var(--primary); }
        .search-item input::placeholder { color: var(--text-disabled); }
        .search-actions {
            display: flex; align-items: center; gap: 8px; margin-left: auto;
        }
        /* 「展开更多/收起」按钮样式由 filter-component.js 自动注入（.filter-more-toggle），此处不再自定义 */

        /* ========== 操作栏：布局复用 common.css .action-bar（gap 8px / margin-bottom 16px / flex-wrap） ========== */
        /* 操作按钮统一左对齐（新建车型 / 导出），不使用 .push-right 右推 */
        /* 表头对齐：common.css 中 .table-wrapper thead th 的 text-align:left 优先级更高，此处补齐 col-center/col-right */
        .table-wrapper thead th.col-center { text-align: center; }
        .table-wrapper thead th.col-right { text-align: right; }
        .table-wrapper > table { table-layout: fixed; min-width: 1490px; }

        /* ========== 可折叠行表格 ========== */
        .model-row { cursor: pointer; }
        .model-row:hover { background: #f7f8fa; }
        .model-row.expanded { background: #f0f7ff; }
        .model-row.expanded:hover { background: #e6f2ff; }
        .expand-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; font-size: 12px; color: var(--text-secondary);
            transition: transform .2s;
        }
        .model-row.expanded .expand-icon { transform: rotate(90deg); color: var(--primary); }

        /* 版本行容器 */
        .version-wrap { display: none; background: #fafbfc; }
        .version-wrap.show { display: table-row; }
        /* 提高选择器权重（.table-wrapper tbody td 会以 (0,1,2) 覆盖 .version-wrap > td 的 (0,1,1)）：
           版本行整行单元格需去掉内边距，由 .version-inner 统一控制间距 */
        .table-wrapper tbody .version-wrap > td { padding: 0; border-bottom: none; }
        /* 版本子表与外层车型表同宽：去掉左右缩进，使内外表格左右边缘齐平 */
        .version-inner { padding: 12px 0 16px; }
        .empty-version-state { padding: 18px 20px; border: 1px dashed var(--border-color); background: #fff; color: var(--text-secondary); font-size: 14px; }
        .empty-version-state .action-link { margin-left: 12px; }
        .version-scroll { overflow-x: auto; }
        .version-table {
            /* min-width 与外层车型表一致（1490px），保证内外表格同宽、无内层横向滚动条 */
            width: 100%; min-width: 1490px; table-layout: fixed; border-collapse: collapse;
            border: 1px solid var(--border-color); border-radius: var(--radius);
        }
        /* 内层版本表沿用规范行高 48px / 内边距 16px / 字号 14px（规范二.3） */
        .version-table thead th {
            background: #fafafa; color: var(--text-primary); font-weight: 600;
            font-size: 14px; height: var(--table-row-height); padding: 0 var(--table-cell-padding);
            border-bottom: 1px solid var(--border-color); white-space: nowrap; text-align: center;
        }
        .version-table tbody td {
            color: var(--text-primary); font-size: 14px;
            height: var(--table-row-height); padding: 0 var(--table-cell-padding);
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-container); white-space: nowrap; text-align: center;
        }
        .version-table tbody tr:last-child td { border-bottom: none; }
        .version-table tbody tr:hover td { background: var(--bg-hover); }

        /* ========== 操作链接（间距 8px，规范二.2） ========== */
        .action-link { color: var(--primary); font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
        .action-link:hover { color: var(--primary-hover); }
        .action-link + .action-link { margin-left: 8px; }
        .action-link.danger { color: var(--error); }
        .action-link.danger:hover { color: #ff7875; }

        /* ========== 长文本列：固定宽度 + 省略号（规范二.4，保留 title 悬浮查看） ========== */
        .cell-en { max-width: 200px; }
        .cell-mfr { max-width: 180px; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <div class="content">
            <div class="page-container">
                <!-- 查询筛选区 -->
                <!-- 查询筛选区：默认展示 4 个条件，其余收起；展开/收起由 components/filter-component.js 自动接管 -->
                <div class="search-bar" data-visible-count="4">
                    <div class="search-row" id="searchRow">
                        <div class="search-item" data-idx="0">
                            <label>车型名称（中）</label>
                            <input type="text" id="s_model_name" placeholder="请输入车型名称">
                        </div>
                        <div class="search-item" data-idx="1">
                            <label>车型名称（英）</label>
                            <input type="text" id="s_model_name_en" placeholder="请输入英文名称">
                        </div>
                        <div class="search-item" data-idx="2">
                            <label>车型版本</label>
                            <input type="text" id="s_model_version" placeholder="请输入版本号">
                        </div>
                        <div class="search-item" data-idx="3">
                            <label>车型别名</label>
                            <select id="s_model_alias">
                                <option value="">请选择</option>
                                <option>扫路车</option><option>运输车</option><option>小型清洗机</option><option>小型扫路机</option><option>皮卡</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="4" style="display:none">
                            <label>车型编码</label>
                            <input type="text" id="s_model_code" placeholder="请输入车型编码">
                        </div>
                        <div class="search-item" data-idx="5" style="display:none">
                            <label>车型来源</label>
                            <select id="s_model_source">
                                <option value="">请选择</option>
                                <option>自研</option><option>非自研</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="6" style="display:none">
                            <label>动力类别</label>
                            <select id="s_power_type">
                                <option value="">请选择</option>
                                <option>纯电动</option><option>柴油</option><option>汽油</option><option>混动</option><option>天然气</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="7" style="display:none">
                            <label>排放标准</label>
                            <select id="s_emission_std">
                                <option value="">请选择</option>
                                <option>国三</option><option>国四</option><option>国五</option><option>国六</option><option>纯电动</option><option>非道路移动机械</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="8" style="display:none">
                            <label>整车厂商</label>
                            <input type="text" id="s_manufacturer" placeholder="请输入整车厂商">
                        </div>
                        <div class="search-item" data-idx="9" style="display:none">
                            <label>创建人</label>
                            <input type="text" id="s_creator" placeholder="请输入创建人">
                        </div>
                        <div class="search-item" data-idx="10" style="display:none">
                            <label>创建时间</label>
                            <input type="date" id="s_create_start">
                            <span style="margin:0 4px;color:var(--text-disabled)">~</span>
                            <input type="date" id="s_create_end">
                        </div>
                        <div class="search-actions">
                            <button class="btn btn-primary" onclick="doSearch()">查询</button>
                            <button class="btn" onclick="doReset()">重置</button>
                            <!-- 「展开更多/收起」按钮由 filter-component.js 自动注入，无需手写 -->
                        </div>
                    </div>
                </div>

                <!-- 操作栏 -->
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="window.location.href='./vehicle-model-add.html'">新建车型</button>
                    <button class="btn" onclick="doExport()">导出</button>
                </div>

                <!-- 数据列表：外层车型行 + 内层版本行（对齐规则：文本左对齐 / 编码、时间居中 / 操作、复选框居中） -->
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-center" style="width:50px"></th>
                                <th class="col-left" style="width:180px">车型名称（中）</th>
                                <th class="col-left" style="width:180px">车型名称（英）</th>
                                <th class="col-left" style="width:140px">车型别名</th>
                                <th class="col-center" style="width:140px">车型编码</th>
                                <th class="col-left" style="width:120px">车型来源</th>
                                <th class="col-left" style="width:120px">创建人</th>
                                <th class="col-center" style="width:180px">创建时间</th>
                                <th class="col-center" style="width:280px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <!-- 分页：显示总记录数、当前页码/总页数（规范二.3） -->
                <div class="pagination-area">
                    <div class="pagination-left">
                        <div class="pagination-info">共 <strong id="totalCount">0</strong> 条记录</div>
                        <span class="pagination-pages" id="pageInfo"></span>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <div class="pagination" id="paginationEl"></div>
                        <select class="page-size-select" id="pageSizeSelect" onchange="changePageSize()">
                            <option value="10" selected>10条/页</option>
                            <option value="20">20条/页</option>
                            <option value="50">50条/页</option>
                            <option value="100">100条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

// 首期解耦：车型允许没有版本，版本是可选子数据；原型数据写入共享存储，支持跨页验证创建/编辑/删除。
ModelStore.init(mockModels);
// 版本审计字段：示例数据未单独提供更新信息时，沿用创建信息，确保列表始终有完整审计列。
mockModels.forEach(model => model.versions.forEach(version => {
    version.updater = version.updater || version.creator;
    version.update_time = version.update_time || version.create_time;
}));
ModelStore.all().forEach(model => {
    (model.versions || []).forEach(version => {
        version.updater = version.updater || version.creator;
        version.update_time = version.update_time || version.create_time;
    });
    ModelStore.updateModel(model);
});

let currentPage = 1, pageSize = 10;
let filteredModels = ModelStore.all();
let selectedVersionIds = new Set();

// 引用校验数据源：统一走 ModelStore.referencedVehicleCount(modelName, version)（PRD 3.6.2 / 4.3）
// 口径：实时引用，引用锚定在「车型版本」维度；车型删除只校验版本数量，不做车辆引用校验

// 版本删除阻断时跳转车辆资产列表并按车型名称 + 车型版本自动筛选（PRD 3.6.5）
function referencedVehiclesUrl(modelName, version) {
    return '../vehicle-asset/vehicle-asset-list.html'
        + '?modelName=' + encodeURIComponent(modelName || '')
        + '&modelVersion=' + encodeURIComponent(version || '');
}
function gotoReferencedVehicles(modelName, version) {
    location.href = referencedVehiclesUrl(modelName, version);
}

// 清空版本行选中集：PRD 3.7.2「不支持跨页导出」，翻页/切换条数/重新查询时清空
function clearSelection() {
    selectedVersionIds.clear();
}

// 车型行按创建时间由近到远倒序（PRD 3.1.4，统一在渲染时排序）
function sortModelsDesc(list) {
    return [...list].sort((a, b) => b.create_time.localeCompare(a.create_time));
}

// 依据版本 ID 反查车型与版本（用于删除确认文案）
function findVersion(vid) {
    for (const m of ModelStore.all()) {
        const v = (m.versions || []).find(x => x.id === vid);
        if (v) return { model: m, version: v };
    }
    return null;
}

function renderTable() {
    const start = (currentPage - 1) * pageSize;
    const pageData = sortModelsDesc(filteredModels).slice(start, start + pageSize);
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    pageData.forEach(model => {
        // 车型行
        const modelRow = document.createElement('tr');
        modelRow.className = 'model-row';
        modelRow.dataset.modelId = model.id;
        modelRow.onclick = function(e) { toggleModelExpand(model.id); };
        modelRow.innerHTML = `
            <td class="col-center"><span class="expand-icon">▶</span></td>
            <td class="col-left">${model.model_name}</td>
            <td class="col-left ellipsis cell-en" title="${model.model_name_en || ''}">${model.model_name_en || '—'}</td>
            <td class="col-left">${model.model_alias}</td>
            <td class="col-center">${model.model_code || '—'}</td>
            <td class="col-left">${model.model_source}</td>
            <td class="col-left">${model.creator}</td>
            <td class="col-center">${model.create_time}</td>
            <td class="col-center" onclick="event.stopPropagation()">
                <a class="action-link" href="./vehicle-model-model-detail.html?modelId=${model.id}&mode=view">车型详情</a>
                <a class="action-link" href="./vehicle-model-model-detail.html?modelId=${model.id}&mode=edit">编辑车型</a>
                <a class="action-link" href="./vehicle-model-new-version.html?modelId=${model.id}">新建版本</a>
                <a class="action-link danger" onclick="event.stopPropagation(); openModelDelete(${model.id})">删除车型</a>
            </td>
        `;
        modelRow.querySelector('td:first-child').innerHTML = `<span class="expand-icon">▶</span>`;
        tbody.appendChild(modelRow);

        // 版本行容器
        const versionWrap = document.createElement('tr');
        versionWrap.className = 'version-wrap';
        versionWrap.id = 'versions-' + model.id;
        versionWrap.innerHTML = `
            <td colspan="9">
                <div class="version-inner">
                    ${model.versions && model.versions.length ? '' : '<div class="empty-version-state">暂无版本。车型可以先建立，添加版本后才可用于车辆建档。<a class="action-link" href="./vehicle-model-new-version.html?modelId=' + model.id + '">立即新建版本</a></div>'}
                    <div class="version-scroll">
                    <table class="version-table">
                        <thead>
                            <tr>
                                <th class="col-center" style="width:50px"><input type="checkbox" onchange="toggleVersionCheckAll(${model.id},this)"></th>
                                <th class="col-center" style="width:140px">车型版本</th>
                                <th class="col-center" style="width:160px">车辆型号</th>
                                <th class="col-center" style="width:160px">整车厂商</th>
                                <th class="col-center" style="width:100px">创建人</th>
                                <th class="col-center" style="width:180px">创建时间</th>
                                <th class="col-center" style="width:100px">更新人</th>
                                <th class="col-center" style="width:180px">更新时间</th>
                                <th class="col-center" style="width:280px">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(model.versions || []).map(v => {
                                const ck = selectedVersionIds.has(v.id) ? 'checked' : '';
                                return `<tr>
                                    <td class="col-center"><input type="checkbox" data-vid="${v.id}" ${ck} onchange="toggleVersionCheck(${v.id},this)"></td>
                                    <td class="col-center">${v.version}</td>
                                    <td class="col-center ellipsis" title="${v.vehicle_model}">${v.vehicle_model}</td>
                                    <td class="col-center ellipsis cell-mfr" title="${v.manufacturer}">${v.manufacturer}</td>
                                    <td class="col-center">${v.creator || '—'}</td>
                                    <td class="col-center">${v.create_time || '—'}</td>
                                    <td class="col-center">${v.updater || '—'}</td>
                                    <td class="col-center">${v.update_time || '—'}</td>
                                    <td class="col-center">
                                        <a class="action-link" href="./vehicle-model-detail.html?id=${v.id}&modelId=${model.id}&mode=view">版本详情</a>
                                        <a class="action-link" href="./vehicle-model-detail.html?id=${v.id}&modelId=${model.id}&mode=edit">编辑版本</a>
                                        <a class="action-link" href="./vehicle-model-new-version.html?modelId=${model.id}&baseVersionId=${v.id}">新建版本</a>
                                        <a class="action-link danger" onclick="openDeleteModal(${v.id})">删除版本</a>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    </div>
                </div>
            </td>
        `;
        tbody.appendChild(versionWrap);
    });

    document.getElementById('totalCount').textContent = filteredModels.length;
    // 分页：对象签名，pageInfoId 用于显示「第 X / Y 页」
    Common.renderPagination({
        total: filteredModels.length,
        currentPage,
        pageSize,
        containerId: 'paginationEl',
        infoId: 'totalCount',
        pageInfoId: 'pageInfo',
        onPageChange: (p) => {
            currentPage = p;
            clearSelection();  // 翻页清空选中：PRD 不支持跨页导出
            renderTable();
        }
    });
}

function toggleModelExpand(modelId) {
    const wrap = document.getElementById('versions-' + modelId);
    const row = document.querySelector('.model-row[data-model-id="' + modelId + '"]');
    if (!wrap || !row) return;
    const isShow = wrap.classList.contains('show');
    if (isShow) {
        wrap.classList.remove('show');
        row.classList.remove('expanded');
    } else {
        wrap.classList.add('show');
        row.classList.add('expanded');
    }
}

function toggleVersionCheck(vid, cb) {
    if (cb.checked) selectedVersionIds.add(vid);
    else selectedVersionIds.delete(vid);
}

function toggleVersionCheckAll(modelId, cb) {
    const wrap = document.getElementById('versions-' + modelId);
    if (!wrap) return;
    const checks = wrap.querySelectorAll('input[type="checkbox"][data-vid]');
    checks.forEach(c => {
        c.checked = cb.checked;
        const vid = parseInt(c.dataset.vid);
        if (cb.checked) selectedVersionIds.add(vid);
        else selectedVersionIds.delete(vid);
    });
}

/* 查询条件的「展开更多/收起」由 components/filter-component.js 统一接管（legacy 自动绑定模式），
   页面不再自建 toggleExpand()，避免与通用组件两份实现并存 */

function doSearch() {
    const name = document.getElementById('s_model_name').value.trim();
    const nameEn = document.getElementById('s_model_name_en').value.trim();
    const version = document.getElementById('s_model_version').value.trim();
    const alias = document.getElementById('s_model_alias').value;
    const code = document.getElementById('s_model_code').value.trim();
    const source = document.getElementById('s_model_source').value;
    const power = document.getElementById('s_power_type').value;
    const emission = document.getElementById('s_emission_std').value;
    const mfr = document.getElementById('s_manufacturer').value.trim();
    const creator = document.getElementById('s_creator').value.trim();
    const d1 = document.getElementById('s_create_start').value;
    const d2 = document.getElementById('s_create_end').value;

    filteredModels = ModelStore.all().filter(m => {
        if (name && !m.model_name.includes(name)) return false;
        if (nameEn && !m.model_name_en.includes(nameEn)) return false;
        if (alias && m.model_alias !== alias) return false;
        if (code && !m.model_code.includes(code)) return false;
        if (source && m.model_source !== source) return false;
        if (creator && !m.creator.includes(creator)) return false;
        if (d1 && m.create_time < d1 + ' 00:00:00') return false;
        if (d2 && m.create_time > d2 + ' 23:59:59') return false;
        // 版本级字段查询
        const vMatch = m.versions.some(v => {
            if (version && !v.version.includes(version)) return false;
            if (power && v.power_type !== power) return false;
            if (emission && v.emission_std !== emission) return false;
            if (mfr && !v.manufacturer.includes(mfr)) return false;
            return true;
        });
        if ((version || power || emission || mfr) && !vMatch) return false;
        return true;
    });
    currentPage = 1;
    clearSelection();  // 重新查询清空选中：PRD 不支持跨页导出
    renderTable();
}

function doReset() {
    document.getElementById('s_model_name').value = '';
    document.getElementById('s_model_name_en').value = '';
    document.getElementById('s_model_version').value = '';
    document.getElementById('s_model_alias').value = '';
    document.getElementById('s_model_code').value = '';
    document.getElementById('s_model_source').value = '';
    document.getElementById('s_power_type').value = '';
    document.getElementById('s_emission_std').value = '';
    document.getElementById('s_manufacturer').value = '';
    document.getElementById('s_creator').value = '';
    document.getElementById('s_create_start').value = '';
    document.getElementById('s_create_end').value = '';
    filteredModels = ModelStore.all();
    currentPage = 1;
    clearSelection();
    renderTable();
}

function changePageSize() {
    pageSize = parseInt(document.getElementById('pageSizeSelect').value);
    currentPage = 1;
    clearSelection();  // 切换每页条数清空选中：PRD 不支持跨页导出
    renderTable();
}

// ===== 导出：选中则导出选中数据，未选中则弹窗确认全量导出 =====
function doExport() {
    const models = sortModelsDesc(filteredModels);
    ListExport.run({
        rows: models.flatMap(model => model.versions || []), selectedIds: selectedVersionIds,
        pageRows: models.slice((currentPage - 1) * pageSize, currentPage * pageSize).flatMap(model => model.versions || []),
        onExport: (rows, scope) => Common.showToast(scope.selected
            ? '导出成功：已导出选中的 ' + rows.length + ' 条数据'
            : '导出成功：已导出当前筛选条件下的所有数据（共 ' + models.length + ' 条）', 'success')
    });
}





// ===== 删除：先校验引用关系，再二次确认（统一使用 Common.confirm，取消页面内 deleteModal 自实现） =====
function openDeleteModal(vid) {
    const found = findVersion(vid);
    // PRD 3.6.2：版本删除校验「关联车辆数」——>0 一律不可物理删除（实时引用口径，不做连带删除）
    const refCount = found ? ModelStore.referencedVehicleCount(found.model.model_name, found.version.version) : 0;
    if (refCount > 0) {
        // 阻断弹窗仅展示关联车辆数量（不展示车牌明细），并提供「查看车辆」跳转（PRD 3.6.2 / 3.6.5）
        Common.confirm({
            title: '无法删除',
            content: '该车型版本已被 ' + refCount + ' 台车辆引用，不可删除。请先在车辆资产中解除相关车辆的车型引用后再删除。',
            okText: '我知道了',
            cancelText: '查看车辆',
            onOk: () => {},
            onCancel: () => gotoReferencedVehicles(found.model.model_name, found.version.version)
        });
        return;
    }
    // 二次确认：危险按钮高亮（danger:true）
    const text = found
        ? '确定要删除车型「' + found.model.model_name + ' ' + found.version.version + '」吗？删除后不可恢复。'
        : '确定要删除该车型版本吗？删除后不可恢复。';
    Common.confirm({
        title: '删除确认',
        content: text,
        okText: '确定',
        cancelText: '取消',
        danger: true,
        onOk: () => {
            ModelStore.deleteVersion(found.model.id, vid);
            filteredModels = ModelStore.all();
            renderTable();
            Common.showToast('版本删除成功，车型仍保留', 'success');
        }
    });
}

function openModelDelete(modelId) {
    const model = ModelStore.getModel(modelId);
    if (!model) return;
    // PRD 3.6.2：车型删除仅校验「是否仍存在版本」，不做车辆引用校验
    // （引用锚定在版本维度，无版本即必然不存在车辆引用，故车型可删时不会破坏引用关系）
    const versionCount = (model.versions || []).length;
    if (versionCount) {
        Common.confirm({
            title: '无法删除车型',
            content: '该车型仍有 ' + versionCount + ' 个版本，请先删除所属版本后再删除车型。若版本已被车辆引用，请先在车辆资产中解除相关车辆的引用。',
            okText: '我知道了',
            cancelText: '关闭',
            onOk: () => {}
        });
        return;
    }
    Common.confirm({
        title: '删除车型确认',
        content: '确定删除车型「' + model.model_name + '」吗？删除后不可恢复。',
        okText: '确定', cancelText: '取消', danger: true,
        onOk: () => {
            ModelStore.deleteModel(modelId);
            filteredModels = ModelStore.all();
            renderTable();
            Common.showToast('车型删除成功', 'success');
        }
    });
}

renderTable();
