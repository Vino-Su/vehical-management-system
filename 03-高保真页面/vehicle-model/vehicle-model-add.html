<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建车型信息</title>
    <!--
      页面用途：新建车型信息（车型 + 首个版本一次性录入）
      核心功能：车型信息 / 版本信息 / 主要参数信息 / 其他信息 四个分组的表单录入与必填校验，
                车型来源联动编码头，最大重量自动计算载重分类，底部固定操作栏（取消 / 确定）
      交互逻辑：标签左置外置（公共 .form-row，标签 120px + 间距 12px）；提交时逐项校验必填，
                校验失败在对应控件下方显示 .field-error 红字并高亮 .form-row.has-error，不通过则不提交
    -->
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/form.css">
    <style>
        /* ===== 表单分组标题：H3 20px / 600（规范一.2） ===== */
        .form-section { margin-bottom: 28px; }
        .form-section .section-title {
            font-size: 20px; font-weight: 600; line-height: 30px; color: var(--text-primary);
            padding-bottom: 12px; border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }
        .form-section .section-title::before {
            content: ''; display: inline-block; width: 3px; height: 16px; background: var(--primary); border-radius: 2px;
        }

        /* ===== 表单补充样式（标签左置外置、控件尺寸、focus/置灰、错误提示均复用 form.css .form-row） ===== */
        .form-row textarea { min-height: 80px; }
        .radio-group { display: flex; align-items: center; gap: 20px; height: 32px; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-primary); cursor: pointer; }
        /* 单选按钮需还原为控件自身尺寸，避免被 .form-row .control 内 32px 控件规则拉伸 */
        .radio-group input[type="radio"] { accent-color: var(--primary); height: auto; width: auto; padding: 0; }

        /* ===== 底部固定操作栏复用 form.css .footer-bar，页面内不再重复定义 ===== */
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <!-- form-page：内容区底部预留固定操作栏高度，避免最后一行表单项被遮挡（form.css） -->
        <div class="content form-page">
            <div class="page-container">
                <!-- 顶部操作栏：不用页面大标题，仅保留返回操作（规范二.5） -->
                <div class="action-bar">
                    <button class="btn push-right" onclick="window.location.href='./vehicle-model-list.html'">返回</button>
                </div>

                <form id="addForm" onsubmit="return false">
                    <!-- 车型信息 -->
                    <div class="form-section">
                        <div class="section-title">车型信息</div>
                        <div class="form-grid">
                            <div class="form-row">
                                <label><span class="required">*</span>车型来源</label>
                                <div class="control">
                                    <div class="radio-group">
                                        <label><input type="radio" name="model_source" value="自研" checked> 自研</label>
                                        <label><input type="radio" name="model_source" value="非自研"> 非自研</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>车型名称（中）</label>
                                <div class="control"><input type="text" id="f_model_name" placeholder="请输入车型名称，全局唯一"></div>
                            </div>
                            <div class="form-row">
                                <label>车型名称（英）</label>
                                <div class="control"><input type="text" id="f_model_name_en" placeholder="请输入英文名称，全局唯一"></div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>车型别名</label>
                                <div class="control">
                                    <select id="f_model_alias">
                                        <option value="">请选择</option>
                                        <option>扫路车</option>
                                        <option>运输车</option>
                                        <option>小型清洗机</option>
                                        <option>小型扫路机</option>
                                        <option>皮卡</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>用途分类</label>
                                <div class="control">
                                    <select id="f_vehicle_category">
                                        <option value="">请选择</option>
                                        <option>作业机动车</option>
                                        <option>非机动车</option>
                                        <option>乘用车</option>
                                        <option>其他</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <label>车型编码</label>
                                <div class="control"><input type="text" id="f_model_code" placeholder="请输入车型编码，全局唯一"></div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>编码头</label>
                                <div class="control">
                                    <select id="f_header_code">
                                        <option value="">请选择</option>
                                        <option value="5100">5100</option>
                                        <option value="5200">5200</option>
                                        <option value="5300">5300</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 版本信息 -->
                    <div class="form-section">
                        <div class="section-title">版本信息</div>
                        <div class="form-grid">
                            <div class="form-row">
                                <label><span class="required">*</span>车型版本</label>
                                <div class="control"><input type="text" id="f_version" placeholder="请输入版本号，如 V1.0"></div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>车辆型号</label>
                                <div class="control"><input type="text" id="f_vehicle_model" placeholder="如 C_UN_V0.6"></div>
                            </div>
                            <div class="form-row">
                                <label>历史车型编码</label>
                                <div class="control"><input type="text" id="f_old_model_code" readonly placeholder="暂不处理"></div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>动力类别</label>
                                <div class="control">
                                    <select id="f_power_type">
                                        <option value="">请选择</option>
                                        <option>纯电动</option>
                                        <option>柴油</option>
                                        <option>汽油</option>
                                        <option>混动</option>
                                        <option>天然气</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>排放标准</label>
                                <div class="control">
                                    <select id="f_emission_std">
                                        <option value="">请选择</option>
                                        <option>国三</option>
                                        <option>国四</option>
                                        <option>国五</option>
                                        <option>国六</option>
                                        <option>纯电动</option>
                                        <option>非道路移动机械</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 主要参数信息 -->
                    <div class="form-section">
                        <div class="section-title">主要参数信息</div>
                        <div class="form-grid">
                            <div class="form-row">
                                <label><span class="required">*</span>底盘厂商</label>
                                <div class="control"><input type="text" id="f_chassis_mfr" placeholder="请输入底盘厂商"></div>
                            </div>
                            <div class="form-row">
                                <label>底盘型号</label>
                                <div class="control"><input type="text" id="f_chassis_model" placeholder="请输入底盘型号"></div>
                            </div>
                            <div class="form-row">
                                <label><span class="required">*</span>整车厂商</label>
                                <div class="control"><input type="text" id="f_manufacturer" placeholder="请输入整车厂商"></div>
                            </div>
                            <div class="form-row">
                                <label>最大重量 (KG)</label>
                                <div class="control"><input type="number" id="f_max_weight" placeholder="请输入最大重量" oninput="calcLoadClass()"></div>
                            </div>
                            <div class="form-row">
                                <label>整车质量 (KG)</label>
                                <div class="control"><input type="number" id="f_curb_weight" placeholder="请输入整车质量"></div>
                            </div>
                            <div class="form-row">
                                <label>载重分类</label>
                                <div class="control"><input type="text" id="f_load_class" readonly placeholder="根据最大重量自动计算"></div>
                            </div>
                            <div class="form-row">
                                <label>主发动机厂家</label>
                                <div class="control"><input type="text" id="f_main_eng_mfr" placeholder="请输入主发动机厂家"></div>
                            </div>
                            <div class="form-row">
                                <label>主发动机型号/驱动电机型号</label>
                                <div class="control"><input type="text" id="f_main_eng_model" placeholder="请输入型号"></div>
                            </div>
                            <div class="form-row">
                                <label>驱动电机峰值功率 (KW)</label>
                                <div class="control"><input type="number" id="f_peak_power" placeholder="请输入功率"></div>
                            </div>
                            <div class="form-row">
                                <label>动力电池额定电压/容量(V/Ah)</label>
                                <div class="control"><input type="text" id="f_battery_spec" placeholder="如 380V/200Ah"></div>
                            </div>
                            <div class="form-row">
                                <label>最大清扫宽度(mm)</label>
                                <div class="control"><input type="number" id="f_max_sweep" placeholder="请输入清扫宽度"></div>
                            </div>
                            <div class="form-row">
                                <label>最大冲洗宽度(mm)</label>
                                <div class="control"><input type="number" id="f_max_wash" placeholder="请输入冲洗宽度"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 其他信息 -->
                    <div class="form-section">
                        <div class="section-title">其他信息</div>
                        <div class="form-grid form-grid--full">
                            <div class="form-row">
                                <label>备注</label>
                                <div class="control"><textarea id="f_remark" maxlength="500" placeholder="请输入备注信息，最多500字"></textarea></div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 底部操作栏（复用 form.css .footer-bar） -->
<div class="footer-bar">
    <button class="btn" onclick="window.location.href='./vehicle-model-list.html'">取消</button>
    <button class="btn btn-primary" onclick="doSave()">确定</button>
</div>

<script src="../components/common.js"></script>
<script>
Common.initLayout({
    basePath: '../',
    sidebarId: 'sidebar',
    activeMenuId: 'vehicle-model',
    headerId: 'header',
    headerOptions: { showProject: false }
});

// 车型来源联动编码头
const sourceRadios = document.querySelectorAll('input[name="model_source"]');
sourceRadios.forEach(r => {
    r.addEventListener('change', function() {
        const headerSelect = document.getElementById('f_header_code');
        if (this.value === '非自研') {
            headerSelect.value = '5100';
        } else {
            headerSelect.value = '';
        }
    });
});

function calcLoadClass() {
    const w = parseFloat(document.getElementById('f_max_weight').value);
    let cls = '';
    if (w >= 8000) cls = '重卡';
    else if (w > 3000) cls = '轻卡';
    else if (w > 0) cls = '微卡';
    document.getElementById('f_load_class').value = cls;
}

// ===== 表单校验：错误提示显示在控件下方（规范三.2）=====
function getFieldLabel(el) {
    const row = el.closest('.form-row');
    const label = row ? row.querySelector('label') : null;
    return label ? label.textContent.replace('*', '').trim() : '该项';
}

function clearFieldError(row) {
    row.classList.remove('has-error');
    const err = row.querySelector('.field-error');
    if (err) err.remove();
}

function clearAllFieldErrors() {
    document.querySelectorAll('#addForm .form-row.has-error').forEach(clearFieldError);
}

function showFieldError(el, msg) {
    const row = el.closest('.form-row');
    if (!row) return;
    clearFieldError(row);
    row.classList.add('has-error');
    const err = document.createElement('div');
    err.className = 'field-error';
    err.textContent = msg;
    (row.querySelector('.control') || row).appendChild(err);
}

// 输入/选择后即时清除该项错误提示
document.querySelectorAll('#addForm .form-row .control').forEach(ctrl => {
    ctrl.addEventListener('input', () => { const row = ctrl.closest('.form-row'); if (row) clearFieldError(row); });
    ctrl.addEventListener('change', () => { const row = ctrl.closest('.form-row'); if (row) clearFieldError(row); });
});

function doSave() {
    clearAllFieldErrors();
    // 必填校验
    const reqIds = [
        'f_model_name','f_model_alias','f_vehicle_category',
        'f_version','f_vehicle_model','f_power_type','f_emission_std',
        'f_chassis_mfr','f_manufacturer','f_header_code'
    ];
    for (const id of reqIds) {
        const el = document.getElementById(id);
        if (!el.value.trim()) {
            const label = getFieldLabel(el);
            showFieldError(el, (el.tagName === 'SELECT' ? '请选择' : '请输入') + label);
            Common.showToast('请完善必填项：' + label, 'warning');
            el.focus();
            return;
        }
    }
    Common.showToast('保存成功', 'success');
    setTimeout(() => {
        window.location.href = './vehicle-model-list.html';
    }, 800);
}
</script>
</body>
</html>
