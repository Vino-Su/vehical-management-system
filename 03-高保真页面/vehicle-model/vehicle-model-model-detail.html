<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车型详情</title>
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/form.css">
    <style>
        .info-section { margin-bottom: 28px; }
        .section-title { font-size: 20px; font-weight: 600; line-height: 30px; color: var(--text-primary); padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; display:flex; align-items:center; gap:8px; }
        .section-title::before { content:''; display:inline-block; width:3px; height:16px; background:var(--primary); border-radius:2px; }
        .info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 32px; }
        .info-field { display:flex; flex-direction:column; gap:2px; }
        .field-label { color:var(--text-secondary); font-size:14px; }
        .field-value { color:var(--text-primary); font-size:14px; min-height:22px; }
        .version-list { overflow-x:auto; }
        .version-list table { width:100%; min-width:1300px; border-collapse:collapse; }
        .version-list th,.version-list td { height:48px; padding:0 16px; border-bottom:1px solid var(--border-color); white-space:nowrap; text-align:center; font-size:14px; }
        .version-list th { background:#fafafa; font-weight:600; }
        .version-list tr:hover td { background:var(--bg-hover); }
        .empty-state { padding:24px; border:1px dashed var(--border-color); color:var(--text-secondary); }
        .edit-mode { display:none; }
        .edit-mode.show { display:block; }
        .view-mode.hide { display:none; }
        .danger-link { color:var(--error); cursor:pointer; }
        /* ===== 变更日志（车型级）：沿用版本详情页列口径，只读、倒序、不提供导出 ===== */
        .table-wrapper thead th.col-center { text-align:center; }
        .log-table { min-width:990px; }
    </style>
</head>
<body>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><div class="content" id="contentArea"><div class="page-container">
    <div class="action-bar"><button class="btn push-right" onclick="goBack()">关闭</button><button class="btn btn-primary" id="editBtn" onclick="enterEdit()">编辑车型</button><button class="btn btn-primary" onclick="newVersion()">新建版本</button></div>
    <div id="viewMode" class="view-mode">
        <div class="info-section"><div class="section-title">车型信息</div><div class="info-grid">
            <div class="info-field"><span class="field-label">车型来源</span><span class="field-value" id="v_source">—</span></div><div class="info-field"><span class="field-label">车型名称（中）</span><span class="field-value" id="v_name">—</span></div><div class="info-field"><span class="field-label">车型名称（英）</span><span class="field-value" id="v_name_en">—</span></div><div class="info-field"><span class="field-label">车型别名</span><span class="field-value" id="v_alias">—</span></div><div class="info-field"><span class="field-label">用途分类</span><span class="field-value" id="v_category">—</span></div><div class="info-field"><span class="field-label">车型编码</span><span class="field-value" id="v_code">—</span></div><div class="info-field"><span class="field-label">编码头</span><span class="field-value" id="v_header">—</span></div><div class="info-field"><span class="field-label">版本数量</span><span class="field-value" id="v_version_count">0</span></div>
        </div></div>
        <div class="info-section"><div class="section-title">关联版本</div><div class="version-list" id="versionList"></div></div>
        <div class="info-section"><div class="section-title">变更日志</div>
            <div class="table-wrapper"><table class="log-table">
                <thead><tr>
                    <th class="col-left" style="width:180px">操作对象</th>
                    <th class="col-center" style="width:90px">操作类型</th>
                    <th class="col-left" style="width:130px">修改字段</th>
                    <th class="col-left" style="width:120px">修改前</th>
                    <th class="col-left" style="width:120px">修改后</th>
                    <th class="col-left" style="width:90px">操作人</th>
                    <th class="col-center" style="width:170px">操作时间</th>
                    <th class="col-left" style="width:90px">操作来源</th>
                </tr></thead>
                <tbody id="modelLogTableBody"></tbody>
            </table></div>
        </div>
    </div>
    <div id="editMode" class="edit-mode"><form id="modelForm" onsubmit="return false"><div class="info-section"><div class="section-title">编辑车型信息</div><div class="form-grid">
        <div class="form-row"><label>车型来源</label><div class="control"><input type="text" id="e_source" readonly></div></div><div class="form-row"><label><span class="required">*</span>车型名称（中）</label><div class="control"><input type="text" id="e_name" placeholder="请输入车型名称，全局唯一"></div></div><div class="form-row"><label>车型名称（英）</label><div class="control"><input type="text" id="e_name_en" placeholder="请输入英文名称"></div></div><div class="form-row"><label><span class="required">*</span>车型别名</label><div class="control"><select id="e_alias"><option value="">请选择</option><option>扫路车</option><option>运输车</option><option>小型清洗机</option><option>小型扫路机</option><option>皮卡</option></select></div></div><div class="form-row"><label><span class="required">*</span>用途分类</label><div class="control"><select id="e_category"><option value="">请选择</option><option>作业机动车</option><option>非机动车</option><option>乘用车</option><option>其他</option></select></div></div><div class="form-row"><label>车型编码</label><div class="control"><input type="text" id="e_code" placeholder="请输入车型编码，全局唯一"></div></div><div class="form-row"><label>编码头</label><div class="control"><input type="text" id="e_header" readonly></div></div>
    </div></div></form></div>
</div></div></div><div class="edit-footer-bar" id="editFooter"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn btn-primary" onclick="saveModel()">确定</button></div></div>
<script src="../components/common.js"></script><script src="../components/vehicle-model-store.js"></script>
<script>
const params=new URLSearchParams(location.search), modelId=Number(params.get('modelId'))||1;
Common.initLayout({basePath:'../',sidebarId:'sidebar',activeMenuId:'vehicle-model',headerId:'header',headerOptions:{showProject:false}});
const seed=[{id:1,model_name:'麒麟清扫车',model_name_en:'Kirin Sweeper',model_alias:'扫路车',model_code:'QL-QJ-001',model_source:'自研',header_code:'5100',vehicle_category:'作业机动车',versions:[{id:101,version:'V1.0',vehicle_model:'C_UN_V0.6',manufacturer:'麒麟智能汽车',creator:'王强',create_time:'2025-03-15 10:30:00',updater:'王强',update_time:'2025-03-15 10:30:00'}]},{id:2,model_name:'爱瑞特纯电动高压冲洗车',model_name_en:'Airit Electric High Pressure Washer',model_alias:'小型清洗机',model_code:'ART-GY-001',model_source:'非自研',header_code:'5100',vehicle_category:'作业机动车',versions:[]}];
ModelStore.init(seed); let model=ModelStore.getModel(modelId); if(!model){model=ModelStore.getModel(1);}
// 引用校验数据源：统一走 ModelStore.referencedVehicleCount(modelName, version)（PRD 3.6.2 / 4.3）
// 版本删除阻断时跳转车辆资产列表并按车型名称 + 车型版本自动筛选（PRD 3.6.5）
function referencedVehiclesUrl(modelName,version){return '../vehicle-asset/vehicle-asset-list.html?modelName='+encodeURIComponent(modelName||'')+'&modelVersion='+encodeURIComponent(version||'');}
function gotoReferencedVehicles(modelName,version){location.href=referencedVehiclesUrl(modelName,version);}
function text(id,value){document.getElementById(id).textContent=value||'—';}
function render(){text('v_source',model.model_source);text('v_name',model.model_name);text('v_name_en',model.model_name_en);text('v_alias',model.model_alias);text('v_category',model.vehicle_category);text('v_code',model.model_code);text('v_header',model.header_code);text('v_version_count',(model.versions||[]).length); const box=document.getElementById('versionList'); const versions=model.versions||[]; versions.forEach(v=>{v.updater=v.updater||v.creator;v.update_time=v.update_time||v.create_time;}); box.innerHTML=versions.length?`<table><thead><tr><th>车型版本</th><th>车辆型号</th><th>整车厂商</th><th>创建人</th><th>创建时间</th><th>更新人</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${versions.map(v=>`<tr><td>${v.version||'—'}</td><td title="${v.vehicle_model||''}">${v.vehicle_model||'—'}</td><td title="${v.manufacturer||''}">${v.manufacturer||'—'}</td><td>${v.creator||'—'}</td><td>${v.create_time||'—'}</td><td>${v.updater||'—'}</td><td>${v.update_time||'—'}</td><td><a class="action-link" href="./vehicle-model-detail.html?id=${v.id}&modelId=${model.id}&mode=view">版本详情</a> <a class="action-link" href="./vehicle-model-detail.html?id=${v.id}&modelId=${model.id}&mode=edit">编辑版本</a> <a class="action-link" href="./vehicle-model-new-version.html?modelId=${model.id}&baseVersionId=${v.id}">新建版本</a> <a class="danger-link" onclick="deleteVersion(${v.id})">删除版本</a></td></tr>`).join('')}</tbody></table>`:`<div class="empty-state">暂无版本。添加版本后，该车型才可用于车辆建档。<a class="action-link" href="./vehicle-model-new-version.html?modelId=${model.id}">立即新建版本</a></div>`;}
// 车型级字段标签（写入车型变更日志用，与表单/查看态标签口径一致）
const MODEL_FIELD_LABELS={model_name:'车型名称（中）',model_name_en:'车型名称（英）',model_alias:'车型别名',vehicle_category:'用途分类',model_code:'车型编码'};
// 渲染车型级变更日志：仅本车型、只读、按操作时间倒序（PRD 4.6；版本级记录在版本详情页查看）
function renderLogs(){const tbody=document.getElementById('modelLogTableBody');const logs=ModelStore.logs({modelId:model.id,scope:'model'});tbody.innerHTML=logs.length?logs.map(log=>`<tr><td class="col-left ellipsis" title="${log.targetName||''}" style="max-width:180px">${log.targetName||'—'}</td><td class="col-center"><span class="tag tag-blue">${log.type}</span></td><td class="col-left ellipsis" title="${log.field||''}" style="max-width:130px">${log.field||'—'}</td><td class="col-left">${log.before||'—'}</td><td class="col-left">${log.after||'—'}</td><td class="col-left">${log.operator||'—'}</td><td class="col-center">${log.time||'—'}</td><td class="col-left">${log.source||'—'}</td></tr>`).join(''):`<tr><td colspan="8" class="col-center" style="color:var(--text-secondary)">暂无变更记录</td></tr>`;}
function enterEdit(){document.getElementById('viewMode').classList.add('hide');document.getElementById('editMode').classList.add('show');document.getElementById('editFooter').classList.add('show');document.getElementById('contentArea').classList.add('has-footer');document.getElementById('editBtn').style.display='none';document.getElementById('e_source').value=model.model_source;document.getElementById('e_name').value=model.model_name;document.getElementById('e_name_en').value=model.model_name_en||'';document.getElementById('e_alias').value=model.model_alias;document.getElementById('e_category').value=model.vehicle_category;document.getElementById('e_code').value=model.model_code||'';document.getElementById('e_header').value=model.header_code||'';}
function cancelEdit(){document.getElementById('viewMode').classList.remove('hide');document.getElementById('editMode').classList.remove('show');document.getElementById('editFooter').classList.remove('show');document.getElementById('contentArea').classList.remove('has-footer');document.getElementById('editBtn').style.display='';}
function saveModel(){const name=document.getElementById('e_name').value.trim(), alias=document.getElementById('e_alias').value, category=document.getElementById('e_category').value, code=document.getElementById('e_code').value.trim();if(!name||!alias||!category){Common.showToast('请完善车型必填项','warning');return;}const all=ModelStore.all();if(all.some(item=>item.id!==model.id&&item.model_name===name)){Common.showToast('车型名称（中）已存在','error');return;}if(code&&all.some(item=>item.id!==model.id&&item.model_code===code)){Common.showToast('车型编码已存在','error');return;}const before={model_name:model.model_name||'',model_name_en:model.model_name_en||'',model_alias:model.model_alias||'',vehicle_category:model.vehicle_category||'',model_code:model.model_code||''};model.model_name=name;model.model_name_en=document.getElementById('e_name_en').value.trim();model.model_alias=alias;model.vehicle_category=category;model.model_code=code;model.updater='当前用户';model.update_time=new Date().toISOString().slice(0,19).replace('T',' ');ModelStore.updateModel(model);ModelStore.appendChanges({scope:'model',modelId:model.id,targetId:model.id,targetName:model.model_name,labels:MODEL_FIELD_LABELS,before,after:{model_name:model.model_name||'',model_name_en:model.model_name_en||'',model_alias:model.model_alias||'',vehicle_category:model.vehicle_category||'',model_code:model.model_code||''},operator:'当前用户',source:'Web端'});render();renderLogs();cancelEdit();Common.showToast('车型信息保存成功','success');}
function newVersion(){location.href='./vehicle-model-new-version.html?modelId='+model.id;}
function deleteVersion(id){const v=(model.versions||[]).find(item=>Number(item.id)===Number(id));if(!v)return;const refCount=ModelStore.referencedVehicleCount(model.model_name,v.version);if(refCount>0){Common.confirm({title:'无法删除',content:'该车型版本已被 '+refCount+' 台车辆引用，不可删除。请先在车辆资产中解除相关车辆的车型引用后再删除。',okText:'我知道了',cancelText:'查看车辆',onOk:()=>{},onCancel:()=>gotoReferencedVehicles(model.model_name,v.version)});return;}Common.confirm({title:'删除版本确认',content:'确定删除「'+model.model_name+' '+v.version+'」吗？删除后不可恢复。',danger:true,onOk:()=>{ModelStore.deleteVersion(model.id,id);model=ModelStore.getModel(model.id);render();Common.showToast('版本删除成功','success');}});}
function goBack(){location.href='./vehicle-model-list.html';}
render();renderLogs();if(params.get('mode')==='edit')enterEdit();
</script></body></html>
