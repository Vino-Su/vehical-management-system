<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIM卡流量明细 - 车辆管理系统</title>
<link rel="stylesheet" href="../components/common.css">
<link rel="stylesheet" href="../components/fixed-table.css">
<link rel="stylesheet" href="../components/master-list.css">
<link rel="icon" href="data:,">
<!-- 页面用途：按单张 SIM 卡查询日/月流量明细。交互逻辑：左侧卡片分组选择，右侧按时间查询、分页选择与导出。 -->
<style>
  .traffic-workbench { display:grid; grid-template-columns:304px minmax(0,1fr); min-height:calc(100vh - 144px); border:1px solid var(--border-color); border-radius:var(--radius); overflow:hidden; background:#fff; }
  .traffic-detail { min-width:0; padding:16px; }
  .detail-controls { display:flex; align-items:flex-end; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .control-block { display:flex; align-items:center; gap:8px; }
  .control-label { color:var(--text-secondary); white-space:nowrap; }
  .date-field { display:flex; align-items:center; gap:8px; }
  .date-field input { width:142px; height:32px; padding:0 10px; border:1px solid var(--border-input); border-radius:var(--radius); color:var(--text-primary); outline:none; }
  .date-field input:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(22,119,255,.1); }
  .date-divider { color:var(--text-disabled); }
  .detail-actions { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .traffic-table { border-top:1px solid var(--border-color); }
  .traffic-table table { min-width:1530px; }
  .traffic-table th,.traffic-table td { text-align:center!important; }
  .traffic-table .usage { color:#0958d9; font-family:var(--font-number); font-weight:600; }
  .pagination-row { display:flex; justify-content:flex-end; align-items:center; gap:12px; padding-top:16px; flex-wrap:wrap; }
  .page-size { height:32px; padding:0 8px; border:1px solid var(--border-input); border-radius:var(--radius); background:#fff; }
  .empty-row { height:240px!important; color:var(--text-secondary)!important; text-align:center; }
  @media(max-width:1100px) { .traffic-workbench { grid-template-columns:264px minmax(0,1fr); }.detail-actions { width:100%; margin-left:0; justify-content:flex-end; } }
  @media(max-width:780px) { .traffic-workbench { display:block; }.date-field { flex-wrap:wrap; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <div id="header"></div>
    <main class="content">
      <section class="page-container">
        <div class="traffic-workbench">
          <aside class="master-panel" aria-label="SIM卡列表">
            <div class="master-heading">
              <h2 class="panel-title">SIM 卡列表</h2>
              <span class="panel-total" id="panelTotal">共 0 张</span>
            </div>
            <div class="master-filter" id="masterFilter">
              <div class="compact-field"><label for="filter-imsi">IMSI</label><input id="filter-imsi" type="text" placeholder="请输入 IMSI"></div>
              <div class="master-filter-extra" id="masterFilterExtra">
                <div class="compact-field"><label for="filter-vin">VIN码</label><input id="filter-vin" type="text" placeholder="请输入 VIN 码"></div>
                <div class="compact-field"><label for="filter-plan">套餐</label><select id="filter-plan"><option value="">全部</option><option>10G/月</option><option>30G/月</option><option>100G/月</option><option>300G/月</option><option value="__none__">无套餐</option></select></div>
                <div class="compact-field"><label for="filter-project">项目</label><select id="filter-project"><option value="">全部</option><option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option><option>镜湖区项目</option><option>鸠江项目</option><option>陵水项目</option><option value="__none__">无归属项目</option></select></div>
              </div>
              <div class="compact-actions">
                <button class="master-filter-toggle" id="masterFilterToggle" type="button" aria-expanded="false" aria-controls="masterFilterExtra" onclick="toggleAdvancedFilters()">
                  <span id="masterFilterToggleText">展开更多</span><span class="master-filter-chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="compact-action-buttons">
                  <button class="btn" type="button" onclick="resetCardFilters()">重置</button>
                  <button class="btn btn-primary" type="button" onclick="searchCards()">查询</button>
                </div>
              </div>
            </div>
            <div class="group-toolbar">
              <div class="segmented" id="group-mode" role="group" aria-label="SIM 卡分组方式"><button class="segment-btn" type="button" data-mode="carrier" onclick="changeGroup('carrier')">运营商</button><button class="segment-btn active" type="button" data-mode="plan" onclick="changeGroup('plan')">套餐</button><button class="segment-btn" type="button" data-mode="project" onclick="changeGroup('project')">项目</button></div>
              <span class="list-result" id="groupCount">0 个分组</span>
            </div>
            <div class="group-list" id="group-list"></div>
          </aside>
          <section class="traffic-detail" aria-label="SIM卡流量明细">
            <div class="detail-controls">
              <div class="control-block"><span class="control-label">统计粒度</span><div class="segmented" id="traffic-mode"><button class="segment-btn active" type="button" data-mode="day" onclick="changeTrafficMode('day')">日流量</button><button class="segment-btn" type="button" data-mode="month" onclick="changeTrafficMode('month')">月流量</button></div></div>
              <div class="control-block"><label class="control-label" for="start-date">时间范围</label><div class="date-field"><input id="start-date" type="date"><span class="date-divider">至</span><input id="end-date" type="date"></div></div>
              <div class="detail-actions"><button class="btn btn-primary" type="button" onclick="queryTraffic()">查询</button><button class="btn" type="button" onclick="resetDateRange()">重置</button><button class="btn" type="button" onclick="exportTraffic()">导出</button></div>
            </div>
            <div class="table-wrapper fixed-table traffic-table" data-fixed-first="1" data-fixed-last="2" data-fixed-min-width="1530"><table><thead><tr>
              <th class="col-center" style="width:54px"><input id="check-all" type="checkbox" aria-label="选择当前页全部数据" onchange="toggleCurrentPage(this.checked)"></th>
              <th class="col-center">IMSI</th><th class="col-center">运营商</th><th class="col-center">套餐</th><th class="col-center">VIN码</th><th class="col-center">车牌号</th><th class="col-center">归属项目</th><th class="col-center">硬件类型</th><th class="col-center">硬件识别码</th><th class="col-center">日期</th><th class="col-center">使用流量（GB）</th>
            </tr></thead><tbody id="traffic-body"></tbody></table></div>
            <div class="pagination-row"><span>共 <b id="total-count">0</b> 条</span><select class="page-size" id="page-size" aria-label="每页条数" onchange="changePageSize()"><option>10</option><option>20</option><option>50</option></select><span id="page-info">第 1 / 1 页</span><div id="pagination"></div></div>
          </section>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="../components/common.js"></script>
<script src="../components/export-component.js"></script>
<script src="../components/pagination-component.js"></script>
<script src="../components/filter-component.js"></script>
<script src="../components/fixed-table.js"></script>
<script src="../components/master-list.js"></script>
<script>
Common.initLayout({basePath:'../',sidebarId:'sidebar',activeMenuId:'sim-traffic-detail',headerId:'header',headerOptions:{showProject:false}});

const cards=[
  {id:1,imsi:'460011234567800',carrier:'中国联通',plan:'10G/月',vin:'LSVAU2A39EN000010',plate:'粤AEE078',project:'嘉定研发',type:'视频盒子',device:'VBX-2026-063',status:'正使用'},
  {id:2,imsi:'460011234567891',carrier:'中国联通',plan:'100G/月',vin:'LSVAU2A39EN000002',plate:'京ADG091',project:'椒北街道',type:'视频盒子',device:'VBX-2026-018',status:'正使用'},
  {id:3,imsi:'460011234567894',carrier:'中国联通',plan:'10G/月',vin:'LSVAU2A39EN000007',plate:'京ADJ055',project:'鸠江项目',type:'T-Box',device:'TBX-2026-032',status:'测试期'},
  {id:4,imsi:'460011234567897',carrier:'中国联通',plan:'10G/月',vin:'',plate:'',project:'',type:'',device:'',status:'库存期'},
  {id:5,imsi:'460011234567905',carrier:'中国联通',plan:'30G/月',vin:'LSVAU2A39EN000015',plate:'浙JDB1062',project:'镜湖区项目',type:'DTU',device:'DTU-2026-069',status:'正使用'},
  {id:6,imsi:'460031234567801',carrier:'中国电信',plan:'300G/月',vin:'LSVAU2A39EN000012',plate:'京ADG092',project:'鸠江项目',type:'ADU',device:'ADU-2026-012',status:'正使用'},
  {id:7,imsi:'460031234567892',carrier:'中国电信',plan:'30G/月',vin:'LSVAU2A39EN000003',plate:'浙JAR6538',project:'镜湖区项目',type:'DTU',device:'DTU-2026-027',status:'沉默期'},
  {id:8,imsi:'460031234567895',carrier:'中国电信',plan:'30G/月',vin:'LSVAU2A39EN000009',plate:'粤AEE077',project:'鸠江项目',type:'视频盒子',device:'VBX-2026-041',status:'停机保号'},
  {id:9,imsi:'460031234567898',carrier:'中国电信',plan:'30G/月',vin:'LSVAU2A39EN000005',plate:'浙JDB1062',project:'镜湖区项目',type:'DTU',device:'DTU-2026-054',status:'停机'},
  {id:10,imsi:'460031234567908',carrier:'中国电信',plan:'100G/月',vin:'LSVAU2A39EN000018',plate:'皖BAX218',project:'经开东区项目',type:'T-Box',device:'TBX-2026-072',status:'正使用'},
  {id:11,imsi:'460041234567890',carrier:'中国移动',plan:'10G/月',vin:'LSVAU2A39EN000001',plate:'京ADG090',project:'鸠江项目',type:'T-Box',device:'TBX-2026-001',status:'正使用'},
  {id:12,imsi:'460041234567893',carrier:'中国移动',plan:'300G/月',vin:'LSVAU2A39EN000006',plate:'沪AAB124',project:'嘉定研发',type:'ADU',device:'ADU-2026-006',status:'正使用'},
  {id:13,imsi:'460041234567896',carrier:'中国移动',plan:'100G/月',vin:'LSVAU2A39EN000011',plate:'京ADK033',project:'镜湖区项目',type:'T-Box',device:'TBX-2026-048',status:'正使用'},
  {id:14,imsi:'460041234567899',carrier:'中国移动',plan:'100G/月',vin:'LSVAU2A39EN000008',plate:'京ADJ056',project:'椒北街道',type:'T-Box',device:'TBX-2026-057',status:'预销号'},
  {id:15,imsi:'460041234567911',carrier:'中国移动',plan:'30G/月',vin:'LSVAU2A39EN000021',plate:'皖BAX221',project:'经开东区项目',type:'ADU',device:'ADU-2026-081',status:'正使用'},
  {id:16,imsi:'460041234567916',carrier:'中国移动',plan:'',vin:'LSVAU2A39EN000026',plate:'皖BAX226',project:'陵水项目',type:'T-Box',device:'TBX-2026-086',status:'测试期'}
];

let groupMode='plan';
let filteredCards=[...cards];
let activeCard=null;
let trafficMode='day';
let trafficRows=[];
let page=1;
let pageSize=10;
let filtersExpanded=false;
const selectedRows=new Set();

function cardSort(a,b){return a.imsi.localeCompare(b.imsi)}
function carrierDotClass(carrier){return carrier==='中国联通'?'is-danger':carrier==='中国电信'?'is-success':'is-info'}

// 左侧 SIM 卡主从列表：统一由公共组件管理分组、折叠、分批加载与选中态
const cardList=MasterList.init({
  container:'#group-list',
  totalEl:'#panelTotal',
  countEl:'#groupCount',
  totalText:count=>`共 ${count} 张`,
  items:()=>filteredCards,
  getId:card=>card.id,
  groupModes:[
    {key:'carrier',label:'运营商',of:card=>card.carrier},
    {key:'plan',label:'套餐',of:card=>card.plan},
    {key:'project',label:'项目',of:card=>card.project}
  ],
  defaultMode:'plan',
  sortItems:cardSort,
  sortGroups:(a,b)=>{
    if(a==='无分组') return 1;
    if(b==='无分组') return -1;
    if(groupMode==='plan'){
      const na=parseInt(a,10),nb=parseInt(b,10);
      if(!isNaN(na)&&!isNaN(nb)) return na-nb;
    }
    return a.localeCompare(b,'zh-CN');
  },
  isActive:card=>!!activeCard&&activeCard.id===card.id,
  activeGroupKey:()=>activeCard?(activeCard[groupMode]||'无分组'):null,
  renderCard:card=>({
    primary:card.imsi,
    primaryClass:'num',
    dot:carrierDotClass(card.carrier),
    dotTitle:card.carrier,
    meta:`${card.vin||'未绑定车辆'} · ${card.project||'无归属项目'}`
  }),
  batchSize:4,
  loadMoreText:remaining=>`显示更多 ${remaining} 张`,
  empty:{title:'暂无匹配的 SIM 卡',desc:'请调整筛选条件后重试'},
  onSelect:card=>selectCard(card.id)
});

function renderGroups(resetCollapse){
  if(resetCollapse) cardList.reset(); else cardList.render();
  if(!filteredCards.length) refreshTraffic();
}

function ensureActiveCard(){
  const ordered=filteredCards.slice().sort(cardSort);
  if(!activeCard||!ordered.some(card=>card.id===activeCard.id)) activeCard=ordered[0]||null;
}

function searchCards(){
  const imsi=document.getElementById('filter-imsi').value.trim();
  const vin=document.getElementById('filter-vin').value.trim().toLowerCase();
  const plan=document.getElementById('filter-plan').value;
  const project=document.getElementById('filter-project').value;
  const matchesSelect=(filterValue,cardValue)=>!filterValue||(filterValue==='__none__'?!cardValue:cardValue===filterValue);
  filteredCards=cards.filter(card=>(!imsi||card.imsi.includes(imsi))&&(!vin||card.vin.toLowerCase().includes(vin))&&matchesSelect(plan,card.plan)&&matchesSelect(project,card.project));
  ensureActiveCard();selectedRows.clear();page=1;renderGroups(true);refreshTraffic();
}

function setAdvancedFilters(expanded){filtersExpanded=expanded;document.getElementById('masterFilter').classList.toggle('is-expanded',expanded);const toggle=document.getElementById('masterFilterToggle');toggle.setAttribute('aria-expanded',String(expanded));document.getElementById('masterFilterToggleText').textContent=expanded?'收起':'展开更多'}
function toggleAdvancedFilters(){setAdvancedFilters(!filtersExpanded)}
function resetCardFilters(){document.getElementById('filter-imsi').value='';document.getElementById('filter-vin').value='';document.getElementById('filter-plan').value='';document.getElementById('filter-project').value='';filteredCards=[...cards];setAdvancedFilters(false);ensureActiveCard();selectedRows.clear();page=1;renderGroups(true);refreshTraffic()}
function changeGroup(mode){groupMode=mode;document.querySelectorAll('#group-mode button').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));cardList.setMode(mode)}
function selectCard(id){activeCard=cards.find(card=>card.id===id)||null;selectedRows.clear();page=1;renderGroups();refreshTraffic()}

function pad(value){return String(value).padStart(2,'0')}
function formatDate(date){return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`}
function formatMonth(date){return `${date.getFullYear()}-${pad(date.getMonth()+1)}`}
function parseLocal(value,mode){const parts=value.split('-').map(Number);return mode==='month'?new Date(parts[0],parts[1]-1,1):new Date(parts[0],parts[1]-1,parts[2])}
function setDefaultDates(){
  const end=new Date();
  const start=new Date(end);
  const startInput=document.getElementById('start-date');
  const endInput=document.getElementById('end-date');
  if(trafficMode==='day'){
    start.setDate(start.getDate()-29);startInput.type='date';endInput.type='date';startInput.value=formatDate(start);endInput.value=formatDate(end);
  }else{
    start.setDate(1);start.setMonth(start.getMonth()-11);startInput.type='month';endInput.type='month';startInput.value=formatMonth(start);endInput.value=formatMonth(end);
  }
}

function buildTrafficRows(){
  if(!activeCard) return [];
  const startValue=document.getElementById('start-date').value;
  const endValue=document.getElementById('end-date').value;
  if(!startValue||!endValue) return [];
  const start=parseLocal(startValue,trafficMode);
  const end=parseLocal(endValue,trafficMode);
  if(start>end) return null;
  const rows=[];
  const cursor=new Date(end);
  let index=0;
  while(cursor>=start&&index<730){
    const seed=Number(activeCard.imsi.slice(-4))%37;
    const usage=trafficMode==='day'?((seed*7+index*13)%82+8)/100:((seed*19+index*37)%2600+420)/100;
    const date=trafficMode==='day'?formatDate(cursor):formatMonth(cursor);
    rows.push({...activeCard,rowId:`${activeCard.id}-${trafficMode}-${date}`,date,usage:Number(usage.toFixed(2))});
    if(trafficMode==='day') cursor.setDate(cursor.getDate()-1);else cursor.setMonth(cursor.getMonth()-1);
    index++;
  }
  return rows;
}

// 右栏顶部已不展示选中对象标识，仅按当前选中 SIM 卡与时间范围刷新明细表格
function refreshTraffic(){trafficRows=buildTrafficRows()||[];renderTable()}

function renderTable(){
  const start=(page-1)*pageSize;
  const rows=trafficRows.slice(start,start+pageSize);
  const body=document.getElementById('traffic-body');
  body.innerHTML=rows.length?rows.map(row=>`<tr class="${selectedRows.has(row.rowId)?'selected':''}"><td class="col-center"><input type="checkbox" aria-label="选择 ${row.date} 流量明细" ${selectedRows.has(row.rowId)?'checked':''} onchange="toggleRow('${row.rowId}',this.checked)"></td><td class="col-center num">${row.imsi}</td><td class="col-center">${row.carrier}</td><td class="col-center">${row.plan||'--'}</td><td class="col-center num">${row.vin||'--'}</td><td class="col-center">${row.plate||'--'}</td><td class="col-center">${row.project||'--'}</td><td class="col-center">${row.type||'--'}</td><td class="col-center num">${row.device||'--'}</td><td class="col-center num">${row.date}</td><td class="col-center usage">${row.usage.toFixed(2)}</td></tr>`).join(''):'<tr><td class="empty-row" colspan="11">当前时间范围内暂无流量明细</td></tr>';
  document.getElementById('check-all').checked=rows.length>0&&rows.every(row=>selectedRows.has(row.rowId));
  Common.renderPagination({total:trafficRows.length,currentPage:page,pageSize,containerId:'pagination',infoId:'total-count',pageInfoId:'page-info',onPageChange:next=>{page=next;renderTable()}});
}

function changeTrafficMode(mode){trafficMode=mode;document.querySelectorAll('#traffic-mode button').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));selectedRows.clear();page=1;setDefaultDates();refreshTraffic()}
function resetDateRange(){selectedRows.clear();page=1;setDefaultDates();refreshTraffic()}
function queryTraffic(){const rows=buildTrafficRows();if(rows===null){Common.showToast('开始时间不能晚于结束时间','error');return}trafficRows=rows;selectedRows.clear();page=1;renderTable()}
function changePageSize(){pageSize=Number(document.getElementById('page-size').value);page=1;renderTable()}
function toggleRow(rowId,checked){checked?selectedRows.add(rowId):selectedRows.delete(rowId);renderTable()}
function toggleCurrentPage(checked){trafficRows.slice((page-1)*pageSize,page*pageSize).forEach(row=>checked?selectedRows.add(row.rowId):selectedRows.delete(row.rowId));renderTable()}
function exportTraffic(){
  ListExport.run({rows:trafficRows,selectedIds:selectedRows,currentPage:page,pageSize,getId:row=>row.rowId,
    onExport:(rows,scope)=>Common.showToast(scope.selected
      ? `已导出选中的 ${rows.length} 条流量明细（原型演示）`
      : '已生成流量明细导出文件（原型演示）','success')});
}

document.getElementById('filter-imsi').addEventListener('keydown',event=>{if(event.key==='Enter')searchCards()});
document.getElementById('filter-vin').addEventListener('keydown',event=>{if(event.key==='Enter')searchCards()});
ensureActiveCard();setDefaultDates();renderGroups();refreshTraffic();
</script>
</body>
</html>
