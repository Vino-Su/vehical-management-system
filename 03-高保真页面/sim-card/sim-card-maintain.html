<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SIM卡信息维护 - 车辆管理系统</title>
<link rel="stylesheet" href="../components/common.css"><link rel="stylesheet" href="../components/form.css">
<!-- 页面用途：维护 SIM 卡关联的车辆和终端。交互逻辑：VIN 码和车牌号可任一选取并双向联动；选定车辆后加载该车辆可用硬件。 -->
<style>
  .record-tip { margin:0 0 24px; padding:10px 12px; border:1px solid #91caff; border-radius:var(--radius); background:#e6f4ff; color:#0958d9; font-size:13px; line-height:20px; }.record-tip strong{font-weight:600}.readonly-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px 24px; margin-bottom:28px; padding:16px; border-radius:var(--radius); background:#fafafa; }.readonly-item span{display:block}.readonly-label{font-size:12px;color:var(--text-secondary);line-height:18px}.readonly-value{margin-top:4px;font-family:var(--font-din);font-size:14px;color:var(--text-primary)}.vehicle-hint{padding:5px 0 0 132px;font-size:12px;line-height:18px;color:var(--text-secondary)}.footer-bar{z-index:20}@media(max-width:900px){.readonly-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.vehicle-hint{padding-left:0}.content{padding:16px}}
</style>
</head>
<body><div class="layout form-layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content form-page"><section class="page-container">
  <div class="page-header"><h2 class="section-title">SIM 卡信息维护</h2><a class="btn" href="./sim-card-detail.html?id=1">返回详情</a></div>
  <div class="readonly-grid"><div class="readonly-item"><span class="readonly-label">IMSI</span><span class="readonly-value">460041234567890</span></div><div class="readonly-item"><span class="readonly-label">MSISDN</span><span class="readonly-value">13916881234</span></div><div class="readonly-item"><span class="readonly-label">ICCID</span><span class="readonly-value">898600F202601001</span></div></div>
  <div class="record-tip"><strong>绑定记录：</strong>保存本次维护后，系统将自动新增一条 SIM 卡与车辆终端的绑定记录。</div>
  <h2 class="section-title">关联终端信息</h2>
  <div class="form-grid"><div class="form-row"><label><span class="required">*</span>VIN 码</label><div class="control"><select id="vin" onchange="syncVehicle('vin')"><option value="">请选择 VIN 码</option></select><div class="field-error" id="vin-error" style="display:none">请选择车辆</div></div></div><div class="form-row"><label><span class="required">*</span>车牌号</label><div class="control"><select id="plate" onchange="syncVehicle('plate')"><option value="">请选择车牌号</option></select><div class="field-error" id="plate-error" style="display:none">请选择车辆</div></div></div></div>
  <p class="vehicle-hint">支持任选 VIN 码或车牌号，另一个字段将自动联动。</p>
  <div class="form-grid"><div class="form-row"><label><span class="required">*</span>硬件识别码</label><div class="control"><select id="device" onchange="updateDeviceMeta()"><option value="">请先选择车辆</option></select><div class="field-error" id="device-error" style="display:none">请选择硬件识别码</div></div></div><div class="form-row"><label>硬件类型</label><div class="control"><input id="type" value="--" readonly></div></div></div>
  <div class="form-grid"><div class="form-row"><label>归属项目</label><div class="control"><input id="project" value="--" readonly></div></div></div>
</section></main></div></div><footer class="footer-bar"><button class="btn" onclick="backToDetail()">取消</button><button class="btn btn-primary" onclick="save()">保存</button></footer>
<script src="../components/common.js"></script><script>
Common.initLayout({basePath:'../',sidebarId:'sidebar',activeMenuId:'sim-ledger',headerId:'header',headerOptions:{showProject:false}});
const simRecords=[{id:1,imsi:'460041234567890',msisdn:'13916881234',iccid:'898600F202601001',vin:'LSVAU2A39EN000001',device:'TBX-2026-001'},{id:2,imsi:'460011234567891',msisdn:'18602185678',iccid:'898601F202601002',vin:'LSVAU2A39EN000002',device:'VBX-2026-018'},{id:8,imsi:'460011234567897',msisdn:'18602189876',iccid:'898601F202601008',vin:'',device:''}];
const params=new URLSearchParams(window.location.search);const activeSim=simRecords.find(card=>card.imsi===params.get('imsi')||String(card.id)===params.get('id'))||simRecords[0];
const vehicles=[{vin:'LSVAU2A39EN000001',plate:'京ADG090',project:'鸠江项目',devices:[{code:'TBX-2026-001',type:'T-Box',imsi:'460041234567890'},{code:'VBX-2026-009',type:'视频盒子',imsi:''}]},{vin:'LSVAU2A39EN000002',plate:'京ADG091',project:'椒北街道',devices:[{code:'VBX-2026-018',type:'视频盒子',imsi:'460011234567891'},{code:'DTU-2026-020',type:'DTU',imsi:''}]},{vin:'LSVAU2A39EN000006',plate:'沪AAB124',project:'嘉定研发',devices:[{code:'ADU-2026-006',type:'ADU',imsi:'460041234567893'},{code:'TBX-2026-025',type:'T-Box',imsi:''}]}];
const vin=document.getElementById('vin'),plate=document.getElementById('plate'),device=document.getElementById('device');document.querySelectorAll('.readonly-value')[0].textContent=activeSim.imsi;document.querySelectorAll('.readonly-value')[1].textContent=activeSim.msisdn;document.querySelectorAll('.readonly-value')[2].textContent=activeSim.iccid;vehicles.forEach(v=>{vin.add(new Option(v.vin,v.vin));plate.add(new Option(v.plate,v.plate))});vin.value=activeSim.vin||vehicles[0].vin;syncVehicle('vin');
function current(){return vehicles.find(v=>v.vin===vin.value||v.plate===plate.value)}function eligibleDevices(v){return v.devices.filter(d=>!d.imsi||d.imsi===activeSim.imsi)}function syncVehicle(source){const v=source==='vin'?vehicles.find(x=>x.vin===vin.value):vehicles.find(x=>x.plate===plate.value);if(!v){plate.value='';device.innerHTML='<option value="">请先选择车辆</option>';return}vin.value=v.vin;plate.value=v.plate;document.getElementById('project').value=v.project;const choices=eligibleDevices(v);device.innerHTML='<option value="">请选择硬件识别码</option>'+choices.map(d=>`<option value="${d.code}">${d.code}</option>`).join('');device.value=choices.find(d=>d.code===activeSim.device)?.code||choices[0]?.code||'';updateDeviceMeta();document.querySelectorAll('.field-error').forEach(x=>x.style.display='none')}
function updateDeviceMeta(){const v=current(),d=v&&v.devices.find(x=>x.code===device.value);document.getElementById('type').value=d?d.type:'--'}function backToDetail(){location.href=`./sim-card-detail.html?imsi=${encodeURIComponent(activeSim.imsi)}`}function save(){const valid=vin.value&&plate.value&&device.value;document.getElementById('vin-error').style.display=vin.value?'none':'block';document.getElementById('plate-error').style.display=plate.value?'none':'block';document.getElementById('device-error').style.display=device.value?'none':'block';if(!valid)return;vehicles.forEach(v=>v.devices.forEach(d=>{if(d.imsi===activeSim.imsi)d.imsi=''}));current().devices.find(d=>d.code===device.value).imsi=activeSim.imsi;Common.showToast('保存成功，已新增绑定记录','success');setTimeout(backToDetail,650)}
</script></body></html>
