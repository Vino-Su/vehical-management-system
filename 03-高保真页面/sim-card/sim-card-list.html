<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIM卡台账 - 车辆管理系统</title>
<link rel="stylesheet" href="../components/common.css">
<link rel="stylesheet" href="../components/fixed-table.css">
<link rel="stylesheet" href="../components/modal-form.css">
<link rel="stylesheet" href="../components/search-select.css">
<link rel="icon" href="data:,">
<!-- 页面用途：SIM 卡台账列表，支持多条件筛选、选择与导出。交互逻辑：筛选/重置回到第一页；未选数据导出时二次确认。 -->
<style>
  .search-item { display:none; align-items:center; gap:8px; }
  .search-item.visible { display:flex; }
  .search-item label { color:var(--text-secondary); white-space:nowrap; }
  .search-item input,.search-item select { width:178px; height:32px; padding:0 12px; border:1px solid var(--border-input); border-radius:var(--radius); background:#fff; color:var(--text-primary); outline:none; }
  .search-item input:focus,.search-item select:focus { border-color:var(--primary); }
  .search-actions { display:flex; align-items:center; gap:12px; margin-left:auto; }
  .toggle-expand { color:var(--primary); cursor:pointer; white-space:nowrap; }
  .meter { min-width:150px; display:flex; flex-direction:column; gap:5px; }
  .meter-top { display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:var(--font-din); font-size:13px; white-space:nowrap; }
  .meter-track { width:100%; height:7px; overflow:hidden; border-radius:4px; background:#edf2f7; }
  .meter-fill { display:block; height:100%; border-radius:4px; background:#52c41a; }
  .meter-fill.warn { background:#faad14; }.meter-fill.over { background:#ff4d4f; }
  .over-text { color:var(--error); font-size:12px; }
  .status-cell { display:flex; align-items:center; gap:6px; }
  .table-wrapper { border-top:1px solid var(--border-color); }
  .table-wrapper table { min-width:1640px; }
  .pagination-row { display:flex; justify-content:flex-end; align-items:center; gap:12px; padding-top:16px; flex-wrap:wrap; }
  .page-size { height:32px; border:1px solid var(--border-input); border-radius:var(--radius); padding:0 8px; background:#fff; }
  .operation-links { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  /* 表头字段说明：图标留在表头内，气泡挂载 body 并固定定位，避免被 .fixed-table 横向滚动容器裁切或撑宽滚动区 */
  .th-tip { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin-left:4px; flex:0 0 auto; border:1px solid var(--text-secondary); border-radius:50%; color:var(--text-secondary); cursor:help; font-size:10px; line-height:1; vertical-align:middle; outline:none; }
  .th-tip:hover,.th-tip:focus-visible { border-color:var(--primary); color:var(--primary); }
  .th-tip-bubble { position:fixed; z-index:2000; box-sizing:border-box; max-width:280px; padding:6px 10px; border-radius:var(--radius); background:#000000d9; color:#fff; font-size:12px; font-weight:400; line-height:18px; text-align:left; white-space:normal; opacity:0; visibility:hidden; transform:translateY(-4px); transition:opacity .15s ease, transform .15s ease, visibility .15s; pointer-events:none; }
  .th-tip-bubble::after { position:absolute; bottom:100%; left:var(--arrow-x, 50%); margin-left:-5px; border:5px solid transparent; border-bottom-color:#000000d9; content:""; }
  .th-tip-bubble.is-visible { opacity:1; visibility:visible; transform:translateY(0); }
  @media(max-width:900px) { .search-actions { margin-left:0; }.content { padding:16px; } }
</style>
</head>
<body>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content"><section class="page-container">
  <div class="search-bar"><div class="search-row">
    <div class="search-item visible"><label>IMSI</label><input id="f-imsi" placeholder="请输入 IMSI"></div>
    <div class="search-item visible"><label>MSISDN</label><input id="f-msisdn" placeholder="请输入 MSISDN"></div>
    <div class="search-item visible"><label>ICCID</label><input id="f-iccid" placeholder="请输入 ICCID"></div>
    <div class="search-item"><label>运营商</label><select id="f-carrier"><option value="">全部</option><option>中国移动</option><option>中国联通</option><option>中国电信</option></select></div>
    <div class="search-item"><label>卡状态</label><select id="f-status"><option value="">全部</option><option>正使用</option><option>停机</option><option>预销号</option><option>测试期</option><option>销号</option><option>沉默期</option><option>停机保号</option><option>未知</option><option>库存期</option></select></div>
    <div class="search-item"><label>套餐</label><select id="f-plan"><option value="">全部</option><option>10G/月</option><option>30G/月</option><option>100G/月</option><option>300G/月</option></select></div>
    <div class="search-item"><label>是否超套餐</label><select id="f-over"><option value="">全部</option><option value="yes">是</option><option value="no">否</option></select></div>
    <div class="search-item"><label>车架号</label><input id="f-vin" placeholder="请输入车架号"></div>
    <div class="search-item"><label>车牌号</label><input id="f-plate" placeholder="请输入车牌号"></div>
    <div class="search-item"><label>归属项目</label><select id="f-project"><option value="">全部</option><option>鸠江项目</option><option>嘉定研发</option><option>镜湖区项目</option><option>椒北街道</option></select></div>
    <div class="search-item"><label>硬件识别码</label><input id="f-device" placeholder="请输入硬件识别码"></div>
    <div class="search-actions"><button class="btn btn-primary" type="button" onclick="search()">查询</button><button class="btn" type="button" onclick="resetFilters()">重置</button><a class="toggle-expand" id="toggle" onclick="toggleFilters()">展开 ▾</a></div>
  </div></div>
  <div class="action-bar"><button class="btn push-right" type="button" onclick="exportData()">导出</button></div>
  <div class="table-wrapper fixed-table" data-fixed-first="1" data-fixed-last="1" data-fixed-min-width="1500"><table><thead><tr>
    <th class="col-center" style="width:54px"><input id="check-all" type="checkbox" onchange="checkAll(this)"></th><th class="col-center">IMSI<span class="th-tip" tabindex="0" role="img" aria-label="IMSI 字段说明：国际移动用户识别码（移动电话根据IMSI码计费）" data-tip="国际移动用户识别码（移动电话根据IMSI码计费）">?</span></th><th class="col-center">MSISDN<span class="th-tip" tabindex="0" role="img" aria-label="MSISDN 字段说明：移动基站ISDN号码（物联网卡电话号码）" data-tip="移动基站ISDN号码（物联网卡电话号码）">?</span></th><th class="col-center">ICCID<span class="th-tip" tabindex="0" role="img" aria-label="ICCID 字段说明：集成电路卡识别码（即SIM卡卡号）" data-tip="集成电路卡识别码（即SIM卡卡号）">?</span></th><th class="col-left">运营商</th><th class="col-left">套餐</th><th class="col-left">当前周期流量使用情况</th><th class="col-center">车架号</th><th class="col-left">车牌号</th><th class="col-left">归属项目</th><th class="col-left">硬件类型</th><th class="col-center">硬件识别码</th><th class="col-center">操作</th>
  </tr></thead><tbody id="table-body"></tbody></table></div>
  <div class="pagination-row"><span>共 <b id="total-count">0</b> 条</span><select class="page-size" id="page-size" onchange="changePageSize()"><option>10</option><option>20</option><option>50</option></select><span id="page-info">第 1 / 1 页</span><div id="pagination"></div></div>
</section></main></div></div>

<!-- 信息维护弹窗：车辆仅用于定位终端，保存后关闭弹窗并由系统新增一条绑定记录 -->
<div class="modal-overlay" id="simBindingModal"><div class="modal-box binding-modal" role="dialog" aria-modal="true" aria-labelledby="simBindingModalTitle"><div class="modal-header"><h3 id="simBindingModalTitle">信息维护</h3><button class="modal-close" type="button" onclick="Common.closeModal('simBindingModal')" aria-label="关闭">×</button></div><div class="modal-body"><div class="binding-preview"><strong id="simBindingImsi">—</strong><span id="simBindingCarrier">—</span></div><form id="simBindingForm" onsubmit="return saveSimBinding(event)"><div class="field-grid"><div class="field full"><label>车辆（定位终端）</label><div id="simBindingVehicle"></div></div><div class="field full"><label>硬件识别码</label><div id="simBindingDevice"></div></div><div class="field"><label>硬件类型</label><input id="simBindingType" value="—" readonly></div><div class="field"><label>归属项目</label><input id="simBindingProject" value="—" readonly></div><div class="form-tip">车辆仅用于定位终端，不改变设备与车辆的绑定关系；同一硬件同一时间只能绑定一张 SIM 卡，清空硬件识别码即解除绑定。保存后系统自动新增一条绑定记录。</div></div></form></div><div class="modal-footer"><button class="btn" type="button" onclick="Common.closeModal('simBindingModal')">取消</button><button class="btn btn-primary" type="submit" form="simBindingForm">保存绑定</button></div></div></div>

<script src="../components/common.js"></script>
<script src="../components/export-component.js"></script><script src="../components/pagination-component.js"></script><script src="../components/filter-component.js"></script><script src="../components/fixed-table.js"></script><script src="../components/search-select.js"></script><script src="../components/fleet-data.js"></script>
<script>
Common.initLayout({basePath:'../',sidebarId:'sidebar',activeMenuId:'sim-ledger',headerId:'header',headerOptions:{showProject:false}});
let data=simRows();
let filtered=[...data],page=1,size=10,selected=new Set(),expanded=false;
function tag(s){const m={'正使用':'tag-green','测试期':'tag-blue','沉默期':'tag-orange','停机':'tag-red','停机保号':'tag-purple','预销号':'tag-yellow','库存期':'tag-default','未知':'tag-default'};return `<span class="tag ${m[s]||'tag-default'}">${s}</span>`}
function render(){const rows=filtered.slice((page-1)*size,page*size),body=document.getElementById('table-body');body.innerHTML=rows.map(x=>{const q=x.quotaGb,p=Math.round(x.usedGb/q*100),c=p>100?'over':p>80?'warn':'',w=Math.min(p,100);return `<tr class="${selected.has(x.id)?'selected':''}"><td class="col-center"><input type="checkbox" ${selected.has(x.id)?'checked':''} onchange="toggleOne(${x.id},this.checked)"></td><td class="col-center num">${x.imsi}</td><td class="col-center num">${x.msisdn}</td><td class="col-center num">${x.iccid}</td><td>${x.carrier}</td><td>${x.plan}</td><td><div class="meter"><div class="meter-top"><span>${x.usedGb.toFixed(1)}G / ${q}G</span>${p>100?'<span class="over-text">超套餐</span>':`<span>${p}%</span>`}</div><div class="meter-track"><i class="meter-fill ${c}" style="width:${w}%"></i></div></div></td><td class="col-center num">${x.vin||'--'}</td><td>${x.plate||'--'}</td><td>${x.project||'--'}</td><td>${x.type||'--'}</td><td class="col-center num">${x.device||'--'}</td><td class="col-center"><span class="operation-links"><a class="btn-link" href="./sim-card-detail.html?imsi=${x.imsi}">详情</a><a class="btn-link" href="javascript:;" onclick="openSimBinding('${x.imsi}')">信息维护</a></span></td></tr>`}).join('');document.getElementById('check-all').checked=rows.length>0&&rows.every(x=>selected.has(x.id));Common.renderPagination({total:filtered.length,currentPage:page,pageSize:size,containerId:'pagination',infoId:'total-count',pageInfoId:'page-info',onPageChange:p=>{page=p;render()}});}
function filterText(id,key,x){const v=document.getElementById(id).value.trim().toLowerCase();return !v||String(x[key]).toLowerCase().includes(v)}
function search(){filtered=data.filter(x=>filterText('f-imsi','imsi',x)&&filterText('f-msisdn','msisdn',x)&&filterText('f-iccid','iccid',x)&&filterText('f-vin','vin',x)&&filterText('f-plate','plate',x)&&filterText('f-device','device',x)&&(!document.getElementById('f-carrier').value||x.carrier===document.getElementById('f-carrier').value)&&(!document.getElementById('f-status').value||x.status===document.getElementById('f-status').value)&&(!document.getElementById('f-plan').value||x.plan===document.getElementById('f-plan').value)&&(!document.getElementById('f-project').value||x.project===document.getElementById('f-project').value)&&(!document.getElementById('f-over').value||(document.getElementById('f-over').value==='yes'?x.usedGb>x.quotaGb:x.usedGb<=x.quotaGb)));page=1;selected.clear();render()}
function resetFilters(){document.querySelectorAll('.search-item input,.search-item select').forEach(x=>x.value='');filtered=[...data];page=1;selected.clear();render()}
function toggleFilters(){expanded=!expanded;document.querySelectorAll('.search-item:not(.visible)').forEach(x=>x.classList.toggle('visible',expanded));document.getElementById('toggle').textContent=expanded?'收起 ▴':'展开 ▾'}
function checkAll(el){filtered.slice((page-1)*size,page*size).forEach(x=>el.checked?selected.add(x.id):selected.delete(x.id));render()}function toggleOne(id,on){on?selected.add(id):selected.delete(id);render()}function changePageSize(){size=+document.getElementById('page-size').value;page=1;render()}
function exportData(){
  ListExport.run({rows:filtered,selectedIds:selected,currentPage:page,pageSize:size,
    onExport:()=>Common.showToast('已生成导出文件（原型演示）','success')});
}

// ===== 信息维护弹窗：车辆仅用于定位终端（不改变设备与车辆的绑定关系），保存后关闭弹窗并新增一条绑定记录 =====
let activeSim=null;
const simVehicleSelect=SearchSelect.init({
  container:'#simBindingVehicle',
  placeholder:'输入车牌 / 车架号 / 项目搜索（不填即不按车辆定位）',
  allowClear:true,
  items:()=>vehicles,
  getValue:v=>v.vin,
  getLabel:v=>`${v.plate} · ${v.vin}`,
  matchText:v=>[v.plate,v.vin,v.project],
  groupOf:v=>v.project,
  sortItems:(a,b)=>String(a.plate).localeCompare(String(b.plate)),
  renderOption:v=>({primary:v.plate,primaryClass:'num',meta:`${v.vin} · ${v.project}`}),
  empty:{title:'无匹配车辆',desc:'请调整关键字后重试'},
  onChange:()=>{simDeviceSelect.setItems();syncSimDeviceMeta()}
});
const simDeviceSelect=SearchSelect.init({
  container:'#simBindingDevice',
  placeholder:'输入硬件识别码 / 类型搜索',
  allowClear:true,
  items:()=>{const vin=simVehicleSelect.getValue();return devices.filter(d=>!vin||d.vehicleVin===vin)},
  getValue:d=>d.identifier,
  getLabel:d=>`${d.identifier} · ${d.type}`,
  matchText:d=>[d.identifier,d.type,d.vehicleVin],
  groupOf:d=>d.type,
  sortItems:(a,b)=>a.identifier.localeCompare(b.identifier),
  renderOption:d=>{
    const holder=d.simImsi&&d.simImsi!==(activeSim?activeSim.imsi:'')?d.simImsi:'';
    return {primary:d.identifier,primaryClass:'num',meta:d.type,disabled:!!holder,disabledReason:holder?`已被 ${holder} 占用`:''};
  },
  empty:{title:'无可绑定的终端',desc:'请调整车辆或关键字后重试'},
  onChange:()=>syncSimDeviceMeta()
});
function syncSimDeviceMeta(){
  const code=simDeviceSelect.getValue();
  const device=code?devices.find(d=>d.identifier===code):null;
  const vehicle=device?vehicleOfDevice(device):null;
  document.getElementById('simBindingType').value=device?device.type:'—';
  document.getElementById('simBindingProject').value=(vehicle&&vehicle.project)||'—';
}
function openSimBinding(imsi){
  activeSim=sims.find(s=>s.imsi===imsi)||null;
  if(!activeSim)return;
  document.getElementById('simBindingImsi').textContent=activeSim.imsi;
  document.getElementById('simBindingCarrier').textContent=activeSim.carrier;
  const bound=deviceOfSim(activeSim.imsi);
  simVehicleSelect.setValue(bound?bound.vehicleVin||null:null);
  simDeviceSelect.setItems();
  simDeviceSelect.setValue(bound?bound.identifier:null);
  syncSimDeviceMeta();
  Common.openModal('simBindingModal');
}
function saveSimBinding(e){
  e.preventDefault();
  if(!activeSim)return false;
  const result=applySimBinding(activeSim,simDeviceSelect.getValue()||'','2026-10-14 '+new Date().toTimeString().slice(0,5));
  Common.closeModal('simBindingModal');
  if(!result.changed){Common.showToast('绑定关系无变化，未生成记录','info');return false}
  data=simRows();filtered=[...data];page=1;selected.clear();render();
  Common.showToast(result.device?'保存成功，已新增绑定记录':'已解除绑定，已新增绑定记录','success');
  return false;
}

// ===== 表头字段说明提示：气泡挂载 body 并固定定位（与 search-select 下拉同口径），规避滚动容器裁切 =====
(function(){
  const bubble=document.createElement('div');
  bubble.className='th-tip-bubble';bubble.id='thTipBubble';bubble.setAttribute('role','tooltip');
  document.body.appendChild(bubble);
  let current=null;
  function place(){
    if(!current)return;
    const r=current.getBoundingClientRect(),w=bubble.offsetWidth,h=bubble.offsetHeight;
    const left=Math.max(8,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-8));
    let top=r.bottom+8;
    if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-8);
    bubble.style.left=left+'px';bubble.style.top=top+'px';
    bubble.style.setProperty('--arrow-x',(r.left+r.width/2-left)+'px');
  }
  function show(el){current=el;bubble.textContent=el.dataset.tip||'';bubble.classList.add('is-visible');place()}
  function hide(){current=null;bubble.classList.remove('is-visible')}
  function relocate(){
    if(!current)return;
    const wrap=current.closest('.fixed-table');
    if(wrap){const wr=wrap.getBoundingClientRect(),ir=current.getBoundingClientRect();if(ir.right<wr.left||ir.left>wr.right){hide();return}}
    place();
  }
  document.querySelectorAll('.th-tip').forEach(el=>{
    el.addEventListener('mouseenter',()=>show(el));
    el.addEventListener('mouseleave',hide);
    el.addEventListener('focus',()=>show(el));
    el.addEventListener('blur',hide);
  });
  window.addEventListener('scroll',relocate,true);
  window.addEventListener('resize',relocate);
})();

render();
</script></body></html>
