<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签管理 - 车辆管理系统</title>
<link rel="stylesheet" href="../components/common.css">
<link rel="stylesheet" href="../components/fixed-table.css">
<link rel="icon" href="data:,">
<!--
  标签管理 - 左侧标签列表 + 右侧车辆表格（工作台布局）
  页面用途：左侧维护两级标签（标签组+子标签，公有/私有）并按标签名称检索，右侧查看选中标签/标签组下的车辆清单
  核心功能：左栏标签名称检索（点击查询/回车触发，无结果自动展开命中分组）、新建/编辑/删除标签组与子标签、
            右栏车辆查询（车架号/车型名称/归属项目 + 收起的车牌号/车辆状态）、移入车辆（弹窗多选）、
            单车/批量移出、导出、车辆清单分页（10/20/50/100 条每页）
  右栏结构：自上而下依次为「概要区（仅标签名称标题）→ 查询区（查询条件 + 查询/重置/展开）→ 操作行（移入车辆/批量移出/导出，依次靠左）
            → 车辆列表 → 分页」，查询控件与按钮规格对齐 SIM 卡流量明细页（标签次要色 + 32px 控件 + 动作按钮组靠右）
  交互逻辑：左栏点击标签组=展开收起+聚合查看；点击子标签=查看该标签车辆；右侧车辆按打标时间由近到远倒序；
            删除/移出使用 Common.confirm 二次确认；长表格引用 fixed-table 组件固定首列（车架号）与末列（操作）
  说明：查询条件中「归属项目」仅筛选车辆，不作为标签筛选条件（标签筛选仅按标签名称）
-->
<style>
/* ========== 工作台布局：左标签列表 + 右车辆表格（参考车辆流量明细页） ========== */
.tag-workbench {
    display: grid; grid-template-columns: 304px minmax(0, 1fr);
    /* 100vh - 顶部导航 64 - 内容区上下内边距 48 - 卡片内边距 32（与车辆流量明细页一致） */
    height: calc(100vh - 144px); min-height: 520px;
    border: 1px solid var(--border-color); border-radius: var(--radius);
    overflow: hidden; background: var(--bg-container);
}

/* ---------- 左栏：标签列表面板 ---------- */
.tag-master {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    border-right: 1px solid var(--border-color); background: var(--bg-container);
}
.master-head { padding: 16px; border-bottom: 1px solid var(--border-color); }
.master-head-top { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.master-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; color: var(--text-primary); }
.master-stat { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.master-head-top .btn { margin-left: auto; }
.master-search { display: grid; gap: 10px; }
.master-search-item { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 8px; }
.master-search-item label { color: var(--text-secondary); font-size: 14px; white-space: nowrap; }
.master-search-item input {
    width: 100%; height: 32px; padding: 0 12px;
    border: 1px solid var(--border-input); border-radius: var(--radius);
    background: #fff; color: var(--text-primary); outline: none;
}
.master-search-item input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
.master-actions { display: flex; justify-content: flex-end; gap: 8px; }
.master-tip { margin: 12px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 18px; }

/* 标签列表：分组（标签组）可折叠 + 子项（子标签），标签较多时面板内滚动 */
.tag-list { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 8px; }
.list-section-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 4px; color: var(--text-secondary);
    font-size: 12px; font-weight: 600; letter-spacing: .5px;
}
.tag-group + .tag-group { margin-top: 2px; }
.tag-group-head, .tag-item {
    position: relative; display: flex; align-items: center; gap: 7px;
    border-radius: var(--radius); cursor: pointer; transition: background .2s;
}
.tag-group-head { height: 36px; padding: 0 8px; }
.tag-group-head:hover, .tag-item:hover { background: #f0f2f5; }
.tag-group-head.active, .tag-item.active { background: var(--primary-bg); }
.tag-item.active::before {
    content: ""; position: absolute; left: 18px; top: 7px; bottom: 7px;
    width: 3px; border-radius: 2px; background: var(--primary);
}
.group-arrow { width: 16px; flex: 0 0 16px; text-align: center; color: var(--text-secondary); font-size: 10px; transition: transform .2s; }
.tag-group.expanded .group-arrow { transform: rotate(90deg); }
.group-name, .tag-item-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-primary);
}
.group-name { font-size: 14px; font-weight: 500; }
.tag-item-name { font-size: 14px; }
.type-badge { flex: 0 0 auto; padding: 0 6px; border-radius: 8px; font-size: 11px; line-height: 16px; white-space: nowrap; }
.type-badge.public { background: #e6f4ff; color: #1677ff; }
.type-badge.private { background: #f5e8ff; color: #722ed1; }
.row-count { flex: 0 0 auto; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
/* 行悬停时用操作入口替换车辆数，避免窄面板内文字挤压 */
.row-actions { display: none; flex: 0 0 auto; align-items: center; gap: 8px; }
.tag-group-head:hover .row-count, .tag-item:hover .row-count { display: none; }
.tag-group-head:hover .row-actions, .tag-item:hover .row-actions { display: flex; }
.row-actions a { color: var(--primary); font-size: 12px; cursor: pointer; white-space: nowrap; }
.row-actions a:hover { color: var(--primary-hover); text-decoration: underline; }
.row-actions a.danger { color: var(--error); }
.row-actions a.danger:hover { color: #ff7875; }
.tag-items { display: none; padding: 2px 0 4px; }
.tag-group.expanded .tag-items { display: block; }
.tag-item { min-height: 32px; margin: 2px 0; padding: 4px 8px 4px 30px; }
.color-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; }
.master-empty { padding: 40px 16px; color: var(--text-secondary); font-size: 13px; text-align: center; }

/* ---------- 右栏：车辆表格区（概要区固定，内容区内部滚动） ---------- */
.tag-detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 16px; overflow: hidden; }
.detail-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.detail-summary { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
.detail-main { min-width: 0; }
.detail-title { display: flex; align-items: center; gap: 9px; color: var(--text-primary); font-size: 18px; font-weight: 600; line-height: 28px; }
.detail-title .detail-bar { width: 4px; height: 18px; flex: 0 0 4px; border-radius: 2px; background: var(--primary); }

/* 车辆查询区（位于操作行上方）：标签次要色 + 32px 控件，规格与 SIM 卡流量明细页保持一致 */
.detail-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.control-block { display: flex; align-items: center; gap: 8px; }
.control-block.extra { display: none; }
.detail-controls.expanded .control-block.extra { display: flex; }
.control-label { color: var(--text-secondary); font-size: 14px; white-space: nowrap; }
.detail-controls input, .detail-controls select {
    width: 142px; height: 32px; padding: 0 10px;
    border: 1px solid var(--border-input); border-radius: var(--radius);
    background: #fff; color: var(--text-primary); font-size: 14px; outline: none;
}
.detail-controls input:focus, .detail-controls select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
.detail-controls .detail-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.filter-toggle {
    height: 32px; padding: 0 4px; border: 0; background: transparent;
    color: var(--primary); font-size: 14px; white-space: nowrap; cursor: pointer;
}
.filter-toggle:hover { color: var(--primary-hover); }

/* 操作行（位于查询行下方：「移入车辆」「批量移出」「导出」相邻排列于左侧，规范二.2） */
.detail-action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.detail-action-row .aggregate-tip { color: var(--text-secondary); font-size: 13px; }

/* 分页行：总数 / 每页条数 / 页码 / 分页控件（参考车辆流量明细页） */
.pagination-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px;
    padding-top: 16px; color: var(--text-secondary); font-size: 14px;
}
.pagination-row b { color: var(--text-primary); font-family: var(--font-number); font-weight: 600; }
.page-size {
    height: 32px; padding: 0 8px; border: 1px solid var(--border-input);
    border-radius: var(--radius); background: #fff; color: var(--text-primary); font-size: 13px; outline: none;
}

/* 打标时间/所属子标签列、标签列展示 */
.cell-tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.num-time { font-family: var(--font-number); }
/* 操作列多个文字按钮之间的间距（与车辆资产管理列表页保持一致） */
#tagVehicleTable td .btn-link + .btn-link { margin-left: 8px; }

/* 空态 */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 0; text-align: center; color: var(--text-secondary); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; }

/* ========== 颜色选择器 ========== */
.color-picker { display: flex; gap: 12px; flex-wrap: wrap; }
.color-option {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    position: relative; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border-color);
}
.color-option:hover { box-shadow: 0 0 0 1px var(--primary); }
.color-option.selected { box-shadow: 0 0 0 2px var(--primary); }
.color-option.selected::after {
    content: '✓'; position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700;
}

/* ========== 表单弹窗字段（表单项垂直间距 16px、标签与控件间距 12px，规范二.2） ========== */
.form-row { display: flex; align-items: flex-start; margin-bottom: 16px; }
.form-row .form-label { width: 100px; flex-shrink: 0; text-align: right; padding-right: 12px; font-size: 14px; color: var(--text-primary); line-height: 32px; }
.form-row .form-label .req { color: var(--error); margin-right: 2px; }
.form-row .form-control { flex: 1; }
.form-row input[type="text"], .form-row input[type="number"], .form-row textarea, .form-row select {
    width: 100%; height: 32px; border: 1px solid var(--border-input);
    border-radius: var(--radius); padding: 0 12px; font-size: 14px; color: var(--text-primary); outline: none;
    transition: border-color .2s;
}
.form-row textarea { height: auto; padding: 8px 12px; line-height: 1.5; resize: vertical; min-height: 64px; }
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
.radio-group { display: flex; gap: 24px; line-height: 32px; }
.radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.field-error { color: var(--error); font-size: 12px; margin-top: 4px; }

/* ========== 移入车辆弹窗 ========== */
.import-search { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.import-search input, .import-search select {
    height: 32px; border: 1px solid var(--border-input); border-radius: var(--radius);
    padding: 0 8px; font-size: 13px; outline: none; color: var(--text-primary);
}
.import-search input { width: 170px; }
.import-search select { width: 130px; }
.import-summary { font-size: 13px; color: var(--text-secondary); margin: 8px 0 12px; }
/* 弹窗内表格：小屏横向滚动，禁止列挤变形（规范二.4） */
.import-table-wrap { max-height: 360px; overflow-y: auto; overflow-x: auto; border: 1px solid var(--border-color); border-radius: var(--radius); }
.import-table { width: 100%; min-width: 680px; border-collapse: collapse; }
.import-table thead th {
    position: sticky; top: 0; background: #fafafa; color: var(--text-secondary); font-weight: 600;
    font-size: 13px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); white-space: nowrap;
}
.import-table tbody td { color: var(--text-primary); font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
.import-table tbody tr.added td { color: var(--text-disabled); }
.added-mark { font-size: 11px; color: var(--text-disabled); border: 1px solid var(--border-color); border-radius: 8px; padding: 0 6px; line-height: 16px; }

/* 响应式：小屏左右栏收窄/堆叠，禁止内容挤压变形（规范二.4） */
@media (max-width: 1100px) {
    .tag-workbench { grid-template-columns: 264px minmax(0, 1fr); }
}
@media (max-width: 780px) {
    .tag-workbench { display: block; height: auto; min-height: 0; }
    .tag-master { border-right: 0; border-bottom: 1px solid var(--border-color); }
    .tag-list { max-height: 320px; min-height: 200px; }
    .tag-detail { overflow: visible; }
    .detail-content { overflow: visible; }
}
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <div class="content">
            <div class="page-container">
                <div class="tag-workbench">
                    <!-- 左栏：标签列表（标签名称检索 + 两级标签） -->
                    <aside class="tag-master" aria-label="标签列表">
                        <div class="master-head">
                            <div class="master-head-top">
                                <h2 class="master-title">标签列表</h2>
                                <span class="master-stat" id="treeStat">共 0 组</span>
                                <button class="btn btn-primary" type="button" onclick="openGroupModal()">+ 新建标签组</button>
                            </div>
                            <div class="master-search">
                                <div class="master-search-item">
                                    <label for="s_name">名称</label>
                                    <input type="text" id="s_name" placeholder="请输入标签组/子标签名称">
                                </div>
                                <div class="master-actions">
                                    <button class="btn btn-primary" type="button" onclick="doSearch()">查询</button>
                                    <button class="btn" type="button" onclick="doReset()">重置</button>
                                </div>
                            </div>
                            <p class="master-tip">标签用于对车辆自定义分组归类，不影响车辆状态与归属项目等业务字段。</p>
                        </div>
                        <div class="tag-list" id="treeBody"></div>
                    </aside>

                    <!-- 右栏：选中标签下的车辆表格 -->
                    <section class="tag-detail" aria-label="标签下车辆列表">
                        <div class="detail-summary">
                            <div class="detail-main">
                                <div class="detail-title" id="panelTitle"><span class="detail-bar"></span>请选择左侧标签</div>
                            </div>
                        </div>
                        <div class="detail-content" id="panelContent"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新建/编辑标签组弹窗（表单弹窗默认 600px，规范二.3） -->
<div class="modal-overlay" id="groupModal">
    <div class="modal-box">
        <div class="modal-header"><h3 id="groupModalTitle">新建标签组</h3><span class="modal-close" onclick="closeGroupModal()">×</span></div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-label"><span class="req">*</span>标签组名称</div>
                <div class="form-control">
                    <input type="text" id="g_name" maxlength="20" placeholder="请输入标签组名称（最多20字）">
                    <div class="field-error" id="g_name_err" style="display:none;"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-label"><span class="req">*</span>标签类型</div>
                <div class="form-control">
                    <div class="radio-group">
                        <label><input type="radio" name="g_type" value="public" checked onchange="onTypeChange()"> 公有（全局共享）</label>
                        <label><input type="radio" name="g_type" value="private" onchange="onTypeChange()"> 私有（项目内可见）</label>
                    </div>
                </div>
            </div>
            <div class="form-row" id="g_project_row" style="display:none;">
                <div class="form-label"><span class="req">*</span>所属项目</div>
                <div class="form-control">
                    <select id="g_project">
                        <option value="">请选择项目</option>
                    </select>
                    <div class="field-error" id="g_project_err" style="display:none;"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-label">颜色</div>
                <div class="form-control">
                    <div class="color-picker" id="g_colorPicker"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-label">排序</div>
                <div class="form-control">
                    <input type="number" id="g_sort" min="0" value="0" placeholder="数值越小越靠前">
                </div>
            </div>
            <div class="form-row">
                <div class="form-label">说明</div>
                <div class="form-control">
                    <textarea id="g_remark" maxlength="200" placeholder="请输入标签组用途说明（最多200字）"></textarea>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeGroupModal()">取消</button>
            <button class="btn btn-primary" onclick="saveGroup()">确定</button>
        </div>
    </div>
</div>

<!-- 新建/编辑子标签弹窗（表单弹窗默认 600px，规范二.3） -->
<div class="modal-overlay" id="labelModal">
    <div class="modal-box">
        <div class="modal-header"><h3 id="labelModalTitle">新建子标签</h3><span class="modal-close" onclick="closeLabelModal()">×</span></div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-label"><span class="req">*</span>所属标签组</div>
                <div class="form-control">
                    <select id="l_group">
                        <option value="">请选择标签组</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-label"><span class="req">*</span>子标签名称</div>
                <div class="form-control">
                    <input type="text" id="l_name" maxlength="20" placeholder="请输入子标签名称（最多20字）">
                    <div class="field-error" id="l_name_err" style="display:none;"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-label">颜色</div>
                <div class="form-control">
                    <div class="color-picker" id="l_colorPicker"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-label">排序</div>
                <div class="form-control">
                    <input type="number" id="l_sort" min="0" value="0" placeholder="数值越小越靠前">
                </div>
            </div>
            <div class="form-row">
                <div class="form-label">说明</div>
                <div class="form-control">
                    <textarea id="l_remark" maxlength="200" placeholder="请输入子标签说明（最多200字）"></textarea>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeLabelModal()">取消</button>
            <button class="btn btn-primary" onclick="saveLabel()">确定</button>
        </div>
    </div>
</div>

<!-- 移入车辆弹窗（表格类弹窗 800px，规范二.3） -->
<div class="modal-overlay" id="importModal">
    <div class="modal-box modal-box--lg">
        <div class="modal-header"><h3 id="importModalTitle">移入车辆</h3><span class="modal-close" onclick="closeImportModal()">×</span></div>
        <div class="modal-body">
            <div class="import-search">
                <input type="text" id="imp_vin" placeholder="车架号">
                <input type="text" id="imp_model" placeholder="车型名称">
                <input type="text" id="imp_plate" placeholder="车牌号">
                <select id="imp_project">
                    <option value="">全部项目</option>
                </select>
                <button class="btn btn-primary" onclick="renderImportTable()">查询</button>
            </div>
            <div class="import-summary">已选 <strong id="impSelectedCount">0</strong> 辆 · 已添加的车辆将置灰不可重复选择</div>
            <div class="import-table-wrap">
                <table class="import-table">
                    <thead><tr>
                        <th class="col-center" style="width:50px"><input type="checkbox" id="impCheckAll" onchange="impToggleAll(this)"></th>
                        <th>车架号</th><th>车型名称</th><th>车牌号</th><th>车辆状态</th><th>归属项目</th><th>当前标签</th>
                    </tr></thead>
                    <tbody id="importTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeImportModal()">取消</button>
            <button class="btn btn-primary" onclick="saveImport()">确定</button>
        </div>
    </div>
</div>

// ===== 工具函数 =====
function getGroup(gid){ return labelGroups.find(g=>g.id===gid); }
function getLabel(lid){ for(const g of labelGroups){ const l=g.labels.find(x=>x.id===lid); if(l) return {group:g,label:l}; } return null; }
function getVehicleByVin(vin){ return vehicles.find(v=>v.vin===vin); }
function getLabelTime(vin,lid){ const rels=vehicleLabels[vin]||[]; const r=rels.find(x=>x.labelId===lid); return r?r.time:'—'; }
function sortBySortNo(a,b){ return a.sort-b.sort; }
// 子标签下车辆：默认按打标时间由近到远倒序（PRD《标签管理》3.5.5）
function getVinsByLabel(lid){
    const rels=[];
    for(const [vin,list] of Object.entries(vehicleLabels)){
        const r=list.find(x=>x.labelId===lid);
        if(r) rels.push({vin,time:r.time||''});
    }
    return rels.sort((a,b)=>b.time.localeCompare(a.time)).map(x=>x.vin);
}
// 标签组聚合车辆：取其下所有子标签车辆去重，并按该组内最近打标时间倒序
function getVinsByGroup(gid){
    const group=getGroup(gid); if(!group) return [];
    const labelIds=new Set(group.labels.map(l=>l.id));
    const rows=[];
    for(const [vin,rels] of Object.entries(vehicleLabels)){
        const times=rels.filter(r=>labelIds.has(r.labelId)).map(r=>r.time||'');
        if(times.length) rows.push({vin,time:times.sort().slice(-1)[0]});
    }
    return rows.sort((a,b)=>b.time.localeCompare(a.time)).map(r=>r.vin);
}

// ===== 左栏：标签名称过滤（标签筛选仅按名称，「归属项目」不参与标签过滤） =====
function getNameKeyword(){ const el=document.getElementById('s_name'); return el?el.value.trim().toLowerCase():''; }
function getFilteredGroups(){
    const kw=getNameKeyword();
    return labelGroups.filter(g=>{
        if(!kw) return true;
        const inName=g.name.toLowerCase().includes(kw);
        const inLabel=g.labels.some(l=>l.name.toLowerCase().includes(kw));
        return inName||inLabel;
    });
}

// ===== 左栏：渲染标签列表 =====
function renderTree(){
    const body=document.getElementById('treeBody');
    const groups=getFilteredGroups();
    document.getElementById('treeStat').textContent='共 '+groups.length+' 组';
    if(groups.length===0){
        body.innerHTML='<div class="master-empty">未找到匹配的标签</div>';
        return;
    }
    const publicGroups=groups.filter(g=>g.type==='public').sort(sortBySortNo);
    const privateGroups=groups.filter(g=>g.type==='private').sort(sortBySortNo);
    let html='';
    // 公有标签组排列在私有标签组之前（PRD 3.1.4 排序规则）
    if(publicGroups.length){
        html+='<div class="list-section-title"><span>公有标签</span><span>'+publicGroups.length+' 组</span></div>';
        html+=publicGroups.map(renderGroupNode).join('');
    }
    if(privateGroups.length){
        html+='<div class="list-section-title"><span>私有标签</span><span>'+privateGroups.length+' 组</span></div>';
        html+=privateGroups.map(renderGroupNode).join('');
    }
    body.innerHTML=html;
}
function renderGroupNode(g){
    const isActive=currentSelect && currentSelect.type==='group' && currentSelect.id===g.id;
    const cnt=getVinsByGroup(g.id).length;
    const typeText=g.type==='public'?'公有':'私有'+(g.project?' · '+g.project:'');
    let html='<div class="tag-group'+(expandedGroups.has(g.id)?' expanded':'')+'">';
    html+=`<div class="tag-group-head${isActive?' active':''}" onclick="onGroupRowClick('${g.id}')" title="${g.name}">
        <span class="group-arrow">▶</span>
        <span class="group-name">${g.name}</span>
        <span class="type-badge ${g.type}">${typeText}</span>
        <span class="row-count">${cnt} 辆</span>
        <span class="row-actions">
            <a onclick="event.stopPropagation();editGroup('${g.id}')">编辑</a>
            <a onclick="event.stopPropagation();addLabel('${g.id}')">新建子标签</a>
            <a class="danger" onclick="event.stopPropagation();deleteGroup('${g.id}')">删除</a>
        </span>
    </div>`;
    html+='<div class="tag-items">';
    g.labels.slice().sort(sortBySortNo).forEach(l=>{
        const lActive=currentSelect && currentSelect.type==='label' && currentSelect.id===l.id;
        const c=colorMap[l.color]||colorMap.gray;
        html+=`<div class="tag-item${lActive?' active':''}" onclick="onLabelRowClick('${l.id}')" title="${l.name}">
            <span class="color-dot" style="background:${c.hex}"></span>
            <span class="tag-item-name">${l.name}</span>
            <span class="row-count">${getVinsByLabel(l.id).length} 辆</span>
            <span class="row-actions">
                <a onclick="event.stopPropagation();editLabel('${l.id}')">编辑</a>
                <a class="danger" onclick="event.stopPropagation();deleteLabel('${l.id}')">删除</a>
            </span>
        </div>`;
    });
    html+='</div></div>';
    return html;
}

// ===== 左栏：节点点击（标签组=展开收起+聚合查看；子标签=查看该标签车辆） =====
function onGroupRowClick(gid){
    if(expandedGroups.has(gid)) expandedGroups.delete(gid); else expandedGroups.add(gid);
    currentSelect={type:'group',id:gid};
    currentVehiclePage=1; selectedVehicleVins.clear();
    renderTree(); renderPanel();
}
function onLabelRowClick(lid){
    const info=getLabel(lid);
    if(info) expandedGroups.add(info.group.id);
    currentSelect={type:'label',id:lid};
    currentVehiclePage=1; selectedVehicleVins.clear();
    renderTree(); renderPanel();
}

// ===== 右栏：渲染选中标签下的车辆列表 =====
function readVehicleFilters(){
    ['vin','model','plate','status','project'].forEach(k=>{
        const el=document.getElementById('p_'+k);
        if(el) vehicleFilters[k]=el.value;
    });
}
function renderPanel(){
    const titleEl=document.getElementById('panelTitle');
    const contentEl=document.getElementById('panelContent');
    // 重渲染前先读回查询值，避免查询条件丢失
    readVehicleFilters();

    if(!currentSelect){
        titleEl.innerHTML='<span class="detail-bar"></span>请选择左侧标签';
        contentEl.innerHTML='<div class="empty-state"><div class="empty-icon">👈</div><div class="empty-text">请选择左侧标签组或子标签，查看其下车辆</div></div>';
        return;
    }

    let list=[], titleHtml='', barColor='var(--primary)';
    if(currentSelect.type==='group'){
        const g=getGroup(currentSelect.id);
        // 分组已被删除时清空右栏，避免残留上一次的内容
        if(!g){ titleEl.innerHTML='<span class="detail-bar"></span>—'; contentEl.innerHTML=''; return; }
        const vins=getVinsByGroup(g.id);
        barColor=(colorMap[g.color]||colorMap.gray).hex;
        titleHtml=g.name;
        list=vins.map(getVehicleByVin).filter(Boolean);
    }else{
        const info=getLabel(currentSelect.id);
        if(!info){ titleEl.innerHTML='<span class="detail-bar"></span>—'; contentEl.innerHTML=''; return; }
        const vins=getVinsByLabel(currentSelect.id);
        const c=colorMap[info.label.color]||colorMap.gray;
        barColor=c.hex;
        titleHtml=info.group.name+' / '+info.label.name;
        list=vins.map(getVehicleByVin).filter(Boolean);
    }
    titleEl.innerHTML='<span class="detail-bar" style="background:'+barColor+'"></span>'+titleHtml;

    const rendered=renderVehiclePanel(list);
    contentEl.innerHTML=rendered.html;
    renderVehiclePagination(rendered.total);
    // 长表格固定首列（车架号）与末列（操作），单元格不换行
    if(window.FixedTable && document.getElementById('tagVehicleTable')) FixedTable.refresh('#tagVehicleTable');
}
function renderVehiclePanel(list){
    const isLabelView=currentSelect.type==='label';
    // 车辆查询过滤（归属项目仅筛选车辆，不作为标签筛选条件）
    const filtered=list.filter(v=>{
        if(vehicleFilters.vin && !v.vin.toLowerCase().includes(vehicleFilters.vin.toLowerCase())) return false;
        if(vehicleFilters.model && !v.model_name.toLowerCase().includes(vehicleFilters.model.toLowerCase())) return false;
        if(vehicleFilters.project && v.project!==vehicleFilters.project) return false;
        if(vehicleFilters.plate && !v.plate_no.toLowerCase().includes(vehicleFilters.plate.toLowerCase())) return false;
        if(vehicleFilters.status && v.vehicle_status!==vehicleFilters.status) return false;
        return true;
    });
    const total=filtered.length;
    const start=(currentVehiclePage-1)*vehiclePageSize;
    const pageData=filtered.slice(start,start+vehiclePageSize);
    currentPageVins=pageData.map(v=>v.vin); // 表头全选仅作用于当前页

    // 查询区（位于操作行上方，控件规格与 SIM 卡流量明细页保持一致）
    // 车架号/车型名称/归属项目默认显示，车牌号/车辆状态收起后显示
    let html='<div class="detail-controls'+(queryExpanded?' expanded':'')+'">';
    html+='<div class="control-block"><label class="control-label" for="p_vin">车架号</label><input type="text" id="p_vin" placeholder="请输入车架号" value="'+vehicleFilters.vin+'"></div>';
    html+='<div class="control-block"><label class="control-label" for="p_model">车型名称</label><input type="text" id="p_model" placeholder="请输入车型名称" value="'+vehicleFilters.model+'"></div>';
    html+='<div class="control-block"><label class="control-label" for="p_project">归属项目</label><select id="p_project"><option value="">全部</option>'
        +projectList.map(p=>'<option'+(p===vehicleFilters.project?' selected':'')+'>'+p+'</option>').join('')+'</select></div>';
    html+='<div class="control-block extra"><label class="control-label" for="p_plate">车牌号</label><input type="text" id="p_plate" placeholder="请输入车牌号" value="'+vehicleFilters.plate+'"></div>';
    html+='<div class="control-block extra"><label class="control-label" for="p_status">车辆状态</label><select id="p_status"><option value="">全部</option>'
        +vehicleStatusList.map(s=>'<option'+(s===vehicleFilters.status?' selected':'')+'>'+s+'</option>').join('')+'</select></div>';
    html+='<div class="detail-actions">'
        +'<button class="btn btn-primary" type="button" onclick="onVehicleSearch()">查询</button>'
        +'<button class="btn" type="button" onclick="onVehicleReset()">重置</button>'
        +'<button class="filter-toggle" type="button" onclick="toggleQuery()" aria-expanded="'+(queryExpanded?'true':'false')+'">'+(queryExpanded?'收起⌃':'展开⌄')+'</button>'
        +'</div>';
    html+='</div>';

    // 操作行（位于查询行下方）：「移入车辆」「批量移出」「导出」依次相邻排列于左侧
    html+='<div class="detail-action-row">';
    if(isLabelView){
        html+='<button class="btn btn-primary" type="button" onclick="openImportModal()">移入车辆</button>';
        html+='<button class="btn" type="button" onclick="openBatchRemove()">批量移出</button>';
        html+='<button class="btn" type="button" onclick="doExport()">导出</button>';
    }else{
        html+='<span class="aggregate-tip">标签组聚合视图：仅支持查看与导出；移入/移出请在左侧选择具体子标签</span>';
        html+='<button class="btn" type="button" onclick="doExport()">导出</button>';
    }
    html+='</div>';

    if(total===0){
        const emptyText=isLabelView
            ? (list.length===0?'该标签下暂无车辆，可点击「移入车辆」添加':'未找到匹配的车辆信息')
            : (list.length===0?'该标签组下暂无车辆':'未找到匹配的车辆信息');
        html+='<div class="empty-state"><div class="empty-icon">🚗</div><div class="empty-text">'+emptyText+'</div></div>';
        return { html, total };
    }

    // 表头全选状态：仅当当前页车辆全部勾选时回显（表头全选仅作用于当前页）
    const allPageChecked=pageData.length>0 && pageData.every(v=>selectedVehicleVins.has(v.vin));
    // 列宽/对齐依据 PRD《标签管理》3.5.5：文本列左对齐、编码列（车架号/打标时间）居中、操作与复选框列居中
    html+='<div class="table-wrapper fixed-table" id="tagVehicleTable" data-fixed-first="1" data-fixed-last="1" data-fixed-min-width="1190px"><table><thead><tr>';
    if(isLabelView) html+='<th class="col-center" style="width:50px"><input type="checkbox" '+(allPageChecked?'checked':'')+' onchange="vehicleCheckAll(this)" aria-label="选择当前页全部车辆"></th>';
    html+='<th class="col-center" style="width:200px">车架号</th>'
        +'<th class="col-left" style="width:180px">车型名称（中）</th>'
        +'<th class="col-left" style="width:120px">车牌号</th>'
        +'<th class="col-left" style="width:160px">车辆状态</th>'
        +'<th class="col-left" style="width:160px">归属项目</th>'
        +(isLabelView?'<th class="col-center" style="width:180px">打标时间</th>':'<th class="col-left" style="width:180px">所属子标签</th>')
        +'<th class="col-center" style="width:140px">操作</th></tr></thead><tbody>';
    pageData.forEach(v=>{
        const tagCls=statusTagClass[v.vehicle_status]||'tag-default';
        html+='<tr'+(selectedVehicleVins.has(v.vin)?' class="selected"':'')+'>';
        if(isLabelView){
            html+=`<td class="col-center"><input type="checkbox" ${selectedVehicleVins.has(v.vin)?'checked':''} onchange="vehicleCheck('${v.vin}',this)" aria-label="选择 ${v.vin}"></td>`;
        }
        html+=`<td class="col-center"><a class="btn-link" href="../vehicle-asset/vehicle-asset-detail.html?id=${v.id}">${v.vin}</a></td>`;
        html+=`<td class="col-left ellipsis" title="${v.model_name}">${v.model_name}</td>`;
        html+=`<td class="col-left">${v.plate_no||'—'}</td>`;
        html+=`<td class="col-left"><span class="tag ${tagCls}">${v.vehicle_status}</span></td>`;
        html+=`<td class="col-left">${v.project||'—'}</td>`;
        if(isLabelView){
            html+=`<td class="col-center num-time">${getLabelTime(v.vin,currentSelect.id)}</td>`;
        }else{
            // 标签组聚合：显示该车在该组下的子标签
            const g=getGroup(currentSelect.id);
            const lids=(vehicleLabels[v.vin]||[]).filter(r=>g.labels.some(l=>l.id===r.labelId)).map(r=>r.labelId);
            const tags=lids.map(lid=>{ const info=getLabel(lid); if(!info) return ''; const c=colorMap[info.label.color]||colorMap.gray; return `<span class="tag ${c.tag}">${info.label.name}</span>`; }).join('');
            html+=`<td class="col-left"><div class="cell-tags">${tags||'—'}</div></td>`;
        }
        html+='<td class="col-center">';
        if(isLabelView) html+=`<a class="btn-link link-danger" onclick="removeSingle('${v.vin}')">移出</a>`;
        html+=`<a class="btn-link" href="../vehicle-asset/vehicle-asset-detail.html?id=${v.id}">详情</a>`;
        html+='</td></tr>';
    });
    html+='</tbody></table></div>';

    // 分页行：共 N 条 / 每页条数 / 当前页 / 分页控件（规范二.3）
    html+='<div class="pagination-row">';
    html+='<span>共 <b id="total-count">'+total+'</b> 条</span>';
    html+='<select class="page-size" id="page-size" aria-label="每页条数" onchange="changeVehiclePageSize(this.value)">'
        +[10,20,50,100].map(n=>'<option value="'+n+'"'+(n===vehiclePageSize?' selected':'')+'>'+n+' 条/页</option>').join('')+'</select>';
    html+='<span id="page-info"></span>';
    html+='<div id="vehiclePagination"></div>';
    html+='</div>';
    return { html, total };
}
function renderVehiclePagination(total){
    if(!document.getElementById('vehiclePagination')) return;
    Common.renderPagination({
        total, currentPage:currentVehiclePage, pageSize:vehiclePageSize,
        containerId:'vehiclePagination', infoId:'total-count', pageInfoId:'page-info',
        onPageChange:p=>{ currentVehiclePage=p; renderPanel(); }
    });
}
function changeVehiclePageSize(v){ vehiclePageSize=parseInt(v)||10; currentVehiclePage=1; renderPanel(); }
function toggleQuery(){ queryExpanded=!queryExpanded; renderPanel(); }
function onVehicleSearch(){ currentVehiclePage=1; selectedVehicleVins.clear(); renderPanel(); }
function onVehicleReset(){
    Object.keys(vehicleFilters).forEach(k=>{ vehicleFilters[k]=''; });
    ['p_vin','p_model','p_plate','p_status','p_project'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    currentVehiclePage=1; selectedVehicleVins.clear(); renderPanel();
}
// 表头全选：仅勾选/取消当前页所有车辆（跨页已选项保留）
function vehicleCheckAll(el){
    currentPageVins.forEach(vin=>{ if(el.checked) selectedVehicleVins.add(vin); else selectedVehicleVins.delete(vin); });
    renderPanel();
}
function vehicleCheck(vin,el){ if(el.checked) selectedVehicleVins.add(vin); else selectedVehicleVins.delete(vin); renderPanel(); }

// ===== 颜色选择器 =====
function buildColorPicker(containerId, selected){
    const el=document.getElementById(containerId);
    el.innerHTML='';
    Object.keys(colorMap).forEach(key=>{
        const c=colorMap[key];
        const o=document.createElement('div');
        o.className='color-option'+(key===selected?' selected':'');
        o.style.background=c.hex;
        o.title=c.name;
        o.onclick=()=>{
            if(containerId==='g_colorPicker') groupEditSelectedColor=key;
            else labelEditSelectedColor=key;
            buildColorPicker(containerId,key);
        };
        el.appendChild(o);
    });
}

// ===== 新建/编辑标签组 =====
function openGroupModal(){
    groupEditMode=null;
    document.getElementById('groupModalTitle').textContent='新建标签组';
    document.getElementById('g_name').value='';
    document.querySelector('input[name="g_type"][value="public"]').checked=true;
    document.getElementById('g_project_row').style.display='none';
    document.getElementById('g_project').value='';
    document.getElementById('g_sort').value='0';
    document.getElementById('g_remark').value='';
    groupEditSelectedColor='blue';
    buildColorPicker('g_colorPicker','blue');
    hideErr('g_name_err'); hideErr('g_project_err');
    document.getElementById('groupModal').classList.add('active');
}
function editGroup(gid){
    const g=getGroup(gid); if(!g) return;
    groupEditMode=gid;
    document.getElementById('groupModalTitle').textContent='编辑标签组';
    document.getElementById('g_name').value=g.name;
    document.querySelector(`input[name="g_type"][value="${g.type}"]`).checked=true;
    document.getElementById('g_project_row').style.display=g.type==='private'?'flex':'none';
    document.getElementById('g_project').value=g.project||'';
    document.getElementById('g_sort').value=g.sort;
    document.getElementById('g_remark').value=g.remark||'';
    groupEditSelectedColor=g.color||'blue';
    buildColorPicker('g_colorPicker',groupEditSelectedColor);
    hideErr('g_name_err'); hideErr('g_project_err');
    document.getElementById('groupModal').classList.add('active');
}
function closeGroupModal(){ document.getElementById('groupModal').classList.remove('active'); }
function onTypeChange(){
    const t=document.querySelector('input[name="g_type"]:checked').value;
    document.getElementById('g_project_row').style.display=t==='private'?'flex':'none';
}
function saveGroup(){
    const name=document.getElementById('g_name').value.trim();
    const type=document.querySelector('input[name="g_type"]:checked').value;
    const project=document.getElementById('g_project').value;
    const sort=parseInt(document.getElementById('g_sort').value)||0;
    const remark=document.getElementById('g_remark').value.trim();
    if(!name){ showErr('g_name_err','请输入标签组名称'); return; } hideErr('g_name_err');
    if(type==='private' && !project){ showErr('g_project_err','请选择所属项目'); return; } hideErr('g_project_err');
    // 唯一性校验：同一"类型+所属项目"范围内名称唯一
    const dup=labelGroups.find(g=>g.name===name && g.type===type && g.project===project && g.id!==groupEditMode);
    if(dup){ showErr('g_name_err','该"类型+所属项目"下已存在同名标签组'); return; } hideErr('g_name_err');
    if(groupEditMode){
        const g=getGroup(groupEditMode);
        g.name=name; g.type=type; g.project=type==='private'?project:''; g.color=groupEditSelectedColor; g.sort=sort; g.remark=remark;
    }else{
        const ng={id:'g'+Date.now(),name,type,project:type==='private'?project:'',color:groupEditSelectedColor,sort,remark,labels:[]};
        labelGroups.push(ng);
        expandedGroups.add(ng.id); // 新建后展开，便于继续维护子标签
    }
    closeGroupModal();
    renderTree(); renderPanel();
    Common.showToast('保存成功','success');
}

// ===== 新建/编辑子标签 =====
function addLabel(gid){
    labelEditMode=null; labelEditGroupId=gid;
    openLabelModalInternal('新建子标签');
}
function editLabel(lid){
    const info=getLabel(lid); if(!info) return;
    labelEditMode=lid; labelEditGroupId=info.group.id;
    document.getElementById('l_name').value=info.label.name;
    document.getElementById('l_sort').value=info.label.sort;
    document.getElementById('l_remark').value=info.label.remark||'';
    labelEditSelectedColor=info.label.color||info.group.color||'blue';
    openLabelModalInternal('编辑子标签');
}
function openLabelModalInternal(title){
    document.getElementById('labelModalTitle').textContent=title;
    // 填充所属标签组下拉
    const sel=document.getElementById('l_group');
    sel.innerHTML='<option value="">请选择标签组</option>';
    labelGroups.forEach(g=>{ sel.innerHTML+=`<option value="${g.id}" ${g.id===labelEditGroupId?'selected':''}>${g.name}${g.type==='private'?'（私有-'+g.project+'）':''}</option>`; });
    if(!labelEditMode){
        const defGroup=getGroup(labelEditGroupId);
        labelEditSelectedColor=defGroup?defGroup.color:'blue';
    }
    buildColorPicker('l_colorPicker',labelEditSelectedColor);
    if(!labelEditMode){
        document.getElementById('l_name').value='';
        document.getElementById('l_sort').value='0';
        document.getElementById('l_remark').value='';
    }
    hideErr('l_name_err');
    expandedGroups.add(labelEditGroupId);
    document.getElementById('labelModal').classList.add('active');
}
function closeLabelModal(){ document.getElementById('labelModal').classList.remove('active'); }
function saveLabel(){
    const gid=document.getElementById('l_group').value;
    const name=document.getElementById('l_name').value.trim();
    const sort=parseInt(document.getElementById('l_sort').value)||0;
    const remark=document.getElementById('l_remark').value.trim();
    if(!gid){ Common.showToast('请选择所属标签组','warning'); return; }
    if(!name){ showErr('l_name_err','请输入子标签名称'); return; } hideErr('l_name_err');
    const g=getGroup(gid);
    // 同一标签组范围内名称唯一
    const dup=g.labels.find(l=>l.name===name && l.id!==labelEditMode);
    if(dup){ showErr('l_name_err','该标签组下已存在同名子标签'); return; } hideErr('l_name_err');
    if(labelEditMode){
        const info=getLabel(labelEditMode);
        // 编辑态切换「所属标签组」时，需先把子标签迁移到新分组再保存
        if(info.group.id!==gid){
            info.group.labels=info.group.labels.filter(l=>l.id!==labelEditMode);
            g.labels.push(info.label);
            labelEditGroupId=gid;
        }
        info.label.name=name; info.label.color=labelEditSelectedColor; info.label.sort=sort; info.label.remark=remark;
    }else{
        g.labels.push({id:'l'+Date.now(),name,color:labelEditSelectedColor,sort,remark});
    }
    closeLabelModal();
    renderTree(); renderPanel();
    Common.showToast('保存成功','success');
}

// ===== 删除标签组/子标签（二次确认，PRD 3.4） =====
function deleteGroup(gid){
    const g=getGroup(gid); if(!g) return;
    if(g.labels.length>0){ Common.showToast('该标签组下存在子标签，请先删除子标签后再删除标签组','warning'); return; }
    Common.confirm({
        title:'删除标签组', danger:true, okText:'确定删除',
        content:'确定要删除标签组「'+g.name+'」吗？删除后不可恢复。',
        onOk:()=>{
            labelGroups=labelGroups.filter(x=>x.id!==gid);
            expandedGroups.delete(gid);
            if(currentSelect && currentSelect.id===gid){ currentSelect=null; currentVehiclePage=1; selectedVehicleVins.clear(); }
            renderTree(); renderPanel();
            Common.showToast('删除成功','success');
        }
    });
}
function deleteLabel(lid){
    const info=getLabel(lid); if(!info) return;
    const cnt=getVinsByLabel(lid).length;
    Common.confirm({
        title:'删除子标签', danger:true, okText:'确定删除',
        content:cnt>0
            ? '该子标签下存在 '+cnt+' 辆关联车辆，是否确认删除？删除后该标签与车辆的关联将一并解除。'
            : '确定要删除子标签「'+info.label.name+'」吗？删除后不可恢复。',
        onOk:()=>{
            info.group.labels=info.group.labels.filter(l=>l.id!==lid);
            // 解除该子标签与所有车辆的关联（逻辑删除）
            for(const vin in vehicleLabels){
                vehicleLabels[vin]=vehicleLabels[vin].filter(r=>r.labelId!==lid);
                if(vehicleLabels[vin].length===0) delete vehicleLabels[vin];
            }
            if(currentSelect && currentSelect.id===lid){ currentSelect=null; currentVehiclePage=1; selectedVehicleVins.clear(); }
            renderTree(); renderPanel();
            Common.showToast('删除成功','success');
        }
    });
}

// ===== 移入车辆（弹窗多选，PRD 3.6） =====
function openImportModal(){
    if(!currentSelect || currentSelect.type!=='label'){ Common.showToast('请在左侧选择具体子标签后再移入车辆','warning'); return; }
    importTargetLabelId=currentSelect.id;
    importSelectedVins.clear();
    const info=getLabel(currentSelect.id);
    document.getElementById('importModalTitle').textContent='移入车辆至「'+info.group.name+' / '+info.label.name+'」';
    document.getElementById('imp_vin').value='';
    document.getElementById('imp_model').value='';
    document.getElementById('imp_plate').value='';
    document.getElementById('imp_project').value='';
    renderImportTable();
    document.getElementById('importModal').classList.add('active');
}
function closeImportModal(){ document.getElementById('importModal').classList.remove('active'); }
function renderImportTable(){
    const fv=document.getElementById('imp_vin').value.trim().toLowerCase();
    const fm=document.getElementById('imp_model').value.trim().toLowerCase();
    const fp=document.getElementById('imp_plate').value.trim().toLowerCase();
    const fpr=document.getElementById('imp_project').value;
    const existing=getVinsByLabel(importTargetLabelId);
    const tbody=document.getElementById('importTableBody');
    tbody.innerHTML='';
    let matched=0;
    vehicles.forEach(v=>{
        if(fv && !v.vin.toLowerCase().includes(fv)) return;
        if(fm && !v.model_name.toLowerCase().includes(fm)) return;
        if(fp && !v.plate_no.toLowerCase().includes(fp)) return;
        if(fpr && v.project!==fpr) return;
        matched++;
        const isAdded=existing.includes(v.vin);
        const ckd=importSelectedVins.has(v.vin)?'checked':'';
        const tr=document.createElement('tr');
        if(isAdded) tr.className='added';
        const myLabels=(vehicleLabels[v.vin]||[]).map(r=>{ const info=getLabel(r.labelId); if(!info) return ''; const c=colorMap[info.label.color]||colorMap.gray; return `<span class="tag ${c.tag}">${info.label.name}</span>`; }).join('');
        tr.innerHTML=`<td class="col-center">${isAdded?'<span class="added-mark">已添加</span>':'<input type="checkbox" data-vin="'+v.vin+'" '+ckd+' onchange="impToggle(this)">'}</td>
            <td>${v.vin}</td><td>${v.model_name}</td><td>${v.plate_no||'—'}</td>
            <td><span class="tag ${statusTagClass[v.vehicle_status]||'tag-default'}">${v.vehicle_status}</span></td>
            <td>${v.project||'—'}</td><td><div class="cell-tags">${myLabels||'—'}</div></td>`;
        tbody.appendChild(tr);
    });
    if(matched===0){ tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-secondary);">未找到匹配的车辆</td></tr>'; }
    document.getElementById('impSelectedCount').textContent=importSelectedVins.size;
    document.getElementById('impCheckAll').checked=false;
}
function impToggle(el){
    const vin=el.dataset.vin;
    if(el.checked) importSelectedVins.add(vin); else importSelectedVins.delete(vin);
    document.getElementById('impSelectedCount').textContent=importSelectedVins.size;
}
function impToggleAll(el){
    document.querySelectorAll('#importTableBody input[type=checkbox]').forEach(cb=>{
        cb.checked=el.checked;
        const vin=cb.dataset.vin;
        if(el.checked) importSelectedVins.add(vin); else importSelectedVins.delete(vin);
    });
    document.getElementById('impSelectedCount').textContent=importSelectedVins.size;
}
function saveImport(){
    if(importSelectedVins.size===0){ Common.showToast('请选择要移入的车辆','warning'); return; }
    const now=new Date();
    const pad=n=>String(n).padStart(2,'0');
    const t=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
    importSelectedVins.forEach(vin=>{
        if(!vehicleLabels[vin]) vehicleLabels[vin]=[];
        // 已有相同关联则跳过，不重复建立（PRD 4.2）
        if(!vehicleLabels[vin].some(r=>r.labelId===importTargetLabelId)){
            vehicleLabels[vin].push({labelId:importTargetLabelId,time:t});
        }
    });
    closeImportModal();
    renderTree(); renderPanel();
    Common.showToast('移入成功','success');
}

// ===== 移出（单车/批量，二次确认） =====
function removeSingle(vin){
    const v=getVehicleByVin(vin);
    Common.confirm({
        title:'移出标签', danger:true, okText:'确定移出',
        content:'确定要将车辆「'+(v?v.vin:vin)+'」移出当前标签吗？',
        onOk:()=>doRemove([vin],'single')
    });
}
function openBatchRemove(){
    if(selectedVehicleVins.size===0){ Common.showToast('请先勾选要移出的车辆','warning'); return; }
    Common.confirm({
        title:'批量移出', danger:true, okText:'确定移出',
        content:'确定要将选中的 '+selectedVehicleVins.size+' 辆车移出当前标签吗？',
        onOk:()=>doRemove([...selectedVehicleVins],'batch')
    });
}
function doRemove(vins,type){
    const lid=currentSelect?currentSelect.id:null;
    if(!lid) return;
    vins.forEach(vin=>{
        if(vehicleLabels[vin]){
            vehicleLabels[vin]=vehicleLabels[vin].filter(r=>r.labelId!==lid);
            if(vehicleLabels[vin].length===0) delete vehicleLabels[vin];
        }
        selectedVehicleVins.delete(vin);
    });
    renderTree(); renderPanel();
    Common.showToast(type==='batch'?'批量移出成功':'移出成功','success');
}

// ===== 左栏查询/重置（仅按标签名称过滤标签） =====
function doSearch(){
    // 命中结果自动展开，保证命中的子标签可见
    getFilteredGroups().forEach(g=>expandedGroups.add(g.id));
    currentSelect=null; currentVehiclePage=1; selectedVehicleVins.clear();
    renderTree(); renderPanel();
}
function doReset(){
    const el=document.getElementById('s_name');
    if(el) el.value='';
    expandedGroups.clear();
    currentSelect=null; currentVehiclePage=1; selectedVehicleVins.clear();
    renderTree(); renderPanel();
}

// ===== 导出（当前选中标签/标签组下的车辆，PRD 3.5.4） =====
function doExport(){
    if(!currentSelect){ Common.showToast('请先选择标签','warning'); return; }
    const cnt=currentSelect.type==='label'?getVinsByLabel(currentSelect.id).length:getVinsByGroup(currentSelect.id).length;
    if(cnt===0){ Common.showToast('当前标签下暂无可导出的车辆','warning'); return; }
    Common.showToast('已导出当前标签下车辆（共 '+cnt+' 条）','success');
}

// ===== 辅助：错误提示 =====
function showErr(id,msg){ const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideErr(id){ const el=document.getElementById(id).style.display='none'; }

// ===== 初始化 =====
(function init(){
    // 填充项目下拉（标签组所属项目、移入车辆筛选）
    document.getElementById('g_project').innerHTML='<option value="">请选择项目</option>'+projectList.map(p=>'<option>'+p+'</option>').join('');
    document.getElementById('imp_project').innerHTML='<option value="">全部项目</option>'+projectList.map(p=>'<option>'+p+'</option>').join('');
    // 左栏名称检索：回车触发查询
    document.getElementById('s_name').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
    // 右栏车辆查询输入框：回车触发查询（输入框随右栏重渲染，使用事件委托）
    document.addEventListener('keydown',e=>{
        if(e.key!=='Enter') return;
        const id=e.target && e.target.id;
        if(id==='p_vin'||id==='p_model'||id==='p_plate') onVehicleSearch();
    });

    // 默认展开第一个公有标签组并选中其第一个子标签
    const firstPub=labelGroups.find(g=>g.type==='public');
    if(firstPub){
        expandedGroups.add(firstPub.id);
        if(firstPub.labels.length) currentSelect={type:'label',id:firstPub.labels[0].id};
    }
    renderTree();
    renderPanel();
})();
</script>
