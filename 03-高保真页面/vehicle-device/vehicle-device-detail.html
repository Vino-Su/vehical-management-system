<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备详情 - 车辆管理系统</title>
<link rel="stylesheet" href="../components/common.css">
<link rel="stylesheet" href="../components/fixed-table.css">
<link rel="stylesheet" href="../components/modal-form.css">
<link rel="stylesheet" href="../components/search-select.css">
<link rel="icon" href="data:,">
<!-- 页面用途：展示单台车端网联终端的基础信息、当前绑定关系与设备变更日志，并提供编辑设备、维护绑定入口。 -->
<!-- 设备变更日志为字段级事件流：保存设备信息或绑定后按字段差异逐项追加（操作类型/修改字段/修改前/修改后/操作人/操作时间），口径对齐车辆资产详情「变更日志」Tab。 -->
<style>
  .detail-header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; padding:0 0 18px; border-bottom:1px solid var(--border-color); }
  .detail-actions { display:flex; align-items:center; gap:8px; }
  .detail-id { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; line-height:30px; }
  .detail-id::before { content:""; width:4px; height:22px; border-radius:2px; background:var(--primary); }
  .detail-id span { font-family:var(--font-number); font-size:13px; font-weight:400; color:var(--text-secondary); }
  .section { margin-top:28px; }
  .section-title { display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:18px; line-height:28px; }
  .section-title::before { content:""; width:3px; height:18px; border-radius:2px; background:var(--primary); }
  .description-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--border-color); border-radius:var(--radius); overflow:hidden; }
  .description-item { display:flex; min-width:0; min-height:50px; border-right:1px solid var(--border-color); border-bottom:1px solid var(--border-color); }
  .description-item:nth-child(4n) { border-right:0; }
  .description-item.full { grid-column:1/-1; border-right:0; }
  .description-item:last-child { border-right:0; border-bottom:0; }
  .description-label { flex:0 0 110px; padding:14px 12px; color:var(--text-secondary); background:#fafafa; }
  .description-value { padding:14px 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-primary); }
  .description-value.num { font-family:var(--font-number); }
  .empty-cell { color:var(--text-disabled); }
  /* ===== 设备变更日志：区块标题行 + 字段级事件表，列与对齐口径对齐车辆资产详情「变更日志」Tab ===== */
  .log-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .log-head .section-title { margin-bottom:0; }
  .log-head-hint { font-size:13px; color:var(--text-secondary); }
  .log-pagination { display:flex; justify-content:flex-end; align-items:center; gap:12px; padding-top:16px; font-size:13px; color:var(--text-secondary); }
  /* 弹窗字段栅格、提示条、预览条与弹窗宽度见 components/modal-form.css */
  @media(max-width:1100px) { .description-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .description-item:nth-child(4n) { border-right:1px solid var(--border-color); } .description-item:nth-child(2n) { border-right:0; } }
  @media(max-width:720px) { .description-grid { grid-template-columns:1fr; } .description-item,.description-item:nth-child(4n),.description-item:nth-child(2n) { border-right:0; } .description-item.full { grid-column:auto; } .content { padding:16px; } .page-container { padding:12px; } }
</style>
</head>
<body>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content"><section class="page-container">
  <div class="detail-header"><div class="detail-id">设备详情 <span id="detailIdSub">—</span></div><div class="detail-actions"><a class="btn" href="./vehicle-device-list.html">返回列表</a><button class="btn" type="button" onclick="openEditor()">编辑设备</button><button class="btn btn-primary" type="button" onclick="openBinding()">维护绑定</button></div></div>
  <div class="section"><h2 class="section-title">设备信息</h2><div class="description-grid" id="deviceInfoGrid"></div></div>
  <div class="section"><h2 class="section-title">当前绑定</h2><div class="description-grid" id="bindingGrid"></div></div>
  <div class="section"><div class="log-head"><h2 class="section-title">设备变更日志</h2><span class="log-head-hint">保存设备信息或绑定后自动新增记录</span></div><div class="table-wrapper fixed-table" data-fixed-first="1" data-fixed-last="0" data-fixed-min-width="940"><table><thead><tr><th class="col-center" style="width:96px">操作类型</th><th class="col-left" style="width:130px">修改字段</th><th class="col-left" style="width:232px">修改前</th><th class="col-left" style="width:232px">修改后</th><th class="col-center" style="width:96px">操作人</th><th class="col-center" style="width:154px">操作时间</th></tr></thead><tbody id="changeLogBody"></tbody></table></div><div class="log-pagination"><span>共 <b id="changeLogCount">0</b> 条</span><span id="changeLogInfo"></span><div id="changeLogPagination"></div></div></div>
</section></main></div></div>

<div class="modal-overlay" id="deviceModal"><div class="modal-box device-modal" role="dialog" aria-modal="true" aria-labelledby="deviceModalTitle"><div class="modal-header"><h3 id="deviceModalTitle">编辑设备</h3><button class="modal-close" type="button" onclick="Common.closeModal('deviceModal')" aria-label="关闭">×</button></div><div class="modal-body"><form id="deviceForm" onsubmit="return saveDevice(event)"><div class="field-grid"><div class="field"><label><span class="required">*</span>设备名称</label><input id="deviceName" required placeholder="请输入设备名称，如 T-BOX"></div><div class="field"><label><span class="required">*</span>设备类型</label><select id="deviceType" required><option value="">请选择</option><option>T-Box</option><option>ADU</option><option>OBU</option><option>DTU</option><option>视频盒子</option></select></div><div class="field"><label><span class="required">*</span>设备识别码</label><input id="deviceIdentifier" required placeholder="请输入设备识别码"></div><div class="field"><label>设备序列号</label><input id="deviceSerial" placeholder="请输入设备序列号"></div><div class="field"><label>厂商</label><input id="deviceVendor" placeholder="请输入厂商"></div><div class="field"><label>型号</label><input id="deviceModel" placeholder="请输入型号"></div><div class="field"><label>状态</label><select id="deviceStatus"><option>正常</option><option>维修中</option><option>已报废</option></select></div><div class="field full"><label>备注</label><textarea id="deviceNotes" placeholder="补充设备来源、安装说明等信息"></textarea></div><div class="form-tip">设备与车辆、SIM 卡的关系在“维护绑定”操作中单独维护。设备名称、识别码保存后不可与其他设备重复。</div></div></form></div><div class="modal-footer"><button class="btn" type="button" onclick="Common.closeModal('deviceModal')">取消</button><button class="btn btn-primary" type="submit" form="deviceForm">保存</button></div></div></div>

<div class="modal-overlay" id="bindingModal"><div class="modal-box binding-modal" role="dialog" aria-modal="true" aria-labelledby="bindingModalTitle"><div class="modal-header"><h3 id="bindingModalTitle">维护绑定关系</h3><button class="modal-close" type="button" onclick="Common.closeModal('bindingModal')" aria-label="关闭">×</button></div><div class="modal-body"><div class="binding-preview"><strong id="bindingDeviceCode">—</strong><span id="bindingDeviceType">—</span></div><form id="bindingForm" onsubmit="return saveBinding(event)"><div class="field-grid"><div class="field full"><label>绑定车辆</label><div id="bindingVehicle"></div></div><div class="field full"><label>绑定 SIM 卡</label><div id="bindingSim"></div></div><div class="form-tip">同一张 SIM 卡在同一时间只能绑定一个设备。清空某一项即可解除对应关系，保存后系统会写入绑定历史。</div></div></form></div><div class="modal-footer"><button class="btn" type="button" onclick="Common.closeModal('bindingModal')">取消</button><button class="btn btn-primary" type="submit" form="bindingForm">保存绑定</button></div></div></div>

<script src="../components/common.js"></script><script src="../components/pagination-component.js"></script><script src="../components/fixed-table.js"></script><script src="../components/search-select.js"></script><script src="../components/fleet-data.js"></script>
<script>
Common.initLayout({basePath:'../',sidebarId:'sidebar',activeMenuId:'device-manage',headerId:'header',headerOptions:{showProject:true}});

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const vehicleOf=d=>vehicles.find(v=>v.vin===d.vehicleVin);
const simOf=d=>sims.find(s=>s.imsi===d.simImsi);
function statusTag(value){const map={'正常':'tag-green','维修中':'tag-orange','已报废':'tag-red'};return `<span class="tag ${map[value]||'tag-default'}">${esc(value)}</span>`}

const params=new URLSearchParams(window.location.search);
let current=devices.find(d=>String(d.id)===params.get('id'))||devices[0];

function item(label,value,{num=false,full=false}={}){return `<div class="description-item${full?' full':''}"><span class="description-label">${label}</span><span class="description-value${num?' num':''}">${value}</span></div>`}
function renderPage(){
  current=devices.find(d=>d.id===current.id)||current;
  const v=vehicleOf(current),s=simOf(current);
  document.getElementById('detailIdSub').textContent=`识别码：${current.identifier}`;
  document.getElementById('deviceInfoGrid').innerHTML=
    item('设备名称',esc(current.name)||'—')
    +item('设备类型',esc(current.type)||'—')
    +item('设备识别码',esc(current.identifier))
    +item('设备序列号',esc(current.serial)||'—',{num:true})
    +item('厂商',esc(current.vendor)||'—')
    +item('型号',esc(current.model)||'—')
    +item('状态',statusTag(current.status))
    +item('最近维护',esc(current.updated),{num:true})
    +item('备注',esc(current.notes)||'—',{full:true});
  document.getElementById('bindingGrid').innerHTML=
    item('车架号',v?`<a class="btn-link" href="../vehicle-asset/vehicle-asset-detail.html?id=${v.assetId}">${esc(v.vin)}</a>`:'<span class="empty-cell">未绑定车辆</span>',{num:true})
    +item('是否有SIM卡',s?'有':'<span class="empty-cell">无</span>')
    +item('IMSI',s?`<a class="btn-link" href="../sim-card/sim-card-detail.html?imsi=${encodeURIComponent(s.imsi)}">${esc(s.imsi)}</a>`:'<span class="empty-cell">未绑定 SIM 卡</span>',{num:true});
  renderChangeLog();
}

// 设备变更日志：字段级事件流，保存设备信息或绑定后按字段差异逐项追加（写入助手见 components/fleet-data.js）
let changeLogPage=1;
const CHANGE_LOG_PAGE_SIZE=10;
function renderChangeLog(){
  const records=current.changeLog||[];
  const maxPage=Math.max(1,Math.ceil(records.length/CHANGE_LOG_PAGE_SIZE));
  if(changeLogPage>maxPage)changeLogPage=maxPage;
  const rows=records.slice((changeLogPage-1)*CHANGE_LOG_PAGE_SIZE,changeLogPage*CHANGE_LOG_PAGE_SIZE);
  const cell=value=>esc(value)||'<span class="empty-cell">—</span>';
  document.getElementById('changeLogBody').innerHTML=rows.length
    ? rows.map(r=>`<tr><td class="col-center"><span class="tag ${r.type==='新增'?'tag-green':'tag-blue'}">${esc(r.type)}</span></td><td class="col-left">${cell(r.field)}</td><td class="col-left ellipsis" title="${esc(r.before)}">${cell(r.before)}</td><td class="col-left ellipsis" title="${esc(r.after)}">${cell(r.after)}</td><td class="col-center">${cell(r.operator)}</td><td class="col-center num">${esc(r.time)}</td></tr>`).join('')
    : '<tr><td class="col-center" colspan="6" style="color:var(--text-secondary)">暂无变更记录</td></tr>';
  Common.renderPagination({total:records.length,currentPage:changeLogPage,pageSize:CHANGE_LOG_PAGE_SIZE,containerId:'changeLogPagination',infoId:'changeLogCount',pageInfoId:'changeLogInfo',onPageChange:p=>{changeLogPage=p;renderChangeLog()}});
}

function openEditor(){const d=current;document.getElementById('deviceModalTitle').textContent='编辑设备';document.getElementById('deviceName').value=d.name||'';document.getElementById('deviceIdentifier').value=d.identifier||'';document.getElementById('deviceType').value=d.type||'';document.getElementById('deviceSerial').value=d.serial||'';document.getElementById('deviceVendor').value=d.vendor||'';document.getElementById('deviceModel').value=d.model||'';document.getElementById('deviceStatus').value=d.status||'正常';document.getElementById('deviceNotes').value=d.notes||'';Common.openModal('deviceModal');setTimeout(()=>document.getElementById('deviceName').focus(),0)}
function saveDevice(e){e.preventDefault();const name=document.getElementById('deviceName').value.trim(),identifier=document.getElementById('deviceIdentifier').value.trim(),type=document.getElementById('deviceType').value;if(!name||!identifier||!type)return false;const duplicate=devices.find(d=>d.identifier.toLowerCase()===identifier.toLowerCase()&&d.id!==current.id);if(duplicate){Common.showToast('设备识别码已存在，请更换后再保存','error');return false}const now='2026-10-13 '+new Date().toTimeString().slice(0,5);const before={name:current.name,type:current.type,identifier:current.identifier,serial:current.serial,vendor:current.vendor,model:current.model,status:current.status,notes:current.notes};Object.assign(current,{name,identifier,type,serial:document.getElementById('deviceSerial').value.trim(),status:document.getElementById('deviceStatus').value,vendor:document.getElementById('deviceVendor').value.trim(),model:document.getElementById('deviceModel').value.trim(),notes:document.getElementById('deviceNotes').value.trim(),updated:now});recordDeviceEdits(current,before,current,now);changeLogPage=1;Common.closeModal('deviceModal');renderPage();Common.showToast('设备信息已更新','success');return false}

// 绑定弹窗的可搜索选择器：车辆按 车牌/车架号/项目 模糊匹配；SIM 卡按 IMSI/运营商 匹配并置灰被其他设备占用的卡
const bindingVehicleSelect=SearchSelect.init({container:'#bindingVehicle',placeholder:'输入车牌 / 车架号 / 项目搜索',allowClear:true,items:()=>vehicles,getValue:v=>v.vin,getLabel:v=>`${v.plate} · ${v.vin}`,matchText:v=>[v.plate,v.vin,v.project],groupOf:v=>v.project,sortItems:(a,b)=>String(a.plate).localeCompare(String(b.plate)),renderOption:v=>({primary:v.plate,primaryClass:'num',meta:`${v.vin} · ${v.project}`}),empty:{title:'无匹配车辆',desc:'请调整关键字后重试'}});
const bindingSimSelect=SearchSelect.init({container:'#bindingSim',placeholder:'输入 IMSI / 运营商搜索',allowClear:true,items:()=>sims,getValue:s=>s.imsi,getLabel:s=>`${s.imsi} · ${s.carrier}`,matchText:s=>[s.imsi,s.carrier],groupOf:s=>s.carrier,renderOption:s=>{const used=simOccupiedBy(s.imsi,current.id);return {primary:s.imsi,primaryClass:'num',meta:s.carrier,disabled:!!used,disabledReason:used?`已被 ${used.identifier} 占用`:''}},empty:{title:'无匹配 SIM 卡',desc:'请调整关键字后重试'}});
function syncBindingSelects(d){bindingVehicleSelect.setValue(d.vehicleVin||null);bindingSimSelect.setItems();bindingSimSelect.setValue(d.simImsi||null)}
function openBinding(){const d=current;document.getElementById('bindingDeviceCode').textContent=d.identifier;document.getElementById('bindingDeviceType').textContent=d.type;syncBindingSelects(d);Common.openModal('bindingModal')}
function saveBinding(e){e.preventDefault();const d=current;const newVin=bindingVehicleSelect.getValue()||'',newSim=bindingSimSelect.getValue()||'';const conflict=devices.find(x=>x.id!==d.id&&x.simImsi&&x.simImsi===newSim);if(conflict){Common.showToast(`SIM 卡已绑定设备 ${conflict.identifier}`,'error');return false}const now='2026-10-13 '+new Date().toTimeString().slice(0,5),oldVin=d.vehicleVin,oldSim=d.simImsi;if(oldVin===newVin&&oldSim===newSim){Common.closeModal('bindingModal');Common.showToast('绑定关系无变化，未生成变更记录','info');return false}d.vehicleVin=newVin;d.simImsi=newSim;d.updated=now;recordBindingChanges(d,now,oldVin,oldSim);changeLogPage=1;Common.closeModal('bindingModal');renderPage();Common.showToast('绑定关系已保存','success');return false}

renderPage();
</script>
</body>
</html>
