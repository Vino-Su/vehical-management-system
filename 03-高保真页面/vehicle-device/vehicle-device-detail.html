<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备详情 - 车辆管理系统</title>
<link rel="stylesheet" href="../components/common.css">
<link rel="stylesheet" href="../components/fixed-table.css">
<!-- 页面用途：展示单台车端网联终端的基础信息、当前绑定关系与绑定/维护历史，并提供编辑设备、维护绑定入口。 -->
<style>
  .detail-header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; padding:0 0 18px; border-bottom:1px solid var(--border-color); }
  .detail-actions { display:flex; align-items:center; gap:8px; }
  .detail-id { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; line-height:30px; }
  .detail-id::before { content:""; width:4px; height:22px; border-radius:2px; background:var(--primary); }
  .detail-id span { font-family:var(--font-number); font-size:13px; font-weight:400; color:var(--text-secondary); }
  .section { margin-top:28px; }
  .section-title { display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:18px; line-height:28px; }
  .section-title::before { content:""; width:3px; height:18px; border-radius:2px; background:var(--primary); }
  .description-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--border-color); border-radius:var(--radius); overflow:hidden; }
  .description-item { display:flex; min-width:0; min-height:50px; border-right:1px solid var(--border-color); border-bottom:1px solid var(--border-color); }
  .description-item:nth-child(4n) { border-right:0; }
  .description-item.full { grid-column:1/-1; border-right:0; }
  .description-item:last-child { border-right:0; border-bottom:0; }
  .description-label { flex:0 0 110px; padding:14px 12px; color:var(--text-secondary); background:#fafafa; }
  .description-value { padding:14px 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-primary); }
  .description-value.num { font-family:var(--font-number); }
  .empty-cell { color:var(--text-disabled); }
  .history-list { border:1px solid var(--border-color); border-radius:var(--radius); overflow:hidden; }
  .history-item { display:grid; grid-template-columns:150px 90px minmax(0,1fr); gap:12px; padding:12px 14px; border-bottom:1px solid var(--border-color); font-size:13px; line-height:20px; }
  .history-item:last-child { border-bottom:0; }
  .history-time { color:var(--text-secondary); font-family:var(--font-number); }
  .history-type { color:var(--primary); }
  .history-note { color:var(--text-primary); }
  .field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 20px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field.full { grid-column:1/-1; }
  .field label { color:var(--text-secondary); font-size:13px; }
  .field label .required { color:var(--error); margin-right:3px; }
  .field input,.field select,.field textarea { width:100%; min-height:34px; padding:6px 10px; border:1px solid var(--border-input); border-radius:var(--radius); outline:none; color:var(--text-primary); background:#fff; }
  .field textarea { min-height:78px; resize:vertical; line-height:22px; }
  .field input:focus,.field select:focus,.field textarea:focus { border-color:var(--primary); }
  .form-tip { grid-column:1/-1; padding:10px 12px; border-radius:var(--radius); background:#f6faff; color:#5b6b82; font-size:12px; line-height:20px; }
  .modal-box.device-modal { width:720px; }
  .modal-box.binding-modal { width:650px; }
  .binding-preview { margin-bottom:18px; padding:12px 14px; background:#fafafa; border:1px solid var(--border-color); border-radius:var(--radius); }
  .binding-preview strong { font-family:var(--font-number); }
  .binding-preview span { margin-left:10px; color:var(--text-secondary); font-size:13px; }
  @media(max-width:1100px) { .description-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .description-item:nth-child(4n) { border-right:1px solid var(--border-color); } .description-item:nth-child(2n) { border-right:0; } }
  @media(max-width:720px) { .field-grid,.description-grid { grid-template-columns:1fr; } .description-item,.description-item:nth-child(4n),.description-item:nth-child(2n) { border-right:0; } .field.full,.form-tip,.description-item.full { grid-column:auto; } .content { padding:16px; } .page-container { padding:12px; } }
</style>
</head>
<body>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content"><section class="page-container">
  <div class="detail-header"><div class="detail-id">设备详情 <span id="detailIdSub">—</span></div><div class="detail-actions"><a class="btn" href="./vehicle-device-list.html">返回列表</a><button class="btn" type="button" onclick="openEditor()">编辑设备</button><button class="btn btn-primary" type="button" onclick="openBinding()">维护绑定</button></div></div>
  <div class="section"><h2 class="section-title">设备信息</h2><div class="description-grid" id="deviceInfoGrid"></div></div>
  <div class="section"><h2 class="section-title">当前绑定</h2><div class="description-grid" id="bindingGrid"></div></div>
  <div class="section"><h2 class="section-title">绑定与维护历史</h2><div class="history-list" id="historyList"></div></div>
</section></main></div></div>

<div class="modal-overlay" id="deviceModal"><div class="modal-box device-modal" role="dialog" aria-modal="true" aria-labelledby="deviceModalTitle"><div class="modal-header"><h3 id="deviceModalTitle">编辑设备</h3><button class="modal-close" type="button" onclick="Common.closeModal('deviceModal')" aria-label="关闭">×</button></div><div class="modal-body"><form id="deviceForm" onsubmit="return saveDevice(event)"><div class="field-grid"><div class="field"><label><span class="required">*</span>设备名称</label><input id="deviceName" required placeholder="请输入设备名称，如 T-BOX"></div><div class="field"><label><span class="required">*</span>设备类型</label><select id="deviceType" required><option value="">请选择</option><option>T-Box</option><option>ADU</option><option>OBU</option><option>DTU</option><option>视频盒子</option></select></div><div class="field"><label><span class="required">*</span>设备识别码</label><input id="deviceIdentifier" required placeholder="请输入设备识别码"></div><div class="field"><label>设备序列号</label><input id="deviceSerial" placeholder="请输入设备序列号"></div><div class="field"><label>厂商</label><input id="deviceVendor" placeholder="请输入厂商"></div><div class="field"><label>型号</label><input id="deviceModel" placeholder="请输入型号"></div><div class="field"><label>状态</label><select id="deviceStatus"><option>正常</option><option>维修中</option><option>已报废</option></select></div><div class="field full"><label>备注</label><textarea id="deviceNotes" placeholder="补充设备来源、安装说明等信息"></textarea></div><div class="form-tip">设备与车辆、SIM 卡的关系在“维护绑定”操作中单独维护。设备名称、识别码保存后不可与其他设备重复。</div></div></form></div><div class="modal-footer"><button class="btn" type="button" onclick="Common.closeModal('deviceModal')">取消</button><button class="btn btn-primary" type="submit" form="deviceForm">保存</button></div></div></div>

<div class="modal-overlay" id="bindingModal"><div class="modal-box binding-modal" role="dialog" aria-modal="true" aria-labelledby="bindingModalTitle"><div class="modal-header"><h3 id="bindingModalTitle">维护绑定关系</h3><button class="modal-close" type="button" onclick="Common.closeModal('bindingModal')" aria-label="关闭">×</button></div><div class="modal-body"><div class="binding-preview"><strong id="bindingDeviceCode">—</strong><span id="bindingDeviceType">—</span></div><form id="bindingForm" onsubmit="return saveBinding(event)"><div class="field-grid"><div class="field full"><label>绑定车辆</label><select id="bindingVehicle"></select></div><div class="field full"><label>绑定 SIM 卡</label><select id="bindingSim"></select></div><div class="form-tip">同一张 SIM 卡在同一时间只能绑定一个设备。清空某一项即可解除对应关系，保存后系统会写入绑定历史。</div></div></form></div><div class="modal-footer"><button class="btn" type="button" onclick="Common.closeModal('bindingModal')">取消</button><button class="btn btn-primary" type="submit" form="bindingForm">保存绑定</button></div></div></div>

<script src="../components/common.js"></script><script src="vehicle-device-data.js"></script>
<script>
Common.initLayout({basePath:'../',sidebarId:'sidebar',activeMenuId:'device-manage',headerId:'header',headerOptions:{showProject:true}});

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const vehicleOf=d=>vehicles.find(v=>v.vin===d.vehicleVin);
const simOf=d=>sims.find(s=>s.imsi===d.simImsi);
function statusTag(value){const map={'正常':'tag-green','维修中':'tag-orange','已报废':'tag-red'};return `<span class="tag ${map[value]||'tag-default'}">${esc(value)}</span>`}

const params=new URLSearchParams(window.location.search);
let current=devices.find(d=>String(d.id)===params.get('id'))||devices[0];

function item(label,value,{num=false,full=false}={}){return `<div class="description-item${full?' full':''}"><span class="description-label">${label}</span><span class="description-value${num?' num':''}">${value}</span></div>`}
function renderPage(){
  current=devices.find(d=>d.id===current.id)||current;
  const v=vehicleOf(current),s=simOf(current);
  document.getElementById('detailIdSub').textContent=`识别码：${current.identifier}`;
  document.getElementById('deviceInfoGrid').innerHTML=
    item('设备名称',esc(current.name)||'—')
    +item('设备类型',esc(current.type)||'—')
    +item('设备识别码',esc(current.identifier))
    +item('设备序列号',esc(current.serial)||'—',{num:true})
    +item('厂商',esc(current.vendor)||'—')
    +item('型号',esc(current.model)||'—')
    +item('状态',statusTag(current.status))
    +item('最近维护',esc(current.updated),{num:true})
    +item('备注',esc(current.notes)||'—',{full:true});
  document.getElementById('bindingGrid').innerHTML=
    item('车辆VIN码',v?`<a class="btn-link" href="../vehicle-asset/vehicle-asset-detail.html?id=${v.assetId}">${esc(v.vin)}</a>`:'<span class="empty-cell">未绑定车辆</span>',{num:true})
    +item('是否有SIM卡',s?'有':'<span class="empty-cell">无</span>')
    +item('IMSI',s?`<a class="btn-link" href="../sim-card/sim-card-detail.html?imsi=${encodeURIComponent(s.imsi)}">${esc(s.imsi)}</a>`:'<span class="empty-cell">未绑定 SIM 卡</span>',{num:true});
  document.getElementById('historyList').innerHTML=(current.history&&current.history.length)
    ? current.history.map(h=>`<div class="history-item"><span class="history-time">${esc(h[0])}</span><span class="history-type">${esc(h[1])}</span><span class="history-note">${esc(h[2])}</span></div>`).join('')
    : '<div class="history-item"><span class="history-note">暂无绑定与维护记录</span></div>';
}

function openEditor(){const d=current;document.getElementById('deviceModalTitle').textContent='编辑设备';document.getElementById('deviceName').value=d.name||'';document.getElementById('deviceIdentifier').value=d.identifier||'';document.getElementById('deviceType').value=d.type||'';document.getElementById('deviceSerial').value=d.serial||'';document.getElementById('deviceVendor').value=d.vendor||'';document.getElementById('deviceModel').value=d.model||'';document.getElementById('deviceStatus').value=d.status||'正常';document.getElementById('deviceNotes').value=d.notes||'';Common.openModal('deviceModal');setTimeout(()=>document.getElementById('deviceName').focus(),0)}
function saveDevice(e){e.preventDefault();const name=document.getElementById('deviceName').value.trim(),identifier=document.getElementById('deviceIdentifier').value.trim(),type=document.getElementById('deviceType').value;if(!name||!identifier||!type)return false;const duplicate=devices.find(d=>d.identifier.toLowerCase()===identifier.toLowerCase()&&d.id!==current.id);if(duplicate){Common.showToast('设备识别码已存在，请更换后再保存','error');return false}const now='2026-10-13 '+new Date().toTimeString().slice(0,5);Object.assign(current,{name,identifier,type,serial:document.getElementById('deviceSerial').value.trim(),status:document.getElementById('deviceStatus').value,vendor:document.getElementById('deviceVendor').value.trim(),model:document.getElementById('deviceModel').value.trim(),notes:document.getElementById('deviceNotes').value.trim(),updated:now});current.history.unshift([now,'编辑设备','更新设备基础信息']);Common.closeModal('deviceModal');renderPage();Common.showToast('设备信息已更新','success');return false}

function populateBindingOptions(d){const vSel=document.getElementById('bindingVehicle'),sSel=document.getElementById('bindingSim');vSel.innerHTML='<option value="">不绑定车辆</option>'+vehicles.map(v=>`<option value="${esc(v.vin)}">${esc(v.plate)} · ${esc(v.vin)} · ${esc(v.project)}</option>`).join('');sSel.innerHTML='<option value="">不绑定 SIM 卡</option>'+sims.map(s=>{const used=devices.find(x=>x.simImsi===s.imsi&&x.id!==d.id);return `<option value="${esc(s.imsi)}" ${used?'disabled':''}>${esc(s.imsi)} · ${esc(s.carrier)}${used?'（已被 '+esc(used.identifier)+' 占用）':''}</option>`}).join('');vSel.value=d.vehicleVin||'';sSel.value=d.simImsi||''}
function openBinding(){const d=current;document.getElementById('bindingDeviceCode').textContent=d.identifier;document.getElementById('bindingDeviceType').textContent=d.type;populateBindingOptions(d);Common.openModal('bindingModal')}
function saveBinding(e){e.preventDefault();const d=current;const newVin=document.getElementById('bindingVehicle').value,newSim=document.getElementById('bindingSim').value;const conflict=devices.find(x=>x.id!==d.id&&x.simImsi&&x.simImsi===newSim);if(conflict){Common.showToast(`SIM 卡已绑定设备 ${conflict.identifier}`,'error');return false}const now='2026-10-13 '+new Date().toTimeString().slice(0,5),oldVin=d.vehicleVin,oldSim=d.simImsi;d.vehicleVin=newVin;d.simImsi=newSim;d.updated=now;if(oldVin!==newVin){const old=vehicles.find(v=>v.vin===oldVin);const next=vehicles.find(v=>v.vin===newVin);d.history.unshift([now,newVin?'绑定车辆':'解绑车辆',newVin?`绑定 ${next?.plate||newVin}`:`解除 ${old?.plate||oldVin||'车辆'} 关系`])}if(oldSim!==newSim){d.history.unshift([now,newSim?'绑定 SIM':'解绑 SIM',newSim?`绑定 ${newSim}`:`解除 ${oldSim||'SIM'} 关系`])}Common.closeModal('bindingModal');renderPage();Common.showToast('绑定关系已保存','success');return false}

renderPage();
</script>
</body>
</html>
