<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>日常维护计划 - 车辆管理系统</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../components/common.css"><link rel="stylesheet" href="../components/fixed-table.css"><link rel="stylesheet" href="maintenance.css"></head>
<!-- 页面用途：维护计划台账。支持草稿/启用/停用查询与启停确认；启用可选立即或次日生效；历史任务保留。 -->
<body data-page="plan-list"><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content"><section class="page-container">
<form id="queryForm" class="maintenance-search"><div class="query-field"><label for="q-name">计划名称</label><input id="q-name" placeholder="请输入计划名称"></div><div class="query-field"><label for="q-model">适用车型</label><select id="q-model"><option value="">全部车型</option></select></div><div class="query-field"><label for="q-project">适用项目</label><select id="q-project"><option value="">全部项目</option></select></div><div class="query-field"><label for="q-cycle">检查周期</label><select id="q-cycle"><option value="">全部周期</option></select></div><div class="query-field"><label for="q-status">计划状态</label><select id="q-status"><option value="">全部状态</option><option value="draft">草稿</option><option value="enabled">启用</option><option value="disabled">停用</option></select></div><div class="query-actions"><button class="btn btn-primary" type="submit">查询</button><button class="btn" type="button" id="resetQuery">重置</button></div></form>

</section></main></div></div><script src="../components/common.js"></script><script src="../components/pagination-component.js"></script><script src="../components/fixed-table.js"></script><script src="maintenance-data.js"></script><script src="maintenance-lifecycle.js"></script><script src="maintenance.js"></script></body></html>
