<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>维护计划配置 - 车辆管理系统</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../components/common.css"><link rel="stylesheet" href="../components/form.css"><link rel="stylesheet" href="../components/fixed-table.css"><link rel="stylesheet" href="../components/search-select.css"><link rel="stylesheet" href="maintenance.css"></head>
<!-- 页面用途：新增/编辑计划，复用左置外置标签表单、车型搜索选择器及确认弹窗。仅新增支持持久草稿；正式保存完整校验，启用独立操作。 -->
<body data-page="plan-edit"><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content plan-content"><section class="page-container plan-workspace" id="pageContent"><div class="detail-bar"><div class="plan-detail-heading"><div class="plan-title-line"><h2 id="editorTitle">新增维护计划</h2><span id="planState"></span></div><div id="planSummary" class="plan-summary"></div></div><div class="inline-actions"><button type="button" class="btn" id="backEditor">返回列表</button></div></div>
<form id="planForm" class="maintenance-form plan-main" novalidate>
<div id="planErrors" class="form-errors" role="alert" tabindex="-1"></div>
<div class="plan-tabs" role="tablist" aria-label="计划内容">
<button type="button" role="tab" id="configTab" aria-selected="true" aria-controls="configPanel" tabindex="0">基本信息与执行规则</button>
<button type="button" role="tab" id="itemsTab" aria-selected="false" aria-controls="itemsPanel" tabindex="-1">维护项目 <span id="itemTotal" class="tab-count">0</span></button></div><div id="configPanel" class="plan-panel plan-config-panel" role="tabpanel" aria-labelledby="configTab"><section class="form-section section-block"><h3 class="plan-section-title">基本信息</h3><div class="form-grid plan-form-grid"><div class="form-row"><label for="plan-name"><span class="required">*</span>计划名称</label><div class="control"><input id="plan-name" type="text" placeholder="请输入维护计划名称" required><div class="field-error" id="nameError"></div></div></div><div class="form-row"><label id="modelLabel"><span class="required">*</span>适用车型</label><div class="control"><div id="modelSelect" aria-labelledby="modelLabel"></div><div class="field-error" id="modelError"></div></div></div><div class="form-row full"><label for="plan-scope"><span class="required">*</span>适用项目</label><div class="control"><select id="plan-scope"><option value="all">全部项目</option><option value="selected">指定项目</option></select><div class="check-options project-options" id="projectOptions" hidden></div><div class="field-error" id="projectError"></div></div></div><div class="form-row full"><label for="plan-notes">备注</label><div class="control"><textarea id="plan-notes" rows="2" placeholder="补充计划说明（选填）"></textarea></div></div></div></section>
<section class="form-section section-block"><h3 class="plan-section-title">执行规则</h3><div class="form-grid plan-form-grid"><div class="form-row full"><span class="form-label">豁免车辆状态</span><div class="control"><div class="check-options" id="exemptOptions"></div><p class="muted">已报废、已处置车辆始终排除，不生成维护任务。</p></div></div><div class="form-row"><span class="form-label">日例保豁免</span><div class="control"><div class="check-options"><label><input id="noWork" type="checkbox">无作业任务车辆免日检</label></div><p class="muted">仅适用于日例保；两日、周、季度、半年、年不受此项影响。</p></div></div><div class="form-row"><span class="form-label">日检模式</span><div class="control"><div class="check-options"><label><input id="preTrip" type="checkbox">出车前检查</label></div><p class="muted">勾选后，日例保任务要求每日出车前完成。</p></div></div><div class="form-row full"><label for="firstBase">首次起算依据</label><div class="control"><input id="firstBase" type="text" readonly value="入项目日期"><p class="muted">非日检首次维护从入项目日期起算，后续按上次同周期任务实际完成日期 + 周期计算。</p></div></div></div><div class="rule-note">日例保按自然日生成；同一车辆、同一具体周期、同轮到期检查项生成一项任务，不同具体周期分别生成。</div></section></div><section id="itemsPanel" class="plan-panel plan-items-panel" role="tabpanel" aria-labelledby="itemsTab" hidden><div id="itemTools"></div><div id="itemsTable" class="plan-table-scroll" tabindex="0" aria-label="维护项目列表"></div><div class="plan-pagination"><span id="itemRange" class="muted" aria-live="polite"></span></div><div class="field-error" id="itemsError"></div></section><div class="sticky-save"><span class="muted" id="saveHint">所有检查项与规则随计划统一保存</span><button class="btn" type="button" id="cancelEditor">取消</button><button class="btn" type="button" id="saveDraft">保存为草稿</button><button class="btn btn-primary" type="submit">保存计划</button></div></form>
</section></main></div></div>
<div class="modal-overlay item-modal" id="itemModal"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle"><div class="modal-header"><h3 id="itemModalTitle">新增检查项</h3><button class="modal-close" type="button" aria-label="关闭" onclick="Common.closeModal('itemModal')">×</button></div><div class="modal-body"><form id="itemForm" class="maintenance-form" novalidate><div class="form-row"><label for="item-system"><span class="required">*</span>所属系统</label><div class="control"><select id="item-system"></select><div class="field-error" data-error="system"></div></div></div><div class="form-row"><label for="item-part"><span class="required">*</span>检查部件</label><div class="control"><input id="item-part" type="text" placeholder="请输入检查部件"><div class="field-error" data-error="part"></div></div></div><div class="form-row"><label for="item-name"><span class="required">*</span>检查项目</label><div class="control"><input id="item-name" type="text" placeholder="请输入检查项目"><div class="field-error" data-error="name"></div></div></div><div class="form-row"><label for="item-standard"><span class="required">*</span>判定标准</label><div class="control"><textarea id="item-standard" rows="3" placeholder="请输入可判断的检查标准"></textarea><div class="field-error" data-error="standard"></div></div></div><div class="form-row"><label for="item-cycle"><span class="required">*</span>检查周期</label><div class="control"><select id="item-cycle"></select><div class="field-error" data-error="cycle"></div></div></div><div class="field-error" id="itemDuplicateError" role="alert"></div></form></div><div class="modal-footer"><button class="btn" type="button" onclick="Common.closeModal('itemModal')">取消</button><button class="btn btn-primary" type="submit" form="itemForm">确定</button></div></div></div>
<script src="../components/common.js"></script><script src="../components/fixed-table.js"></script><script src="../components/search-select.js"></script><script src="maintenance-data.js"></script><script src="maintenance-lifecycle.js"></script><script src="maintenance-plan.js"></script><script src="maintenance.js"></script></body></html>
