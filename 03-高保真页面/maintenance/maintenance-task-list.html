<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>维护任务台账 - 车辆管理系统</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../components/common.css"><link rel="stylesheet" href="../components/fixed-table.css"><link rel="stylesheet" href="maintenance.css"></head>
<!-- 页面用途：查询任务和检查结果，仅提供PC查看，不提供代执行。任务为静态样例，真实调度与回传范围见README。 -->
<body data-page="task-list"><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main-area"><div id="header"></div><main class="content"><section class="page-container">
<form class="filter-bar" id="queryForm" data-progressive-filter aria-label="维护任务筛选">
<div class="filter-row filter-primary"><div class="filter-item"><label for="q-task">任务编号</label><input class="ant-input" id="q-task" placeholder="请输入任务编号"></div><div class="filter-item"><label for="q-vehicle">车辆</label><input class="ant-input" id="q-vehicle" placeholder="车牌号 / 车架号"></div><div class="filter-item"><label for="q-project">归属项目</label><select class="ant-input" id="q-project"><option value="">全部项目</option></select></div><div class="filter-actions"><button class="btn btn-primary" type="submit">查询</button><button class="btn" id="resetQuery" type="button">重置</button></div><button class="filter-more-toggle" type="button" aria-expanded="false"><span class="filter-more-text">展开更多</span><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button></div>
<div class="filter-row filter-extra"><div class="filter-item"><label for="q-plan">维护计划</label><input class="ant-input" id="q-plan" placeholder="请输入计划名称"></div><div class="filter-item"><label for="q-cycle">检查周期</label><select class="ant-input" id="q-cycle"><option value="">全部周期</option></select></div><div class="filter-item"><label for="q-status">任务状态</label><select class="ant-input" id="q-status"><option value="">全部状态</option><option>待开始</option><option>进行中</option><option>已完成</option><option>逾期</option><option>逾期完成</option><option>已失效</option></select></div><div class="filter-item"><label for="q-generated-start">生成时间</label><div class="date-range"><input class="ant-input" id="q-generated-start" type="date" aria-label="生成开始日期"><span class="date-separator">至</span><input class="ant-input" id="q-generated-end" type="date" aria-label="生成结束日期"></div></div></div>
</form>
<div class="action-bar"><button class="btn" id="exportButton" type="button">导出</button><div class="selection-summary push-right" id="selectionSummary"><span>已选择 <strong id="selectedCount">0</strong> 条</span><button class="selection-clear" id="clearSelectionButton" type="button">清空选择</button></div></div>
<div class="table-wrapper fixed-table maintenance-table" data-fixed-first="2" data-fixed-start="0" data-fixed-last="1" data-fixed-min-width="1550px"><table><colgroup><col style="width:50px"><col style="width:190px"><col style="width:140px"><col style="width:160px"><col style="width:220px"><col style="width:150px"><col style="width:160px"><col style="width:100px"><col style="width:170px"><col style="width:120px"><col style="width:90px"></colgroup><thead><tr><th><input id="checkAll" type="checkbox" aria-label="全选当前页"></th><th>任务编号</th><th>网联编号</th><th>归属项目</th><th>维护计划</th><th>周期 / 类型</th><th>生成时间</th><th>任务状态</th><th>实际完成时间</th><th>完成人</th><th>操作</th></tr></thead><tbody id="taskBody"></tbody></table></div><div class="maintenance-pagination" id="pager"></div><div id="loadError" class="form-errors" role="alert"></div>
</section></main></div></div>
<div class="modal-overlay" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="exportTitle"><div class="modal-box"><div class="modal-header"><h3 id="exportTitle">导出维护任务</h3><button class="modal-close" type="button" data-close="exportModal" aria-label="关闭">×</button></div><div class="modal-body"><p id="exportDescription"></p><div class="export-field"><label for="exportFileName">文件名</label><input class="export-name" id="exportFileName" type="text"></div></div><div class="modal-footer"><button class="btn" type="button" data-close="exportModal">取消</button><button class="btn btn-primary" id="confirmExportButton" type="button">确认导出</button></div></div></div>
<script src="../components/common.js"></script><script src="../components/pagination-component.js"></script><script src="../components/fixed-table.js"></script><script src="../components/filter-component.js"></script><script src="../components/export-component.js"></script><script src="maintenance-data.js"></script><script src="maintenance.js"></script></body></html>
