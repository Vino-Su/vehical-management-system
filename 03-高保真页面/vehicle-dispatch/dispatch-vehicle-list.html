<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可用车辆库 - 列表页</title>
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/fixed-table.css">
    <link rel="stylesheet" href="../components/form.css">
    <!--
      调度管理 - 可用车辆库列表页
      页面用途：汇聚车辆状态为「在库-闲置可调出」的车辆，供用户查询可用车辆并批量发起调拨申请（PRD F01）
      核心功能：多条件筛选（展开/收起）、全选与单选、新建调度申请（含添加车辆弹窗）、导出、详情跳转、分页
      交互逻辑：勾选车辆 → 新建调度申请（校验项目一致性与车辆状态）→ 弹窗内可继续添加/删除车辆 → 提交；
                未勾选数据点击导出走二次确认；弹窗支持遮罩点击与 ESC 关闭（由 Common.initLayout 绑定）
    -->
    <style>
        /* 筛选区容器与间距统一由 common.css 的 .search-bar 提供（与表格区间距 24px） */
        .search-row { flex: 1; }
        .search-item {
            display: none; align-items: center; gap: 8px;
        }
        .search-item.visible { display: flex; }
        .search-item label {
            font-size: 14px; color: var(--text-secondary); white-space: nowrap;
        }
        .search-item input, .search-item select {
            height: 32px; border: 1px solid var(--border-input); border-radius: var(--radius);
            padding: 0 12px; font-size: 14px; color: var(--text-primary); outline: none; min-width: 160px;
        }
        .search-item input:focus, .search-item select:focus { border-color: var(--primary); }
        .search-item input::placeholder { color: var(--text-disabled); }
        .search-actions {
            display: flex; align-items: center; gap: 8px; margin-left: auto;
        }
        .toggle-expand {
            color: var(--primary); font-size: 14px; cursor: pointer; user-select: none;
            display: flex; align-items: center; gap: 4px;
        }
        .toggle-expand:hover { color: var(--primary-hover); }
        .toggle-expand .arrow { transition: transform .3s; font-size: 12px; }
        .toggle-expand.expanded .arrow { transform: rotate(180deg); }

        /* ========== 操作栏 ========== */
        /* 按钮组内间距 8px、自动换行由 common.css 的 .action-bar 提供 */

        /* ========== 状态标签 ========== */
        /* 状态标签统一使用 common.css 的 .tag / .tag-*（圆角 4px、Ant Design 标准色值） */

        /* ========== 操作链接 ========== */
        .action-link { color: var(--primary); font-size: 13px; cursor: pointer; text-decoration: none; }
        .action-link:hover { color: var(--primary-hover); }
        /* 操作按钮组内间距 8px（规范二.2） */
        .action-link + .action-link { margin-left: 8px; }
        .action-link.danger { color: var(--error); }
        .action-link.danger:hover { color: #ff7875; }

        /* ========== 弹窗容器 ========== */
        /* .modal-overlay / .modal-box / .modal-header / .modal-body / .modal-footer 统一由 common.css 提供：
           取消居左、提交居右；遮罩点击与 ESC 关闭由 Common.bindGlobalEvents 绑定。
           业务所需宽度以行内 style 指定（最大不超过 90vw） */

        /* 新建调度申请弹窗（900px，PRD F02） */
        .apply-section { margin-bottom: 20px; }
        .apply-section-title {
            font-size: 14px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);
        }
        /* 表单栅格：24 栅格，表单项垂直间距 16px、标签与控件间距 12px（规范二.2）；
           标签左置外置、控件高 32px/圆角 6px/focus 态与 .field-error 均由 form.css 的 .form-row 提供 */
        .apply-form {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px;
        }
        .apply-form .form-row { margin-bottom: 0; }
        .apply-form .form-row > label { padding-top: 5px; font-size: 14px; }

        /* ========== 车辆清单（表格样式统一由 common.css 的 .table-wrapper 提供） ========== */
        .vehicle-list-table { width: 100%; }
        .add-vehicle-btn {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--primary); font-size: 13px; cursor: pointer; margin-top: 8px;
        }
        .add-vehicle-btn:hover { color: var(--primary-hover); }

        /* 导出确认弹窗：.confirm-box / .confirm-body / .confirm-icon / .confirm-text 由 common.css 提供 */

        /* 添加车辆弹窗（800px，PRD F07） */
        .add-vehicle-search {
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 16px;
            padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
        }
        .add-vehicle-search .search-field {
            display: flex; align-items: center; gap: 8px;
        }
        .add-vehicle-search .search-field label {
            font-size: 14px; color: var(--text-secondary); white-space: nowrap;
        }
        .add-vehicle-search .search-field input, .add-vehicle-search .search-field select {
            height: 32px; border: 1px solid var(--border-input); border-radius: var(--radius);
            padding: 0 12px; font-size: 14px; outline: none; min-width: 160px;
        }
        /* 添加车辆表格：行高 48px、内边距 16px、字号 14px、行 hover 由 .table-wrapper 统一提供 */
        .add-vehicle-table { width: 100%; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <div class="content">
            <div class="page-container">
                <!-- 查询筛选区 -->
                <div class="search-bar">
                    <div class="search-row" id="searchRow">
                        <div class="search-item visible" data-idx="0">
                            <label>车架号</label>
                            <input type="text" id="s_vin" placeholder="请输入车架号">
                        </div>
                        <div class="search-item visible" data-idx="1">
                            <label>车型名称（中）</label>
                            <input type="text" id="s_model_name" placeholder="请输入车型名称">
                        </div>
                        <div class="search-item visible" data-idx="2">
                            <label>车型版本</label>
                            <input type="text" id="s_model_version" placeholder="请输入车型版本">
                        </div>
                        <div class="search-item visible" data-idx="3">
                            <label>网联编号</label>
                            <input type="text" id="s_iot_code" placeholder="请输入网联编号">
                        </div>
                        <div class="search-item" data-idx="4">
                            <label>车型编码</label>
                            <input type="text" id="s_model_code" placeholder="请输入车型编码">
                        </div>
                        <div class="search-item" data-idx="5">
                            <label>车牌号</label>
                            <input type="text" id="s_plate_no" placeholder="请输入车牌号">
                        </div>
                        <div class="search-item" data-idx="6">
                            <label>车辆型号</label>
                            <input type="text" id="s_vehicle_model" placeholder="请输入车辆型号">
                        </div>
                        <div class="search-item" data-idx="7">
                            <label>资产来源</label>
                            <select id="s_asset_source">
                                <option value="">请选择</option>
                                <option>外购</option><option>租赁</option><option>融资租赁</option><option>借用</option><option>自研</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="8">
                            <label>归属项目</label>
                            <select id="s_project">
                                <option value="">请选择</option>
                                <option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option><option>镜湖区项目</option><option>鸠江江北项目</option><option>鸠江开发区项目</option><option>鸠江项目</option><option>陵水项目</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="9">
                            <label>运营负责人</label>
                            <input type="text" id="s_operator" placeholder="请输入运营负责人">
                        </div>
                        <div class="search-item" data-idx="10">
                            <label>车辆状态</label>
                            <select id="s_vehicle_status" disabled>
                                <option value="在库-闲置可调出" selected>在库-闲置可调出</option>
                            </select>
                        </div>
                        <div class="search-item" data-idx="11">
                            <label>发布时间</label>
                            <input type="date" id="s_publish_start"><span style="color:var(--text-disabled)">~</span><input type="date" id="s_publish_end">
                        </div>
                        <div class="search-actions">
                            <button class="btn btn-primary" onclick="doSearch()">查询</button>
                            <button class="btn" onclick="doReset()">重置</button>
                            <span class="toggle-expand" id="toggleExpand" onclick="toggleSearchExpand()">
                                展开 <span class="arrow">▼</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 操作栏 -->
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openApplyModal()">新建调度申请</button>
                    <button class="btn push-right" onclick="doExport()">导出</button>
                </div>

                <!-- 数据列表（对齐规则，规范二.3：文本列左对齐、编码/日期列居中、复选框与操作列居中） -->
                <div class="table-wrapper fixed-table" data-fixed-first="1" data-fixed-last="1" data-fixed-min-width="1320px">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-center" style="width:50px"><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this)"></th>
                                <th class="col-center" style="width:180px">车架号</th>
                                <th class="col-left" style="width:180px">车型名称（中）</th>
                                <th class="col-left" style="width:100px">车型版本</th>
                                <th class="col-center" style="width:110px">网联编号</th>
                                <th class="col-center" style="width:110px">车型编码</th>
                                <th class="col-left" style="width:120px">车牌号</th>
                                <th class="col-left" style="width:140px">车辆型号</th>
                                <th class="col-left" style="width:100px">资产来源</th>
                                <th class="col-left" style="width:130px">归属项目</th>
                                <th class="col-left" style="width:110px">运营负责人</th>
                                <th class="col-left" style="width:140px">车辆状态</th>
                                <th class="col-center" style="width:170px">发布时间</th>
                                <th class="col-center" style="width:100px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="pagination-area">
                    <div class="pagination-left">
                        <div class="pagination-info">共 <strong id="totalCount">0</strong> 条记录</div>
                        <span class="pagination-pages" id="vehicleListPageInfo"></span>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <div class="pagination" id="paginationEl"></div>
                        <select class="page-size-select" id="pageSizeSelect" onchange="changePageSize()">
                            <option value="10" selected>10条/页</option>
                            <option value="20">20条/页</option>
                            <option value="50">50条/页</option>
                            <option value="100">100条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新建调度申请弹窗（宽度 900px，PRD 3.2.2） -->
<div class="modal-overlay" id="applyModal">
    <div class="modal-box" style="width:900px;max-width:90vw;max-height:85vh">
        <div class="modal-header"><h3>新建调度申请</h3><span class="modal-close" onclick="closeApplyModal()">×</span></div>
        <div class="modal-body">
            <!-- 申请信息区 -->
            <div class="apply-section">
                <div class="apply-section-title">申请信息</div>
                <div class="apply-form">
                    <div class="form-row" id="row_a_role">
                        <label><span class="required">*</span>用户角色</label>
                        <div class="control">
                            <select id="a_role">
                                <option value="">请选择</option>
                                <option>营运作业工人</option><option>压测研发工程师</option><option>研发工程师</option>
                                <option>管理人员</option><option>商务人员</option><option>售后工人</option><option>维修厂工人</option>
                            </select>
                            <div class="field-error" id="err_a_role"></div>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>车辆编号</label>
                        <div class="control">
                            <input type="text" id="a_vehicle_nos" readonly placeholder="自动汇总">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>车架号</label>
                        <div class="control">
                            <input type="text" id="a_vin_codes" readonly placeholder="自动汇总">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>当前项目</label>
                        <div class="control">
                            <input type="text" id="a_current_project" readonly placeholder="自动汇总">
                        </div>
                    </div>
                    <div class="form-row" id="row_a_to_project">
                        <label><span class="required">*</span>接收项目</label>
                        <div class="control">
                            <select id="a_to_project">
                                <option value="">请选择</option>
                                <option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option><option>镜湖区项目</option>
                                <option>鸠江江北项目</option><option>鸠江开发区项目</option><option>鸠江项目</option><option>陵水项目</option>
                            </select>
                            <div class="field-error" id="err_a_to_project"></div>
                        </div>
                    </div>
                    <div class="form-row" id="row_a_receiver">
                        <label><span class="required">*</span>接收人</label>
                        <div class="control">
                            <select id="a_receiver">
                                <option value="">请选择</option>
                                <option>张三</option><option>李四</option><option>王五</option><option>赵六</option>
                            </select>
                            <div class="field-error" id="err_a_receiver"></div>
                        </div>
                    </div>
                    <div class="form-row" id="row_a_receive_time">
                        <label><span class="required">*</span>预计接收时间</label>
                        <div class="control">
                            <input type="date" id="a_receive_time">
                            <div class="field-error" id="err_a_receive_time"></div>
                        </div>
                    </div>
                    <div class="form-row">
                        <label><span class="required">*</span>周转用途</label>
                        <div class="control">
                            <select id="a_transfer_purpose"><option value="项目流转" selected>项目流转</option></select>
                        </div>
                    </div>
                    <div class="form-row" id="row_a_approver">
                        <label><span class="required">*</span>审批人</label>
                        <div class="control">
                            <select id="a_approver">
                                <option value="">请选择</option>
                                <option>张三</option><option>李四</option><option>王五</option><option>赵六</option>
                            </select>
                            <div class="field-error" id="err_a_approver"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 车辆清单区 -->
            <div class="apply-section">
                <div class="apply-section-title">车辆清单</div>
                <div class="table-wrapper" style="margin-top:8px">
                    <table class="vehicle-list-table">
                        <thead>
                            <tr>
                                <th class="col-center" style="width:110px">车辆编号</th>
                                <th class="col-center" style="width:180px">车架号</th>
                                <th class="col-left" style="width:200px">车型名称（中）</th>
                                <th class="col-left" style="width:140px">归属项目</th>
                                <th class="col-center" style="width:80px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="applyVehicleList"></tbody>
                    </table>
                </div>
                <div class="add-vehicle-btn" onclick="addVehicleToApply()"><span>+</span> 添加车辆</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeApplyModal()">取消</button>
            <button class="btn btn-primary" onclick="submitApply()">提交</button>
        </div>
    </div>
</div>

<!-- 添加车辆弹窗（宽度 800px，PRD 3.7.2） -->
<div class="modal-overlay" id="addVehicleModal">
    <div class="modal-box" style="width:800px;max-width:90vw;max-height:80vh">
        <div class="modal-header"><h3>添加车辆</h3><span class="modal-close" onclick="closeAddVehicleModal()">×</span></div>
        <div class="modal-body">
            <div class="add-vehicle-search">
                <div class="search-field">
                    <label>车架号</label>
                    <input type="text" id="av_vin" placeholder="请输入车架号">
                </div>
                <div class="search-field">
                    <label>车型名称（中）</label>
                    <input type="text" id="av_model" placeholder="请输入车型名称">
                </div>
                <div class="search-field">
                    <label>归属项目</label>
                    <select id="av_project">
                        <option value="">请选择</option>
                        <option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option><option>镜湖区项目</option>
                        <option>鸠江江北项目</option><option>鸠江开发区项目</option><option>鸠江项目</option><option>陵水项目</option>
                    </select>
                </div>
                <div style="display:flex;gap:8px;margin-left:auto">
                    <button class="btn btn-primary" onclick="searchAddVehicles()">查询</button>
                    <button class="btn" onclick="resetAddVehicles()">重置</button>
                </div>
            </div>
            <div class="table-wrapper" style="max-height:320px">
                <table class="add-vehicle-table">
                    <thead>
                        <tr>
                            <th class="col-center" style="width:50px"><input type="checkbox" id="avCheckAll" onchange="toggleAvCheckAll(this)"></th>
                            <th class="col-center" style="width:110px">车辆编号</th>
                            <th class="col-center" style="width:180px">车架号</th>
                            <th class="col-left" style="width:180px">车型名称（中）</th>
                            <th class="col-left" style="width:100px">车型版本</th>
                            <th class="col-center" style="width:110px">网联编号</th>
                            <th class="col-left" style="width:130px">归属项目</th>
                            <th class="col-left" style="width:140px">车辆状态</th>
                        </tr>
                    </thead>
                    <tbody id="addVehicleTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeAddVehicleModal()">取消</button>
            <button class="btn btn-primary" onclick="confirmAddVehicles()">确定</button>
        </div>
    </div>
</div>

<!-- 导出确认弹窗 -->
<div class="modal-overlay" id="exportModal">
    <div class="modal-box confirm-box">
        <div class="modal-header"><h3>提示</h3><span class="modal-close" onclick="closeExportModal()">×</span></div>
        <div class="confirm-body">
            <span class="confirm-icon">⚠</span>
            <span class="confirm-text">是否导出所有数据？</span>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeExportModal()">否</button>
            <button class="btn btn-primary" onclick="confirmExport()">是</button>
        </div>
    </div>
</div>

<script src="../components/common.js"></script>
<script src="../components/fixed-table.js"></script>
<script>
// ===== 初始化布局 =====
Common.initLayout({
    basePath: '../',
    sidebarId: 'sidebar',
    activeMenuId: 'transfer-available',
    headerId: 'header',
    headerOptions: { showProject: false }
});

// ===== 模拟数据（仅展示在库-闲置可调出状态的车辆）=====
const mockData = [
    { id:1, vin:'LSVAU2A39EN000003', model_name:'中联清洗车', model_version:'V1.0', iot_code:'14158', model_code:'ZL-QX01', plate_no:'浙JAR6538', vehicle_model:'BQ5080GQXBEV', asset_source:'外购', project:'镜湖区项目', operator:'李明', vehicle_status:'在库-闲置可调出', publish_time:'2025-04-20 14:00:00', vehicle_no:'V003' },

let currentPage = 1, pageSize = 10;

// ===== 渲染表格 =====
function renderTable() {
    const start = (currentPage - 1) * pageSize;
    const pageData = filteredData.slice(start, start + pageSize);
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    // 空态：筛选无结果时展示占位提示，避免表格空白
    if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="14" style="border-bottom:none">
            <div class="placeholder-state">
                <div class="placeholder-icon">🚚</div>
                <div class="placeholder-text">暂无数据</div>
                <div class="placeholder-hint">未查询到符合条件的可用车辆，请调整筛选条件后重试</div>
            </div></td></tr>`;
        renderPagination();
        return;
    }
    pageData.forEach(item => {
        const ck = selectedIds.has(item.id) ? 'checked' : '';
        const selCls = selectedIds.has(item.id) ? ' selected' : '';
        const tr = document.createElement('tr');
        if (selCls) tr.className = selCls;
        tr.innerHTML = `
            <td class="col-center"><input type="checkbox" data-id="${item.id}" ${ck} onchange="toggleCheck(${item.id},this)"></td>
            <td class="col-center" title="${item.vin}">${item.vin}</td>
            <td class="col-left ellipsis" style="max-width:180px" title="${item.model_name}">${item.model_name}</td>
            <td class="col-left">${item.model_version}</td>
            <td class="col-center">${item.iot_code}</td>
            <td class="col-center">${item.model_code}</td>
            <td class="col-left">${item.plate_no}</td>
            <td class="col-left">${item.vehicle_model}</td>
            <td class="col-left">${item.asset_source}</td>
            <td class="col-left ellipsis" style="max-width:130px" title="${item.project}">${item.project}</td>
            <td class="col-left">${item.operator}</td>
            <td class="col-left"><span class="tag tag-orange">${item.vehicle_status}</span></td>
            <td class="col-center">${item.publish_time}</td>
            <td class="col-center">
                <a class="action-link" href="../vehicle-asset/vehicle-asset-detail.html?id=${item.id}">详情</a>
            </td>`;
        tbody.appendChild(tr);
    });
    renderPagination();
}

// ===== 分页 =====

        total: filteredData.length, currentPage, pageSize,

        onPageChange: p => { currentPage = p; renderTable(); }

}
function changePageSize() {

// ===== 复选框 =====
function toggleCheckAll(el) {
    const start = (currentPage - 1) * pageSize;
    const pageData = filteredData.slice(start, start + pageSize);
    pageData.forEach(item => { if (el.checked) selectedIds.add(item.id); else selectedIds.delete(item.id); });
    renderTable();
}
function toggleCheck(id, el) {
    if (el.checked) selectedIds.add(id); else selectedIds.delete(id);

}

// ===== 查询/重置 =====
function doSearch() {
    const sv = document.getElementById('s_vin').value.trim().toLowerCase();
    const sm = document.getElementById('s_model_name').value.trim().toLowerCase();
    const smv = document.getElementById('s_model_version').value.trim().toLowerCase();
    const si = document.getElementById('s_iot_code').value.trim().toLowerCase();
    const smc = document.getElementById('s_model_code').value.trim().toLowerCase();
    const sp = document.getElementById('s_plate_no').value.trim().toLowerCase();
    const svm = document.getElementById('s_vehicle_model').value.trim().toLowerCase();
    const ss = document.getElementById('s_asset_source').value;
    const spr = document.getElementById('s_project').value;
    const so = document.getElementById('s_operator').value.trim().toLowerCase();
    const sps = document.getElementById('s_publish_start').value;
    const spe = document.getElementById('s_publish_end').value;
    filteredData = mockData.filter(item => {
        if (sv && !item.vin.toLowerCase().includes(sv)) return false;
        if (sm && !item.model_name.toLowerCase().includes(sm)) return false;
        if (smv && !item.model_version.toLowerCase().includes(smv)) return false;
        if (si && !item.iot_code.toLowerCase().includes(si)) return false;
        if (smc && !item.model_code.toLowerCase().includes(smc)) return false;
        if (sp && !item.plate_no.toLowerCase().includes(sp)) return false;
        if (svm && !item.vehicle_model.toLowerCase().includes(svm)) return false;
        if (ss && item.asset_source !== ss) return false;
        if (spr && item.project !== spr) return false;
        if (so && !item.operator.toLowerCase().includes(so)) return false;
        if (sps && item.publish_time < sps) return false;
        if (spe && item.publish_time > spe + ' 23:59:59') return false;
        return true;
    });
    currentPage = 1; selectedIds.clear(); renderTable();
}
function doReset() {
    document.querySelectorAll('.search-item input, .search-item select').forEach(el => {
        if (el.type === 'date') el.value = '';
        else if (el.tagName === 'SELECT') el.selectedIndex = 0;
        else el.value = '';
    });
    document.getElementById('s_vehicle_status').value = '在库-闲置可调出';
    filteredData = [...mockData]; currentPage = 1; selectedIds.clear(); renderTable();
}

// ===== 展开/收起 =====
let expanded = false;
function toggleSearchExpand() {
    expanded = !expanded;
    document.querySelectorAll('.search-item[data-idx]').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        if (idx >= 4) el.classList.toggle('visible', expanded);
    });
    const toggle = document.getElementById('toggleExpand');
    toggle.innerHTML = expanded ? '收起 <span class="arrow">▼</span>' : '展开 <span class="arrow">▼</span>';

}

function openApplyModal() {
    if (selectedIds.size === 0) {
        Common.showToast('当前未选择任何车辆', 'warning');
        return;
    }
    // 初始化车辆清单
    applyVehicles = [];
    selectedIds.forEach(id => {
        const item = mockData.find(d => d.id === id);
        if (item) applyVehicles.push({...item});
    });
    // 检查项目一致性
    const projects = new Set(applyVehicles.map(v => v.project));
    if (projects.size > 1) {
        Common.showToast('所选车辆归属项目不一致', 'error');
        return;
    }
    // 填充只读字段
    document.getElementById('a_vehicle_nos').value = applyVehicles.map(v => v.vehicle_no).join(', ');
    document.getElementById('a_vin_codes').value = applyVehicles.map(v => v.vin).join(', ');
    document.getElementById('a_current_project').value = Array.from(projects)[0] || '';
    renderApplyVehicleList();

    document.getElementById('a_role').value = '';
    document.getElementById('a_to_project').value = '';
    document.getElementById('a_receiver').value = '';
    document.getElementById('a_receive_time').value = '';
    document.getElementById('a_approver').value = '';

}
function closeApplyModal() {

function renderApplyVehicleList() {

        tbody.innerHTML += `<tr>

}
function removeApplyVehicle(idx) {
    if (applyVehicles.length <= 1) {
        Common.showToast('车辆清单不能为空', 'warning');
        return;
    }
    applyVehicles.splice(idx, 1);
    document.getElementById('a_vehicle_nos').value = applyVehicles.map(v => v.vehicle_no).join(', ');
    document.getElementById('a_vin_codes').value = applyVehicles.map(v => v.vin).join(', ');

// ===== 表单字段级校验（规范三.2：错误提示为红色文字，位于控件下方） =====
function showFieldError(rowId, errId, msg) {
    const row = document.getElementById(rowId);
    const err = document.getElementById(errId);
    if (row) row.classList.add('has-error');
    if (err) err.textContent = msg;
}
function clearFieldErrors() {
    document.querySelectorAll('#applyModal .form-row.has-error').forEach(r => r.classList.remove('has-error'));
    document.querySelectorAll('#applyModal .field-error').forEach(e => { e.textContent = ''; });
}

function submitApply() {
    const role = document.getElementById('a_role').value;
    const toProject = document.getElementById('a_to_project').value;
    const receiver = document.getElementById('a_receiver').value;
    const receiveTime = document.getElementById('a_receive_time').value;
    const approver = document.getElementById('a_approver').value;
    clearFieldErrors();
    let hasError = false;
    if (!role) { showFieldError('row_a_role', 'err_a_role', '用户角色不能为空'); hasError = true; }
    if (!toProject) { showFieldError('row_a_to_project', 'err_a_to_project', '接收项目不能为空'); hasError = true; }
    if (!receiver) { showFieldError('row_a_receiver', 'err_a_receiver', '接收人不能为空'); hasError = true; }
    if (!receiveTime) { showFieldError('row_a_receive_time', 'err_a_receive_time', '预计接收时间不能为空'); hasError = true; }
    if (!approver) { showFieldError('row_a_approver', 'err_a_approver', '审批人不能为空'); hasError = true; }
    if (hasError) { Common.showToast('请完善必填项后提交', 'error'); return; }
    // 预计接收时间必须大于等于当前日期（PRD 4.2）
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (new Date(receiveTime + 'T00:00:00') < today) {
        showFieldError('row_a_receive_time', 'err_a_receive_time', '预计接收时间不能早于今天');
        Common.showToast('预计接收时间不能早于今天', 'error');
        return;
    }
    // 车辆状态校验：所选车辆必须均为「在库-闲置可调出」（PRD 4.2）
    const invalidVehicles = applyVehicles.filter(v => v.vehicle_status !== '在库-闲置可调出');
    if (invalidVehicles.length > 0) {
        Common.showToast('以下车辆状态不是「在库-闲置可调出」，无法提交：' + invalidVehicles.map(v => v.vehicle_no).join('、'), 'error');
        return;
    }
    Common.showToast('提交成功', 'success');
    closeApplyModal();
    selectedIds.clear(); renderTable();
}

let avFilteredData = [...avMockData];
let avSelectedIds = new Set();
let avCurrentProject = '';

function openAddVehicleModal() {
    avCurrentProject = applyVehicles.length > 0 ? applyVehicles[0].project : '';
    if (avCurrentProject) {
        document.getElementById('av_project').value = avCurrentProject;
    } else {
        document.getElementById('av_project').value = '';
    }
    document.getElementById('av_vin').value = '';
    document.getElementById('av_model').value = '';

    avSelectedIds.clear();

function renderAddVehicleTable() {
    const tbody = document.getElementById('addVehicleTableBody');
    tbody.innerHTML = '';
    avFilteredData.forEach(item => {
        const ck = avSelectedIds.has(item.id) ? 'checked' : '';
        tbody.innerHTML += `<tr>
            <td class="col-center"><input type="checkbox" data-id="${item.id}" ${ck} onchange="toggleAvCheck(${item.id},this)"></td>
            <td class="col-center">${item.vehicle_no}</td>
            <td class="col-center">${item.vin}</td>
            <td class="col-left ellipsis" style="max-width:180px" title="${item.model_name}">${item.model_name}</td>

            <td class="col-left"><span class="tag tag-orange">${item.vehicle_status}</span></td>
        </tr>`;

function searchAddVehicles() {
    const sv = document.getElementById('av_vin').value.trim().toLowerCase();
    const sm = document.getElementById('av_model').value.trim().toLowerCase();
    const sp = document.getElementById('av_project').value;
    avFilteredData = avMockData.filter(item => {
        if (sv && !item.vin.toLowerCase().includes(sv)) return false;
        if (sm && !item.model_name.toLowerCase().includes(sm)) return false;
        if (sp && item.project !== sp) return false;
        return true;
    });
    renderAddVehicleTable();
}
function resetAddVehicles() {
    document.getElementById('av_vin').value = '';
    document.getElementById('av_model').value = '';
    document.getElementById('av_project').value = avCurrentProject;
    searchAddVehicles();
}
function toggleAvCheckAll(el) {
    avFilteredData.forEach(item => { if (el.checked) avSelectedIds.add(item.id); else avSelectedIds.delete(item.id); });
    renderAddVehicleTable();
}
function toggleAvCheck(id, el) {
    if (el.checked) avSelectedIds.add(id); else avSelectedIds.delete(id);
}
function confirmAddVehicles() {
    if (avSelectedIds.size === 0) { Common.showToast('请选择要添加的车辆', 'warning'); return; }
    // 先取出数量：closeAddVehicleModal() 会清空 avSelectedIds，避免提示数量恒为 0
    const selectedCount = avSelectedIds.size;
    const selectedItems = [];
    avSelectedIds.forEach(id => {
        const item = avMockData.find(d => d.id === id);
        if (item) selectedItems.push(item);
    });
    // 车辆状态校验：仅「在库-闲置可调出」的车辆可加入清单（PRD 4.2）
    const invalidItems = selectedItems.filter(item => item.vehicle_status !== '在库-闲置可调出');
    if (invalidItems.length > 0) {
        Common.showToast('以下车辆状态不是「在库-闲置可调出」，无法添加：' + invalidItems.map(v => v.vehicle_no).join('、'), 'error');
        return;
    }
    // 项目一致性校验：不同项目的车辆不可加入同一张申请单（PRD 3.7.3）
    if (applyVehicles.length > 0) {
        const existingProject = applyVehicles[0].project;
        for (const item of selectedItems) {
            if (item.project !== existingProject) {
                Common.showToast('所选车辆归属项目与当前清单不一致', 'error');
                return; // 直接终止添加流程，不符合项的车辆不会被加入清单
            }
        }
    }
    selectedItems.forEach(item => {
        if (!applyVehicles.find(v => v.vin === item.vin)) {
            applyVehicles.push({...item});
        }
    });
    if (applyVehicles.length > 0) {
        const projects = new Set(applyVehicles.map(v => v.project));
        document.getElementById('a_vehicle_nos').value = applyVehicles.map(v => v.vehicle_no).join(', ');
        document.getElementById('a_vin_codes').value = applyVehicles.map(v => v.vin).join(', ');
        document.getElementById('a_current_project').value = Array.from(projects)[0] || '';
    }
    renderApplyVehicleList();
    closeAddVehicleModal();
    Common.showToast('已添加 ' + selectedCount + ' 辆车辆', 'success');
}
