<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>充电费用明细台账 - 车辆管理系统</title><link rel="stylesheet" href="../components/common.css"><link rel="stylesheet" href="../components/form.css"><link rel="stylesheet" href="./energy-ledger.css"></head>
<body data-ledger-type="charge">
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main-area"><header id="header"></header><section class="content"><div class="page-container">
<div class="search-bar"><div class="search-row"><div class="ledger-search-item"><label id="timeFilterLabel">充电开始时间</label><div class="ledger-date-range"><input id="startDate" type="date"><span>至</span><input id="endDate" type="date"></div></div><div class="ledger-search-item"><label>车牌号</label><input id="plateFilter" placeholder="支持模糊搜索"></div><div class="ledger-search-item" id="extraFilter"></div><div class="ledger-search-item"><label>上报人</label><input id="reporterFilter" placeholder="支持模糊搜索"></div><div class="ledger-search-item"><button class="btn btn-primary" id="searchBtn" type="button">查询</button><button class="btn" id="resetBtn" type="button">重置</button></div></div></div>
<div class="action-bar"><button class="btn btn-primary" id="addBtn" type="button"><span id="newRecordText"></span></button><button class="btn" id="importBtn" type="button">导入</button><button class="btn" id="exportBtn" type="button">导出</button></div><div class="table-wrapper ledger-table" style="--ledger-table-min-width:1480px"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="ledger-summary" id="summary"></div><div id="paginationEl"></div>
</div></section></main></div>
<div class="modal-overlay" id="formModal"><div class="modal-box modal-box--lg"><div class="modal-header"><h3 id="formTitle"></h3><button class="modal-close" onclick="Common.closeModal('formModal')">×</button></div><div class="modal-body"><p class="ledger-form-note" id="amountRule"></p><div id="formBody"></div></div><div class="modal-footer"><button class="btn" onclick="Common.closeModal('formModal')">取消</button><button class="btn btn-primary" onclick="EnergyLedger.save()">确定</button></div></div></div><div class="modal-overlay" id="detailModal"><div class="modal-box modal-box--lg"><div class="modal-header"><h3 id="detailTitle"></h3><button class="modal-close" onclick="Common.closeModal('detailModal')">×</button></div><div class="modal-body" id="detailBody"></div><div class="modal-footer modal-footer--right"><button class="btn" onclick="Common.closeModal('detailModal')">关闭</button></div></div></div><div class="modal-overlay" id="changeModal"><div class="modal-box modal-box--lg"><div class="modal-header"><h3>变更记录</h3><button class="modal-close" onclick="Common.closeModal('changeModal')">×</button></div><div class="modal-body"><div class="table-wrapper"><table class="ledger-change-table"><thead><tr><th>字段名称</th><th>变更前</th><th>变更后</th><th>变更时间</th><th>变更人</th></tr></thead><tbody id="changeBody"></tbody></table></div></div><div class="modal-footer modal-footer--right"><button class="btn" onclick="Common.closeModal('changeModal')">关闭</button></div></div></div><div class="modal-overlay" id="importModal"><div class="modal-box"><div class="modal-header"><h3 id="importTitle"></h3><button class="modal-close" onclick="Common.closeModal('importModal')">×</button></div><div class="modal-body"><div class="ledger-import-tip"><span>请先下载模板，按模板格式填写后上传。</span><button class="btn btn-sm" type="button" onclick="Common.showToast('导入模板已准备完成','success')">下载模板</button></div><div class="ledger-form-upload"><input id="importFile" type="file" accept=".xlsx,.xls"><div class="ledger-file-hint">支持 .xlsx、.xls 格式，文件大小不超过 10MB</div></div></div><div class="modal-footer"><button class="btn" onclick="Common.closeModal('importModal')">取消</button><button class="btn btn-primary" onclick="EnergyLedger.submitImport()">确定导入</button></div></div></div><div class="modal-overlay" id="previewModal"><div class="modal-box"><div class="modal-header"><h3>凭证预览</h3><button class="modal-close" onclick="Common.closeModal('previewModal')">×</button></div><div class="modal-body" id="previewBody"></div><div class="modal-footer modal-footer--right"><button class="btn" onclick="Common.closeModal('previewModal')">关闭</button></div></div></div>
<script src="../components/common.js"></script><script src="../components/pagination-component.js"></script><script src="./energy-ledger.js"></script></body></html>
