  <link rel="stylesheet" href="../components/common.css">

  <style>

    .group-count { padding: 0 7px; border-radius: 10px; background: #f2f3f5; color: var(--text-secondary); font: 12px/20px var(--font-number); }
    .group.collapsed .group-items { display: none; }
    .vehicle-row { width: 100%; min-height: 64px; margin: 3px 0; padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 9px; border: 1px solid transparent; border-radius: var(--radius); background: #fff; text-align: left; cursor: pointer; }
    .vehicle-row:hover { background: var(--bg-hover); }

    .row-status { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--success); }

    .row-tools { display: flex; gap: 4px; }

    .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }

    #map { width: 100%; height: 100%; background: #dbe7ef; }

    .map-search { width: 100%; max-width: 360px; height: 36px; display: flex; align-items: center; padding: 0 6px 0 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 6px; background: rgba(255,255,255,.96); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .map-search input { flex: 1; min-width: 0; height: 30px; border: 0; outline: 0; background: transparent; color: var(--text-primary); }
    .search-btn { width: 28px; height: 28px; border: 0; border-radius: 4px; background: var(--primary); color: #fff; cursor: pointer; }
    .search-btn:hover { background: var(--primary-hover); }
    .map-filter { width: 100%; max-width: 520px; padding: 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 6px; background: rgba(255,255,255,.96); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .filter-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; font-weight: 600; }
    .filter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .stat-label { color: var(--text-secondary); font-size: 12px; }

    .issue-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }
    .issue-group-title { padding: 8px 6px 6px; color: var(--text-secondary); font-size: 12px; }

    .issue-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

    .track-panel { padding-top: 12px; } .track-meta { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 12px; }
    .track-time { margin-top: 12px; height: 6px; border-radius: 3px; background: #e6f4ff; overflow: hidden; } .track-progress { width: 38%; height: 100%; background: var(--primary); }
    .track-controls { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
    .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } .video-tile { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #162436; color: #a9c7e8; font-size: 12px; }
    .empty-list { padding: 38px 16px; color: var(--text-disabled); text-align: center; }

<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <div id="header"></div>
      <main class="content monitor-content">
        <div class="monitor-stage">
          <aside class="vehicle-drawer" id="vehicleDrawer" aria-label="车辆数据面板">

              <div class="map-filter"><div class="filter-heading"><span>地图筛选</span><button class="filter-link" id="clearMapFilter" type="button">清空</button></div><div class="filter-grid"><select id="mapProject" multiple aria-label="项目（可多选）"><option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option><option>镜湖区项目</option><option>鸠江江北项目</option><option>鸠江开发区项目</option><option>鸠江项目</option><option>陵水项目</option></select><select id="mapRegion" multiple aria-label="区域（可多选）"><option>上海市</option><option>芜湖市</option><option>陵水市</option><option>台州市</option></select><select id="mapModel" multiple aria-label="车型（可多选）"><option>爱瑞特纯电动高压冲洗车</option><option>长城多用途货车</option><option>独角兽</option><option>麒麟清扫车</option><option>麒麟无人化扫地车</option><option>三力洒水车</option><option>泰坦智能驾驶洒水车</option><option>中联清洗车</option></select></div><label class="filter-check"><input id="alertOnly" type="checkbox"> 仅显示故障与异常车辆</label></div>
