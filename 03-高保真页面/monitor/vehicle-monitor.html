<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车辆监管一张图 - 车辆管理系统</title>
  <link rel="stylesheet" href="../components/common.css">
  <link rel="stylesheet" href="../components/vendor/leaflet.css">
  <style>
    :root { --parallel: #52c41a; --auto: #1677ff; }
    html, body { overflow: hidden; }
    .monitor-content { padding: 0 !important; min-height: 0; overflow: hidden; }
    .monitor-stage { display: flex; height: 100%; min-height: 0; position: relative; background: #dbe7ef; }
    .vehicle-drawer { width: 360px; min-width: 360px; height: 100%; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--border-color); z-index: 800; transition: width .22s ease, min-width .22s ease; }
    .vehicle-drawer.collapsed { width: 0; min-width: 0; overflow: visible; border-right: 0; }
    .drawer-head { height: 56px; min-height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .drawer-title { font-size: 16px; line-height: 24px; font-weight: 600; }
    .drawer-count { color: var(--text-secondary); font: 12px/18px var(--font-number); }
    .drawer-tabs { height: 42px; display: flex; border-bottom: 1px solid var(--border-color); }
    .drawer-tab { flex: 1; border: 0; border-bottom: 2px solid transparent; background: #fff; color: var(--text-secondary); cursor: pointer; font-size: 13px; }
    .drawer-tab.active { border-bottom-color: var(--primary); color: var(--primary); font-weight: 500; }
    .drawer-toggle { position: absolute; top: 16px; left: 344px; z-index: 1000; width: 28px; height: 28px; border: 1px solid var(--border-color); border-radius: 0 6px 6px 0; background: #fff; color: var(--text-secondary); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: left .22s ease; }
    .vehicle-drawer.collapsed + .drawer-toggle { left: 0; }
    .drawer-toggle:hover { color: var(--primary); }
    .filter-link { border: 0; padding: 0; background: transparent; color: var(--primary); cursor: pointer; font-size: 12px; }
    .group-switch { height: 48px; min-height: 48px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .segmented { display: inline-flex; padding: 2px; border-radius: var(--radius); background: var(--bg-layout); }
    .segment-btn { height: 28px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px; }
    .segment-btn.active { color: var(--primary); background: #fff; box-shadow: var(--shadow-sm); font-weight: 500; }
    .group-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
    .group + .group { margin-top: 4px; }
    .group-head { width: 100%; height: 36px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: var(--radius); background: transparent; color: var(--text-primary); text-align: left; cursor: pointer; }
    .group-head:hover { background: var(--bg-hover); }
    .group-arrow { width: 16px; color: var(--text-secondary); transition: transform .2s; }
    .group.collapsed .group-arrow { transform: rotate(-90deg); }
    .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .group-count { padding: 0 7px; border-radius: 10px; background: #f2f3f5; color: var(--text-secondary); font: 12px/20px var(--font-number); }
    .group.collapsed .group-items { display: none; }
    .vehicle-row { width: 100%; min-height: 64px; margin: 3px 0; padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 9px; border: 1px solid transparent; border-radius: var(--radius); background: #fff; text-align: left; cursor: pointer; }
    .vehicle-row:hover { background: var(--bg-hover); }
    .vehicle-row.active { border-color: #91caff; background: var(--primary-bg); }
    .row-mode { width: 8px; height: 40px; flex: 0 0 auto; border-radius: 4px; background: var(--parallel); }
    .row-mode.auto { background: var(--auto); }
    .row-mode.manual { background: #8c8c8c; }
    .row-copy { flex: 1; min-width: 0; }
    .row-primary { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .row-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .row-status { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--success); }
    .row-status.offline { background: #bfbfbf; }
    .row-meta { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); font: 12px/18px var(--font-number); }
    .row-tools { display: flex; gap: 4px; }
    .icon-btn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--text-secondary); cursor: pointer; }
    .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }
    .icon-btn:hover { color: var(--primary); background: #e6f4ff; }
    .map-wrap { flex: 1; min-width: 0; position: relative; }
    #map { width: 100%; height: 100%; background: #dbe7ef; }
    .map-toolbar { position: absolute; top: 16px; right: 16px; z-index: 900; width: min(420px, calc(100% - 32px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .map-tool-actions { display: flex; gap: 8px; }
    .map-tool-btn { position: relative; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,.12); border-radius: 6px; background: rgba(255,255,255,.96); color: var(--text-secondary); box-shadow: 0 2px 8px rgba(0,0,0,.12); cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
    .map-tool-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .map-tool-btn:hover, .map-tool-btn.active { color: var(--primary); border-color: #91caff; background: #e6f4ff; }
    .filter-active-count { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border: 2px solid #fff; border-radius: 9px; background: var(--primary); color: #fff; font: 10px/14px var(--font-number); }
    .map-popover { width: 100%; border: 1px solid rgba(0,0,0,.12); border-radius: 6px; background: rgba(255,255,255,.98); box-shadow: 0 4px 16px rgba(0,0,0,.14); animation: toolbarDrop .16s ease-out; }
    .map-popover[hidden] { display: none; }
    @keyframes toolbarDrop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .map-search { width: 360px; max-width: 100%; height: 40px; display: flex; align-items: center; padding: 3px 4px 3px 12px; }
    .map-search input { flex: 1; min-width: 0; height: 32px; border: 0; outline: 0; background: transparent; color: var(--text-primary); }
    .search-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: var(--primary); color: #fff; cursor: pointer; }
    .search-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 2; }
    .search-btn:hover { background: var(--primary-hover); }
    .map-filter { padding: 16px; }
    .filter-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 600; }
    .filter-grid { display: grid; gap: 12px; }
    .filter-field { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 12px; }
    .filter-label { color: var(--text-secondary); text-align: right; font-size: 13px; }
    .multi-select { position: relative; min-width: 0; }
    .select-trigger { width: 100%; height: 32px; padding: 0 11px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-input); border-radius: 6px; background: #fff; color: var(--text-primary); text-align: left; cursor: pointer; }
    .select-trigger:hover, .select-trigger[aria-expanded="true"] { border-color: var(--primary); }
    .select-trigger > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .select-trigger svg { width: 14px; height: 14px; flex: 0 0 auto; fill: none; stroke: var(--text-secondary); stroke-width: 1.8; transition: transform .2s; }
    .select-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }
    .select-menu { position: absolute; top: 36px; left: 0; right: 0; z-index: 4; max-height: 190px; padding: 4px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; background: #fff; box-shadow: var(--shadow-md); }
    .select-menu[hidden] { display: none; }
    .select-option { min-height: 32px; padding: 5px 8px; display: flex; align-items: flex-start; gap: 8px; border-radius: 4px; cursor: pointer; line-height: 20px; }
    .select-option:hover { background: var(--bg-hover); }
    .select-option input { margin-top: 3px; accent-color: var(--primary); }
    .filter-check { margin: 12px 0 0 68px; display: flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 13px; }
    .filter-check input { accent-color: var(--primary); }
    .filter-footer { margin-top: 14px; padding-top: 12px; display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); }
    .map-stats { position: absolute; left: 16px; top: 16px; z-index: 900; display: flex; gap: 8px; }
    .stat-chip { min-width: 104px; padding: 8px 12px; border: 1px solid rgba(0,0,0,.08); border-radius: 6px; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .stat-label { color: var(--text-secondary); font-size: 12px; }
    .stat-value { margin-top: 2px; color: var(--text-primary); font: 600 20px/24px var(--font-number); }
    .legend { position: absolute; left: 16px; bottom: 20px; z-index: 900; padding: 10px 12px; border: 1px solid rgba(0,0,0,.08); border-radius: 6px; background: rgba(255,255,255,.94); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .legend-title { margin-bottom: 7px; color: var(--text-secondary); font-size: 12px; }
    .legend-line { display: flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 12px; }
    .legend-line + .legend-line { margin-top: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.parallel { background: var(--parallel); } .legend-dot.auto { background: var(--auto); } .legend-dot.manual { background: #8c8c8c; }
    .leaflet-control-zoom { margin-top: 76px !important; }
    .vehicle-marker { position: relative; width: 72px; text-align: center; transform: translate(-50%, -100%); cursor: pointer; }
    .vehicle-marker .marker-icon { width: 34px; height: 34px; margin: 0 auto 2px; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); color: #fff; font-size: 15px; box-shadow: 0 2px 7px rgba(0,0,0,.25); }
    .vehicle-marker .marker-icon span { transform: rotate(45deg); }
    .vehicle-marker.parallel .marker-icon { background: var(--parallel); } .vehicle-marker.auto .marker-icon { background: var(--auto); } .vehicle-marker.manual .marker-icon { background: #8c8c8c; }
    .vehicle-marker .marker-label { max-width: 88px; margin: 0 auto; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 3px; background: rgba(255,255,255,.92); color: var(--text-primary); font: 11px/16px var(--font-number); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .vehicle-marker.has-alert .marker-icon { animation: markerPulse 1.25s ease-in-out infinite; }
    .alert-badge { position: absolute; top: -3px; right: 12px; min-width: 17px; height: 17px; padding: 0 4px; border: 2px solid #fff; border-radius: 9px; background: var(--error); color: #fff; font: 11px/13px var(--font-number); }
    @keyframes markerPulse { 50% { box-shadow: 0 0 0 6px rgba(255,77,79,.2), 0 2px 7px rgba(0,0,0,.25); } }
    .city-cluster { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 4px solid rgba(22,119,255,.22); border-radius: 50%; background: rgba(22,119,255,.88); color: #fff; font: 600 17px/1 var(--font-number); box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
    .city-cluster small { display: block; margin-top: 2px; font: 11px/13px var(--font-family); }
    .modal-tabs { display: flex; height: 42px; border-bottom: 1px solid var(--border-color); }
    .modal-tab { min-width: 112px; padding: 0 16px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text-secondary); cursor: pointer; }
    .modal-tab.active { border-bottom-color: var(--primary); color: var(--primary); font-weight: 500; }
    .modal-pane { display: none; } .modal-pane.active { display: block; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 20px; padding: 18px 0 6px; }
    .metric-label { color: var(--text-secondary); font-size: 12px; } .metric-value { margin-top: 3px; color: var(--text-primary); font: 14px/20px var(--font-number); }
    .record-card { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: #fff; }
    .record-card + .record-card { margin-top: 8px; }
    .record-top { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; }
    .record-top strong { color: var(--text-primary); font-weight: 500; } .record-second { margin-top: 7px; color: var(--text-secondary); font-size: 12px; }
    .record-second b { color: var(--text-primary); font-weight: 400; }
    .issue-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }
    .issue-item { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius); background: #fff; color: var(--text-primary); text-align: left; cursor: pointer; }
    .issue-item:hover { border-color: #91caff; background: var(--primary-bg); }
    .issue-item + .issue-item { margin-top: 8px; }
    .issue-item-top { display: flex; align-items: center; gap: 7px; }
    .issue-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .issue-item-meta { margin-top: 5px; color: var(--text-secondary); font: 12px/18px var(--font-number); }
    .issue-empty { padding: 42px 16px; color: var(--text-disabled); text-align: center; }
    .modal-actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
    /* 车辆详情以快速查看为主，保持紧凑尺寸，避免遮挡地图上下文。 */
    .vehicle-detail-modal { width: 640px; max-width: min(640px, calc(100vw - 32px)); max-height: min(560px, calc(100vh - 48px)); }
    .vehicle-detail-modal .modal-header { min-height: 52px; padding: 14px 20px; }
    .vehicle-detail-modal .modal-header h3 { max-width: calc(100% - 40px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; line-height: 24px; }
    .vehicle-detail-modal .modal-tabs { height: 40px; padding: 0 20px; }
    .vehicle-detail-modal .modal-tab { min-width: 96px; padding: 0 12px; font-size: 13px; }
    .vehicle-detail-modal .modal-body { padding: 14px 20px 16px; }
    .vehicle-detail-modal .modal-footer { padding: 10px 20px; }
    .vehicle-detail-modal .metric-grid { gap: 12px 24px; padding: 2px 0 0; }
    .vehicle-detail-modal .metric-value { font-size: 13px; }
    @media (max-width: 760px) {
      .vehicle-detail-modal { max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); }
      .vehicle-detail-modal .modal-header { padding-left: 16px; padding-right: 16px; }
      .vehicle-detail-modal .modal-tabs { padding: 0 16px; }
      .vehicle-detail-modal .modal-body { padding-left: 16px; padding-right: 16px; }
      .vehicle-detail-modal .modal-footer { padding-left: 16px; padding-right: 16px; }
      .vehicle-detail-modal .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
    }
    /* 轨迹回放直接叠加在原地图窗口内，不改变页面导航和数据面板。 */
    .track-playback { position: absolute; inset: 0; z-index: 700; pointer-events: none; }
    .track-playback[hidden] { display: none; }
    .track-playback > * { pointer-events: auto; }
    .map-wrap.track-active .map-stats,
    .map-wrap.track-active .map-toolbar,
    .map-wrap.track-active > .legend { display: none; }
    .track-map-tools { position: absolute; top: 12px; right: 12px; z-index: 700; display: grid; gap: 8px; }
    .track-map-tool { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,.12); border-radius: 6px; background: rgba(255,255,255,.96); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,.12); cursor: pointer; }
    .track-map-tool:hover, .track-map-tool.active { color: var(--primary); border-color: #91caff; background: #e6f4ff; }
    .track-map-tool svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .track-legend { position: absolute; left: 12px; bottom: 116px; z-index: 700; width: 164px; padding: 10px 12px; border: 1px solid rgba(0,0,0,.08); border-radius: 6px; background: rgba(255,255,255,.94); box-shadow: 0 2px 8px rgba(0,0,0,.10); }
    .track-legend[hidden] { display: none; }
    .track-legend-title { margin-bottom: 7px; color: var(--text-primary); font-size: 12px; font-weight: 600; }
    .track-legend-item { min-height: 22px; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; }
    .track-legend-dot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; }
    .track-legend-line { width: 18px; height: 0; flex: 0 0 auto; border-top: 3px solid var(--primary); }
    .track-legend-line.dashed { border-top-style: dashed; border-top-color: #fa8c16; }
    .track-console { position: absolute; right: 12px; bottom: 12px; left: 12px; z-index: 700; min-height: 92px; padding: 10px 12px; border: 1px solid rgba(0,0,0,.10); border-radius: 8px; background: rgba(255,255,255,.97); box-shadow: 0 4px 18px rgba(0,0,0,.14); }
    .track-query-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .track-filter-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .track-filter-label { flex: 0 0 auto; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
    .track-control { height: 32px; padding: 0 9px; border: 1px solid var(--border-input); border-radius: 6px; outline: 0; background: #fff; color: var(--text-primary); font: 12px/30px var(--font-number); }
    .track-control:hover, .track-control:focus { border-color: var(--primary); }
    .track-control[type="date"] { width: 120px; }
    .track-control[type="time"] { width: 100px; }
    .track-vehicle-select { width: 144px; font-family: var(--font-family); }
    .track-time-separator { color: var(--text-disabled); }
    .track-status { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
    .track-status strong { color: var(--text-primary); font: 600 14px/22px var(--font-number); }
    .track-status .speed { color: var(--primary); }
    .track-status .mode { color: #52c41a; }
    .track-console-close { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--text-disabled); font-size: 20px; cursor: pointer; }
    .track-console-close:hover { color: var(--text-primary); background: var(--bg-hover); }
    .track-playback-row { margin-top: 8px; display: grid; grid-template-columns: 80px 58px minmax(180px, 1fr); align-items: center; gap: 8px; }
    .track-play-button { min-width: 80px; }
    .track-rate { width: 58px; padding-right: 4px; }
    .track-timeline { min-width: 0; display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; align-items: center; gap: 8px; color: var(--text-disabled); font: 12px/18px var(--font-number); }
    .track-range { --track-percent: 0%; width: 100%; height: 4px; margin: 0; appearance: none; border-radius: 2px; outline: 0; background: linear-gradient(to right, var(--primary) 0 var(--track-percent), #e5e6eb var(--track-percent) 100%); cursor: pointer; }
    .track-range::-webkit-slider-thumb { width: 16px; height: 16px; appearance: none; border: 3px solid var(--primary); border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(22,119,255,.28); }
    .track-range::-moz-range-thumb { width: 12px; height: 12px; border: 3px solid var(--primary); border-radius: 50%; background: #fff; }
    .track-vehicle-marker { position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; border-radius: 50%; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.28); }
    .track-vehicle-marker::after { content: ""; position: absolute; right: 1px; bottom: -5px; width: 10px; height: 10px; transform: rotate(45deg); border-right: 3px solid #fff; border-bottom: 3px solid #fff; background: var(--primary); }
    .track-vehicle-label { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.96); color: var(--text-primary); font: 11px/16px var(--font-number); white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.16); }
    .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } .video-tile { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #162436; color: #a9c7e8; font-size: 12px; }
    .empty-list { padding: 38px 16px; color: var(--text-disabled); text-align: center; }
    @media (max-width: 1100px) { .vehicle-drawer { width: 320px; min-width: 320px; } .drawer-toggle { left: 304px; } .stat-chip { min-width: 88px; } }
    @media (max-width: 1366px) {
      .track-query-row { flex-wrap: wrap; }
      .track-status { order: 2; flex: 1 0 calc(100% - 48px); margin-left: 0; }
      .track-console { min-height: 126px; }
      .track-legend { bottom: 150px; }
    }
    @media (max-width: 980px) {
      .track-console { overflow-x: auto; }
      .track-query-row { min-width: 740px; }
