<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆运行数据 - 车辆管理系统</title>
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/fixed-table.css">
    <link rel="stylesheet" href="../components/master-list.css">
    <link rel="icon" href="data:,">
    <!--
      页面用途：查询车辆网联终端上报的运行数据。
      核心功能：可展开的车辆筛选、项目/车型分组、分组折叠、选车联动、采集时间查询、分页选择与导出。
      交互逻辑：车辆筛选默认仅显示车架号；默认按项目分组、仅展开首个分组并选中车架号排序最前车辆；未选择记录时导出当前查询结果需二次确认。
    -->
    <style>
        .running-content { display: flex; min-height: 0; overflow: hidden; }
        .running-shell {
            display: grid; grid-template-columns: 304px minmax(0, 1fr); min-width: 0;
            height: 100%; min-height: 560px; padding: 0; overflow: hidden;
        }
        .detail-filter input {
            width: 100%; height: 32px; min-width: 0; padding: 0 10px; border: 1px solid var(--border-input);
            border-radius: var(--radius); outline: none; color: var(--text-primary); background: #fff;
        }
        .detail-filter input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
        .detail-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        .detail-filter {
            min-height: 65px; padding: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-filter label { color: var(--text-secondary); white-space: nowrap; }
        .detail-filter input { width: 176px; }
        .date-separator { color: var(--text-disabled); }
        .detail-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .selection-hint { color: var(--text-secondary); font-size: 12px; }
        .selection-hint strong { color: var(--primary); }
        .table-zone { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 14px; }
        .running-table { flex: 1; min-height: 0; overflow: auto; }
        .running-table table { table-layout: fixed; }
        .running-table thead { position: sticky; top: 0; z-index: 4; }
        #runtimeTable th, #runtimeTable td { white-space: nowrap; text-align: center; }
        .running-table tbody tr { cursor: default; }
        .running-table .mode-cell { color: var(--text-primary); }
        .status-online { color: var(--success); }
        .status-offline { color: var(--text-disabled); }
        .status-online::before, .status-offline::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
        .pagination-host { flex: 0 0 auto; }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        @media (max-width: 1440px) {
            .running-shell { grid-template-columns: 280px minmax(0, 1fr); }
            .detail-filter { padding: 12px 16px; }
        }
        @media (max-width: 1120px) {
            .running-shell { grid-template-columns: 260px minmax(0, 1fr); }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <main class="content running-content">
            <section class="page-container running-shell" aria-label="车辆运行数据">
                <aside class="master-panel" aria-label="车辆列表">
                    <div class="master-heading">
                        <h2 class="panel-title">车辆列表</h2>
                        <span class="panel-total" id="panelTotal">共 0 辆</span>
                    </div>
                    <div class="master-filter" id="masterFilter">
                        <div class="compact-field"><label for="filterVin">车架号</label><input id="filterVin" type="text" placeholder="请输入车架号"></div>
                        <div class="master-filter-extra" id="masterFilterExtra">
                            <div class="compact-field"><label for="filterPlate">车牌号</label><input id="filterPlate" type="text" placeholder="请输入车牌号"></div>
                            <div class="compact-field"><label for="filterModel">车型名称</label><input id="filterModel" type="text" placeholder="请输入车型名称"></div>
                            <div class="compact-field"><label for="filterProject">项目</label>
                                <select id="filterProject">
                                    <option value="">全部项目</option>
                                    <option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option>
                                    <option>镜湖区项目</option><option>鸠江江北项目</option><option>鸠江开发区项目</option>
                                    <option>鸠江项目</option><option>陵水项目</option>
                                </select>
                            </div>
                        </div>
                        <div class="compact-actions">
                            <button class="master-filter-toggle" id="masterFilterToggle" type="button" aria-expanded="false" aria-controls="masterFilterExtra" onclick="toggleVehicleFilter()">
                                <span id="masterFilterToggleText">展开更多</span><span class="master-filter-chevron" aria-hidden="true">⌄</span>
                            </button>
                            <div class="compact-action-buttons">
                                <button class="btn" type="button" onclick="resetVehicleFilter()">重置</button>
                                <button class="btn btn-primary" type="button" onclick="queryVehicles()">查询</button>
                            </div>
                        </div>
                    </div>
                    <div class="group-toolbar">
                        <div class="segmented" role="group" aria-label="车辆分组方式">
                            <button class="segment-btn active" id="groupProject" type="button" onclick="changeGroupMode('project')">按项目</button>
                            <button class="segment-btn" id="groupModel" type="button" onclick="changeGroupMode('model')">按车型</button>
                        </div>
                        <span class="list-result" id="groupCount">0 个分组</span>
                    </div>
                    <div class="group-list" id="vehicleGroups"></div>
                </aside>

                <section class="detail-panel" aria-label="运行数据明细">
                    <div class="detail-filter">
                        <label for="timeStart">数据采集时间</label>
                        <input id="timeStart" type="datetime-local" step="1">
                        <span class="date-separator">至</span>
                        <input id="timeEnd" type="datetime-local" step="1">
                        <button class="btn btn-primary" type="button" onclick="queryTelemetry()">查询</button>
                        <button class="btn" type="button" onclick="resetTelemetryFilter()">重置</button>
                        <div class="detail-actions">
                            <span class="selection-hint" id="selectionHint"></span>
                            <button class="btn" type="button" onclick="doExport()">导出</button>
                        </div>
                    </div>
                    <div class="table-zone">
                        <div class="table-wrapper fixed-table running-table" data-fixed-first="1" data-fixed-min-width="1990px">
                            <table id="runtimeTable">
                                <colgroup>
                                    <col style="width:50px"><col style="width:190px"><col style="width:140px"><col style="width:108px"><col style="width:108px"><col style="width:110px"><col style="width:100px"><col style="width:100px"><col style="width:100px"><col style="width:112px"><col style="width:90px"><col style="width:150px"><col style="width:100px"><col style="width:120px"><col style="width:130px"><col style="width:174px">
                                </colgroup>
                                <thead><tr>
                                    <th><input type="checkbox" id="checkAll" aria-label="全选当前页" onchange="toggleCheckAll(this)"></th>
                                    <th>车架号</th>
                                    <th>所属项目</th>
                                    <th>经度</th>
                                    <th>纬度</th>
                                    <th>驾驶状态</th>
                                    <th>信号强度</th>
                                    <th>运行状态</th>
                                    <th>补给状态</th>
                                    <th>车辆速度(km/h)</th>
                                    <th>档位</th>
                                    <th>物联网终端在线状态</th>
                                    <th>SOC(%)</th>
                                    <th>剩余水量(%)</th>
                                    <th>垃圾箱状态(%)</th>
                                    <th>数据采集时间</th>
                                </tr></thead>
                                <tbody id="telemetryBody"></tbody>
                            </table>
                        </div>
                        <div class="pagination-host" id="runtimePagination"></div>
                    </div>
                </section>
            </section>
        </main>
    </div>
</div>

<script src="../components/common.js"></script>
<script src="../components/pagination-component.js"></script>
<script src="../components/filter-component.js"></script>
<script src="../components/export-component.js"></script>
<script src="../components/fixed-table.js"></script>
<script src="../components/master-list.js"></script>
<script src="../components/vehicle-monitor-data.js"></script>
<script>
Common.initLayout({
    basePath: '../', sidebarId: 'sidebar', activeMenuId: 'vehicle-runtime', headerId: 'header',
    headerOptions: { showProject: false }
});

const sharedVehicle = (window.VehicleMonitorData && window.VehicleMonitorData.snapshot) || {};
const vehicles = [
    { id: 1, vin: sharedVehicle.vin || 'LSVAU2A39EN000001', plate: sharedVehicle.plate || '京ADG090', iot: sharedVehicle.network || '14156', model: sharedVehicle.model || '麒麟清扫车', project: sharedVehicle.project || '鸠江项目', online: sharedVehicle.online !== false },
    { id: 2, vin: 'LSVAU2A39EN000002', plate: '浙JDB1062', iot: '11527', model: '爱瑞特纯电动高压冲洗车', project: '椒北街道', online: true },
    { id: 3, vin: 'LSVAU2A39EN000003', plate: '皖B·A5106', iot: '14158', model: '中联清洗车', project: '镜湖区项目', online: false },
    { id: 4, vin: 'LSVAU2A39EN000004', plate: '皖B·A7321', iot: '11530', model: '泰坦智能驾驶洒水车', project: '经开东区项目', online: true },
    { id: 5, vin: 'LSVAU2A39EN000005', plate: '皖B·A8632', iot: '14159', model: '三力洒水车', project: '鸠江江北项目', online: true },
    { id: 6, vin: 'LSVAU2A39EN000006', plate: '沪A·D1029', iot: '11532', model: '独角兽', project: '嘉定研发', online: true },
    { id: 7, vin: 'LSVAU2A39EN000007', plate: '皖B·A3055', iot: '14160', model: '麒麟无人化扫地车', project: '鸠江开发区项目', online: false },
    { id: 8, vin: 'LSVAU2A39EN000008', plate: '琼A·B2056', iot: '11535', model: '长城多用途货车', project: '陵水项目', online: true },
    { id: 9, vin: 'LSVAU2A39EN000009', plate: '皖B·A2077', iot: '14161', model: '麒麟清扫车', project: '鸠江项目', online: true },
    { id: 10, vin: 'LSVAU2A39EN000010', plate: '临牌-010', iot: '11538', model: '爱瑞特纯电动高压冲洗车', project: '', online: false }
];

const runningStates = ['作业', '作业', '转场', '停靠', '运维', '停靠', '关机'];
const supplyStates = ['未补给', '未补给', '未补给', '充电', '未补给', '加水', '未补给'];
const percent = VehicleMonitorData.formatPercent;
const drivingModes = ['自动驾驶', '自动驾驶', '人工驾驶', '远程驾驶'];
const telemetry = [];
vehicles.forEach((vehicle, vehicleIndex) => {
    for (let i = 0; i < 26; i += 1) {
        const minute = vehicleIndex === 0 ? 32 - i * 2 : 58 - i * 2;
        const hour = minute >= 0 ? 14 : 13;
        const normalizedMinute = minute >= 0 ? minute : minute + 60;
        const timestamp = `2026-09-15 ${String(hour).padStart(2, '0')}:${String(normalizedMinute).padStart(2, '0')}:${String((vehicleIndex * 7 + i * 3) % 60).padStart(2, '0')}`;
        const runningState = runningStates[(i + vehicleIndex) % runningStates.length];
        const moving = runningState === '作业' || runningState === '转场';
        const shared = vehicleIndex === 0 && i === 0;
        telemetry.push({
            id: `${vehicle.id}-${i}`, vehicleId: vehicle.id, vin: vehicle.vin, project: vehicle.project || '无分组',
            longitude: (vehicleIndex === 0 ? sharedVehicle.lng + i * .00011 : 118.365421 + vehicleIndex * .0132 + i * .00011).toFixed(6),
            latitude: (vehicleIndex === 0 ? sharedVehicle.lat + i * .00008 : 31.326482 + vehicleIndex * .0087 + i * .00008).toFixed(6),
            drivingMode: vehicleIndex === 0 && i === 0 ? sharedVehicle.modeText : drivingModes[(i + vehicleIndex) % drivingModes.length],
            speed: vehicleIndex === 0 && i === 0 ? Number(sharedVehicle.speed).toFixed(1) : moving ? (18 + ((i * 7 + vehicleIndex) % 28)).toFixed(1) : '0.0',
            gear: vehicleIndex === 0 && i === 0 ? sharedVehicle.gear : moving ? (i % 5 === 0 ? 'R' : 'D') : 'N', online: vehicle.online,
            soc: vehicleIndex === 0 && i === 0 ? Number(sharedVehicle.soc).toFixed(1) : Math.max(18, 91 - i - vehicleIndex).toFixed(1),
            signalStrength: shared ? sharedVehicle.signalStrength : ['强', '中', '弱'][(i + vehicleIndex) % 3],
            runningState: shared ? sharedVehicle.runningState : runningState,
            supplyState: shared ? sharedVehicle.supplyState : supplyStates[(i + vehicleIndex) % supplyStates.length],
            water: shared ? sharedVehicle.water : Math.max(0, 80 - i * 2 - vehicleIndex),
            bin: shared ? sharedVehicle.bin : [0, 5, 6, 8].includes(vehicleIndex) ? Math.min(100, 20 + i * 2) : null,
            collectedAt: shared ? sharedVehicle.time : timestamp
        });
    }
});

let filteredVehicles = [...vehicles];
let groupMode = 'project';
let selectedVehicleId = null;
let filteredTelemetry = [];
let selectedRows = new Set();
let currentPage = 1;
let pageSize = 10;

const pager = new Pagination({
    container: 'runtimePagination', pageSize: 10, pageSizeOptions: [10, 20, 50, 100],
    onPageChange: function(page, size) { currentPage = page; pageSize = size; renderTelemetry(); }
});

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}

// 左侧车辆主从列表：统一由公共组件管理分组、折叠、默认展开首组与选中态
const vehicleList = MasterList.init({
    container: '#vehicleGroups',
    totalEl: '#panelTotal',
    countEl: '#groupCount',
    totalText: count => `共 ${count} 辆`,
    items: () => filteredVehicles,
    getId: vehicle => vehicle.id,
    groupModes: [
        { key: 'project', label: '按项目', of: vehicle => vehicle.project },
        { key: 'model', label: '按车型', of: vehicle => vehicle.model }
    ],
    defaultMode: 'project',
    sortItems: (a, b) => a.vin.localeCompare(b.vin),
    isActive: vehicle => vehicle.id === selectedVehicleId,
    activeGroupKey: () => {
        const selected = filteredVehicles.find(vehicle => vehicle.id === selectedVehicleId);
        if (!selected) return null;
        return (groupMode === 'project' ? selected.project : selected.model) || '无分组';
    },
    renderCard: vehicle => ({
        primary: [vehicle.plate, vehicle.iot].map(value => String(value ?? '').trim()).filter(Boolean).join('-'),
        dot: vehicle.online ? 'is-success' : 'is-muted',
        dotTitle: vehicle.online ? '终端在线' : '终端离线',
        meta: String(vehicle.vin ?? '').trim(),
        metaClass: 'num'
    }),
    empty: { title: '暂无匹配车辆', desc: '请调整筛选条件后重试' },
    onSelect: vehicle => selectVehicle(vehicle.id)
});

function toggleVehicleFilter() {
    const filter = document.getElementById('masterFilter');
    const toggle = document.getElementById('masterFilterToggle');
    const expanded = !filter.classList.contains('is-expanded');
    filter.classList.toggle('is-expanded', expanded);
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    document.getElementById('masterFilterToggleText').textContent = expanded ? '收起' : '展开更多';
}

function queryVehicles() {
    const vin = document.getElementById('filterVin').value.trim().toLowerCase();
    const plate = document.getElementById('filterPlate').value.trim().toLowerCase();
    const model = document.getElementById('filterModel').value.trim().toLowerCase();
    const project = document.getElementById('filterProject').value;
    filteredVehicles = vehicles.filter(item =>
        (!vin || item.vin.toLowerCase().includes(vin)) &&
        (!plate || item.plate.toLowerCase().includes(plate)) &&
        (!model || item.model.toLowerCase().includes(model)) &&
        (!project || item.project === project)
    );
    ensureSelectedVehicle();
    renderVehicleGroups(true);
}

function resetVehicleFilter() {
    ['filterVin', 'filterPlate', 'filterModel'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('filterProject').value = '';
    filteredVehicles = [...vehicles];
    ensureSelectedVehicle();
    renderVehicleGroups(true);
}

function ensureSelectedVehicle() {
    if (!filteredVehicles.some(item => item.id === selectedVehicleId)) {
        selectedVehicleId = filteredVehicles.length
            ? [...filteredVehicles].sort((a, b) => a.vin.localeCompare(b.vin))[0].id
            : null;
        resetTelemetryState();
    }
}

function changeGroupMode(mode) {
    groupMode = mode;
    document.getElementById('groupProject').classList.toggle('active', mode === 'project');
    document.getElementById('groupModel').classList.toggle('active', mode === 'model');
    vehicleList.setMode(mode);
    renderTelemetry();
}

function selectVehicle(id) {
    if (selectedVehicleId === id) return;
    selectedVehicleId = id;
    resetTelemetryFilter(false);
    renderVehicleGroups();
}

function renderVehicleGroups(resetCollapse) {
    if (resetCollapse) vehicleList.reset(); else vehicleList.render();
    renderTelemetry();
}

function toComparable(value) { return value ? value.replace('T', ' ') : ''; }

function getVehicleTelemetry() {
    const start = toComparable(document.getElementById('timeStart').value);
    const end = toComparable(document.getElementById('timeEnd').value);
    return telemetry.filter(item => item.vehicleId === selectedVehicleId && (!start || item.collectedAt >= start) && (!end || item.collectedAt <= end))
        .sort((a, b) => b.collectedAt.localeCompare(a.collectedAt));
}

function queryTelemetry() {
    const start = toComparable(document.getElementById('timeStart').value);
    const end = toComparable(document.getElementById('timeEnd').value);
    if (start && end && start > end) {
        Common.showToast('开始时间不能晚于结束时间', 'warning');
        return;
    }
    selectedRows.clear();
    currentPage = 1;
    filteredTelemetry = getVehicleTelemetry();
    pager.reset();
}

function resetTelemetryState() {
    selectedRows.clear(); currentPage = 1;
    filteredTelemetry = selectedVehicleId ? getVehicleTelemetry() : [];
    pager.reset();
}

function resetTelemetryFilter(renderGroups = true) {
    document.getElementById('timeStart').value = '';
    document.getElementById('timeEnd').value = '';
    resetTelemetryState();
    if (renderGroups) renderVehicleGroups(); else renderTelemetry();
}

function getCurrentPageData() {
    const start = (currentPage - 1) * pageSize;
    return filteredTelemetry.slice(start, start + pageSize);
}

function renderTelemetry() {
    filteredTelemetry = selectedVehicleId ? getVehicleTelemetry() : [];
    const maxPage = Math.max(1, Math.ceil(filteredTelemetry.length / pageSize));
    if (currentPage > maxPage) currentPage = maxPage;
    const rows = getCurrentPageData();
    const tbody = document.getElementById('telemetryBody');
    tbody.innerHTML = rows.length ? rows.map(item => `<tr class="${selectedRows.has(item.id) ? 'selected' : ''}">
        <td class="col-center"><input type="checkbox" aria-label="选择 ${item.collectedAt}" ${selectedRows.has(item.id) ? 'checked' : ''} onchange="toggleRow('${item.id}', this)"></td>
        <td class="col-center num">${item.vin}</td><td title="${escapeHtml(item.project)}">${escapeHtml(item.project)}</td>
        <td class="col-right num">${item.longitude}</td><td class="col-right num">${item.latitude}</td>
        <td><span class="tag ${drivingStateClass(item.drivingMode)}">${item.drivingMode}</span></td><td>${item.signalStrength || '—'}</td>
        <td><span class="tag ${runningStateClass(item.runningState)}">${item.runningState}</span></td><td><span class="tag ${supplyStateClass(item.supplyState)}">${item.supplyState}</span></td>
        <td class="num">${item.speed}</td><td>${item.gear}</td>
        <td class="${item.online ? 'status-online' : 'status-offline'}">${item.online ? '在线' : '离线'}</td>
        <td class="num">${percent(item.soc)}</td><td class="num">${percent(item.water)}</td><td class="num">${percent(item.bin)}</td>
        <td class="num">${item.collectedAt}</td>
    </tr>`).join('') : '<tr><td colspan="16"><div class="empty-state"><strong>暂无运行数据</strong>请调整采集时间或选择其他车辆</div></td></tr>';
    pager.setTotal(filteredTelemetry.length);
    updateSelectionState();
    if (window.FixedTable) FixedTable.refresh(document.querySelector('.running-table'));
}

function drivingStateClass(state) {
    return ({ '自动驾驶': 'tag-blue', '远程驾驶': 'tag-green', '人工驾驶': 'tag-default' })[state] || 'tag-default';
}

function supplyStateClass(state) {
    return ({ '未补给': 'tag-default', '充电': 'tag-blue', '加水': 'tag-green', '换电': 'tag-purple' })[state] || 'tag-default';
}

function runningStateClass(state) {
    return ({ '作业': 'tag-green', '转场': 'tag-purple', '停靠': 'tag-orange', '运维': 'tag-blue', '关机': 'tag-default' })[state] || 'tag-default';
}

function toggleRow(id, checkbox) {
    checkbox.checked ? selectedRows.add(id) : selectedRows.delete(id);
    renderTelemetry();
}

function toggleCheckAll(checkbox) {
    getCurrentPageData().forEach(item => checkbox.checked ? selectedRows.add(item.id) : selectedRows.delete(item.id));
    renderTelemetry();
}

function updateSelectionState() {
    const pageData = getCurrentPageData();
    const selectedOnPage = pageData.filter(item => selectedRows.has(item.id)).length;
    const all = pageData.length > 0 && selectedOnPage === pageData.length;
    const checkAll = document.getElementById('checkAll');
    checkAll.checked = all;
    checkAll.indeterminate = selectedOnPage > 0 && !all;
    document.getElementById('selectionHint').innerHTML = selectedRows.size ? `已选 <strong>${selectedRows.size}</strong> 条` : '';
}

const exportHeaders = ["车架号","所属项目","经度","纬度","驾驶状态","信号强度","运行状态","补给状态","车辆速度(km/h)","档位","物联网终端在线状态","SOC(%)","剩余水量(%)","垃圾箱状态(%)","数据采集时间"];
function toExportRow(item) {
    return [item.vin, item.project, item.longitude, item.latitude, item.drivingMode, item.signalStrength || '—', item.runningState, item.supplyState, item.speed, item.gear, item.online ? '在线' : '离线', percent(item.soc), percent(item.water), percent(item.bin), item.collectedAt];
}

function exportRows(rows) {
    const vehicle = vehicles.find(item => item.id === selectedVehicleId);
    exportCSV({ filename: `车辆运行数据_${vehicle ? vehicle.plate.replace('·', '') : '未选择'}.csv`, headers: exportHeaders, rows: rows.map(toExportRow) });
    Common.showToast(`已导出 ${rows.length} 条运行数据`, 'success');
}
function doExport() {
    ListExport.run({ rows: filteredTelemetry, selectedIds: selectedRows, currentPage, pageSize, onExport: exportRows });
}

['filterVin', 'filterPlate', 'filterModel'].forEach(id => document.getElementById(id).addEventListener('keydown', event => { if (event.key === 'Enter') queryVehicles(); }));
ensureSelectedVehicle();
const initialQuery = new URLSearchParams(window.location.search);
const initialVehicleKey = initialQuery.get('vehicleId') || initialQuery.get('vin') || initialQuery.get('plateNo') || initialQuery.get('iotCode');
const initialVehicle = initialVehicleKey && vehicles.find(item => [item.vin, item.plate, item.iot, String(item.id)].includes(initialVehicleKey));
if (initialVehicle) selectedVehicleId = initialVehicle.id;
renderVehicleGroups();
if (initialVehicle) renderTelemetry();
</script>
</body>
</html>
