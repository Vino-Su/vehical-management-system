<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆运行数据 - 车辆管理系统</title>
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/fixed-table.css">
    <link rel="icon" href="data:,">
    <!--
      页面用途：查询车辆网联终端上报的运行数据。
      核心功能：可展开的车辆筛选、项目/车型分组、分组折叠、选车联动、采集时间查询、分页选择与导出。
      交互逻辑：车辆筛选默认仅显示 VIN 码；默认按项目分组、仅展开首个分组并选中 VIN 排序最前车辆；未选择记录时导出当前查询结果需二次确认。
    -->
    <style>
        .running-content { display: flex; min-height: 0; overflow: hidden; }
        .running-shell {
            display: grid; grid-template-columns: 304px minmax(0, 1fr); min-width: 0;
            height: 100%; min-height: 560px; padding: 0; overflow: hidden;
        }
        .vehicle-panel {
            min-width: 0; display: flex; flex-direction: column; overflow: hidden;
            border-right: 1px solid var(--border-color); background: #fff;
        }
        .panel-heading {
            height: 54px; min-height: 54px; padding: 0 16px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border-color);
        }
        .panel-heading h2, .detail-title { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0; }
        .vehicle-total { font-size: 12px; color: var(--text-secondary); }
        .vehicle-filter { padding: 16px; border-bottom: 1px solid var(--border-color); }
        .compact-field { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .compact-field label { flex: 0 0 56px; color: var(--text-secondary); font-size: 13px; white-space: nowrap; }
        .compact-field input, .compact-field select, .detail-filter input {
            width: 100%; height: 32px; min-width: 0; padding: 0 10px; border: 1px solid var(--border-input);
            border-radius: var(--radius); outline: none; color: var(--text-primary); background: #fff;
        }
        .compact-field input:focus, .compact-field select:focus, .detail-filter input:focus {
            border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1);
        }
        .vehicle-filter-extra { display: none; }
        .vehicle-filter.is-expanded .vehicle-filter-extra { display: block; }
        .compact-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .compact-action-buttons { display: flex; align-items: center; gap: 8px; }
        .vehicle-filter-toggle {
            height: 32px; padding: 0; display: inline-flex; align-items: center; gap: 4px;
            border: 0; background: transparent; color: var(--primary); font-size: 13px; cursor: pointer;
        }
        .vehicle-filter-toggle:hover { color: var(--primary-hover); }
        .vehicle-filter-chevron { font-size: 11px; transition: transform .2s; }
        .vehicle-filter.is-expanded .vehicle-filter-chevron { transform: rotate(180deg); }
        .group-toolbar {
            min-height: 50px; padding: 9px 16px; display: flex; align-items: center;
            justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border-color);
        }
        .segmented { display: inline-flex; padding: 2px; border-radius: var(--radius); background: var(--bg-layout); }
        .segment-btn {
            height: 28px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent;
            color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all .2s;
        }
        .segment-btn:hover { color: var(--primary); }
        .segment-btn.active { color: var(--primary); background: #fff; box-shadow: var(--shadow-sm); font-weight: 500; }
        .list-result { font-size: 12px; color: var(--text-disabled); white-space: nowrap; }
        .group-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
        .vehicle-group + .vehicle-group { margin-top: 4px; }
        .group-header {
            width: 100%; min-height: 36px; padding: 6px 8px; display: flex; align-items: center; gap: 7px;
            border: 0; border-radius: var(--radius); background: transparent; color: var(--text-primary);
            text-align: left; cursor: pointer;
        }
        .group-header:hover { background: #fafafa; }
        .group-chevron { width: 16px; color: var(--text-secondary); font-size: 11px; transition: transform .2s; }
        .vehicle-group.collapsed .group-chevron { transform: rotate(-90deg); }
        .group-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .group-count { min-width: 24px; padding: 0 7px; border-radius: 10px; background: #f2f3f5; color: var(--text-secondary); font-size: 12px; text-align: center; }
        .vehicle-group.collapsed .group-items { display: none; }
        .vehicle-card {
            width: 100%; min-height: 68px; margin: 3px 0; padding: 9px 10px 9px 31px; position: relative;
            border: 1px solid transparent; border-radius: var(--radius); background: #fff; text-align: left;
            cursor: pointer; transition: border-color .2s, background .2s;
        }
        .vehicle-card:hover { background: #fafafa; }
        .vehicle-card.active { border-color: #91caff; background: var(--primary-bg); }
        .vehicle-card.active::before {
            content: ""; position: absolute; left: 20px; top: 14px; bottom: 14px; width: 3px;
            border-radius: 2px; background: var(--primary);
        }
        .vehicle-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .vehicle-plate { overflow: hidden; color: var(--text-primary); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
        .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px #f6ffed; }
        .online-dot.offline { background: #bfbfbf; box-shadow: 0 0 0 3px #f5f5f5; }
        .vehicle-vin { margin-top: 3px; color: var(--text-secondary); font: 12px/18px var(--font-number); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vehicle-model { margin-top: 2px; color: var(--text-disabled); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .empty-state { padding: 48px 16px; color: var(--text-disabled); text-align: center; }
        .empty-state strong { display: block; margin-bottom: 4px; color: var(--text-secondary); font-weight: 500; }

        .detail-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        .detail-head {
            min-height: 54px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
            gap: 12px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .selected-summary { display: flex; min-width: 0; align-items: center; gap: 12px; }
        .summary-divider { width: 1px; height: 18px; background: var(--border-color); }
        .summary-meta { color: var(--text-secondary); font: 12px/18px var(--font-number); white-space: nowrap; }
        .summary-project { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
        .detail-filter {
            min-height: 65px; padding: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-filter label { color: var(--text-secondary); white-space: nowrap; }
        .detail-filter input { width: 176px; }
        .date-separator { color: var(--text-disabled); }
        .detail-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .selection-hint { color: var(--text-secondary); font-size: 12px; }
        .selection-hint strong { color: var(--primary); }
        .table-zone { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 14px; }
        .running-table { flex: 1; min-height: 0; overflow: auto; }
        .running-table table { table-layout: fixed; }
        .running-table thead { position: sticky; top: 0; z-index: 4; }
        .running-table th, .running-table td { white-space: nowrap; }
        .running-table tbody tr { cursor: default; }
        .running-table .mode-cell { color: var(--text-primary); }
        .status-online { color: var(--success); }
        .status-offline { color: var(--text-disabled); }
        .status-online::before, .status-offline::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
        .pagination-host { flex: 0 0 auto; }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        @media (max-width: 1440px) {
            .running-shell { grid-template-columns: 280px minmax(0, 1fr); }
            .vehicle-filter { padding: 12px; }
            .detail-filter { padding: 12px 16px; }
        }
        @media (max-width: 1120px) {
            .running-shell { grid-template-columns: 260px minmax(0, 1fr); }
            .summary-project, .summary-divider { display: none; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <main class="content running-content">
            <section class="page-container running-shell" aria-label="车辆运行数据">
                <aside class="vehicle-panel" aria-label="车辆列表">
                    <div class="panel-heading">
                        <h2>车辆列表</h2>
                        <span class="vehicle-total" id="vehicleTotal">共 0 辆</span>
                    </div>
                    <div class="vehicle-filter" id="vehicleFilter">
                        <div class="compact-field"><label for="filterVin">VIN 码</label><input id="filterVin" type="text" placeholder="请输入 VIN 码"></div>
                        <div class="vehicle-filter-extra" id="vehicleFilterExtra">
                            <div class="compact-field"><label for="filterPlate">车牌号</label><input id="filterPlate" type="text" placeholder="请输入车牌号"></div>
                            <div class="compact-field"><label for="filterModel">车型名称</label><input id="filterModel" type="text" placeholder="请输入车型名称"></div>
                            <div class="compact-field"><label for="filterProject">项目</label>
                                <select id="filterProject">
                                    <option value="">全部项目</option>
                                    <option>嘉定研发</option><option>椒北街道</option><option>经开东区项目</option>
                                    <option>镜湖区项目</option><option>鸠江江北项目</option><option>鸠江开发区项目</option>
                                    <option>鸠江项目</option><option>陵水项目</option>
                                </select>
                            </div>
                        </div>
                        <div class="compact-actions">
                            <button class="vehicle-filter-toggle" id="vehicleFilterToggle" type="button" aria-expanded="false" aria-controls="vehicleFilterExtra" onclick="toggleVehicleFilter()">
                                <span id="vehicleFilterToggleText">展开更多</span><span class="vehicle-filter-chevron" aria-hidden="true">⌄</span>
                            </button>
                            <div class="compact-action-buttons">
                                <button class="btn" type="button" onclick="resetVehicleFilter()">重置</button>
                                <button class="btn btn-primary" type="button" onclick="queryVehicles()">查询</button>
                            </div>
                        </div>
                    </div>
                    <div class="group-toolbar">
                        <div class="segmented" role="group" aria-label="车辆分组方式">
                            <button class="segment-btn active" id="groupProject" type="button" onclick="changeGroupMode('project')">按项目</button>
                            <button class="segment-btn" id="groupModel" type="button" onclick="changeGroupMode('model')">按车型</button>
                        </div>
                        <span class="list-result" id="groupCount">0 个分组</span>
                    </div>
                    <div class="group-list" id="vehicleGroups"></div>
                </aside>

                <section class="detail-panel" aria-label="运行数据明细">
                    <div class="detail-head">
                        <div class="selected-summary" id="selectedSummary"></div>
                    </div>
                    <div class="detail-filter">
                        <label for="timeStart">数据采集时间</label>
                        <input id="timeStart" type="datetime-local" step="1">
                        <span class="date-separator">至</span>
                        <input id="timeEnd" type="datetime-local" step="1">
                        <button class="btn btn-primary" type="button" onclick="queryTelemetry()">查询</button>
                        <button class="btn" type="button" onclick="resetTelemetryFilter()">重置</button>
                        <div class="detail-actions">
                            <span class="selection-hint" id="selectionHint"></span>
                            <button class="btn" type="button" onclick="doExport()">导出</button>
                        </div>
                    </div>
                    <div class="table-zone">
                        <div class="table-wrapper fixed-table running-table" data-fixed-first="1" data-fixed-min-width="2090px">
                            <table id="runtimeTable">
                                <colgroup>
                                    <col style="width:50px"><col style="width:190px"><col style="width:140px">
                                    <col style="width:108px"><col style="width:108px"><col style="width:110px">
                                    <col style="width:110px"><col style="width:112px"><col style="width:140px">
                                    <col style="width:140px"><col style="width:140px"><col style="width:140px">
                                    <col style="width:90px"><col style="width:150px"><col style="width:90px">
                                    <col style="width:174px"><col style="width:110px">
                                </colgroup>
                                <thead><tr>
                                    <th class="col-center"><input type="checkbox" id="checkAll" aria-label="全选当前页" onchange="toggleCheckAll(this)"></th>
                                    <th class="col-center">VIN 码</th>
                                    <th>所属项目</th>
                                    <th class="col-right">经度</th>
                                    <th class="col-right">纬度</th>
                                    <th>驾驶模式</th>
                                    <th>接管状态</th>
                                    <th class="col-right">车辆速度</th>
                                    <th class="col-right">车辆横向加速度</th>
                                    <th class="col-right">车辆纵向加速度</th>
                                    <th class="col-right">车辆侧倾角速度</th>
                                    <th class="col-right">车辆横摆角速度</th>
                                    <th class="col-center">档位</th>
                                    <th>物联网终端在线状态</th>
                                    <th class="col-right">SOC(%)</th>
                                    <th class="col-center">数据采集时间</th>
                                    <th>车辆作业模式</th>
                                </tr></thead>
                                <tbody id="telemetryBody"></tbody>
                            </table>
                        </div>
                        <div class="pagination-host" id="runtimePagination"></div>
                    </div>
                </section>
            </section>
        </main>
    </div>
</div>

<script src="../components/common.js"></script>
<script src="../components/pagination-component.js"></script>
<script src="../components/filter-component.js"></script>
<script src="../components/export-component.js"></script>
<script src="../components/fixed-table.js"></script>
<script>
Common.initLayout({
    basePath: '../', sidebarId: 'sidebar', activeMenuId: 'vehicle-runtime', headerId: 'header',
    headerOptions: { showProject: false }
});

const vehicles = [
    { id: 1, vin: 'LSVAU2A39EN000001', plate: '浙JAR6538', iot: '14156', model: '麒麟清扫车', project: '鸠江项目', online: true },
    { id: 2, vin: 'LSVAU2A39EN000002', plate: '浙JDB1062', iot: '11527', model: '爱瑞特纯电动高压冲洗车', project: '椒北街道', online: true },
    { id: 3, vin: 'LSVAU2A39EN000003', plate: '皖B·A5106', iot: '14158', model: '中联清洗车', project: '镜湖区项目', online: false },
    { id: 4, vin: 'LSVAU2A39EN000004', plate: '皖B·A7321', iot: '11530', model: '泰坦智能驾驶洒水车', project: '经开东区项目', online: true },
    { id: 5, vin: 'LSVAU2A39EN000005', plate: '皖B·A8632', iot: '14159', model: '三力洒水车', project: '鸠江江北项目', online: true },
    { id: 6, vin: 'LSVAU2A39EN000006', plate: '沪A·D1029', iot: '11532', model: '独角兽', project: '嘉定研发', online: true },
    { id: 7, vin: 'LSVAU2A39EN000007', plate: '皖B·A3055', iot: '14160', model: '麒麟无人化扫地车', project: '鸠江开发区项目', online: false },
    { id: 8, vin: 'LSVAU2A39EN000008', plate: '琼A·B2056', iot: '11535', model: '长城多用途货车', project: '陵水项目', online: true },
    { id: 9, vin: 'LSVAU2A39EN000009', plate: '皖B·A2077', iot: '14161', model: '麒麟清扫车', project: '鸠江项目', online: true },
    { id: 10, vin: 'LSVAU2A39EN000010', plate: '临牌-010', iot: '11538', model: '爱瑞特纯电动高压冲洗车', project: '', online: false }
];

const modes = ['工作', '工作', '转场', '停靠', '充电', '休眠', '关机'];
const drivingModes = ['自动驾驶', '自动驾驶', '人工驾驶', '远程驾驶'];
const takeoverStates = ['未接管', '未接管', '人工接管', '远程接管'];
const telemetry = [];
vehicles.forEach((vehicle, vehicleIndex) => {
    for (let i = 0; i < 26; i += 1) {
        const minute = 58 - i * 2;
        const hour = minute >= 0 ? 14 : 13;
        const normalizedMinute = minute >= 0 ? minute : minute + 60;
        const timestamp = `2026-09-15 ${String(hour).padStart(2, '0')}:${String(normalizedMinute).padStart(2, '0')}:${String((vehicleIndex * 7 + i * 3) % 60).padStart(2, '0')}`;
        const mode = modes[(i + vehicleIndex) % modes.length];
        const moving = mode === '工作' || mode === '转场';
        telemetry.push({
            id: `${vehicle.id}-${i}`, vehicleId: vehicle.id, vin: vehicle.vin, project: vehicle.project || '无分组',
            longitude: (118.365421 + vehicleIndex * .0132 + i * .00011).toFixed(6),
            latitude: (31.326482 + vehicleIndex * .0087 + i * .00008).toFixed(6),
            drivingMode: drivingModes[(i + vehicleIndex) % drivingModes.length],
            takeover: takeoverStates[(i + vehicleIndex) % takeoverStates.length],
            speed: moving ? (18 + ((i * 7 + vehicleIndex) % 28)).toFixed(1) : '0.0',
            lateralAcceleration: moving ? (((i % 7) - 3) * .07).toFixed(2) : '0.00',
            longitudinalAcceleration: moving ? (((i % 9) - 4) * .09).toFixed(2) : '0.00',
            rollRate: moving ? (((i % 6) - 2) * .12).toFixed(2) : '0.00',
            yawRate: moving ? (((i % 8) - 3) * .15).toFixed(2) : '0.00',
            gear: moving ? (i % 5 === 0 ? 'R' : 'D') : 'P', online: vehicle.online && mode !== '关机',
            soc: Math.max(18, 91 - i - vehicleIndex).toFixed(1),
            collectedAt: timestamp, workMode: mode
        });
    }
});

let filteredVehicles = [...vehicles];
let groupMode = 'project';
let collapsedGroups = new Set();
let resetGroupExpansion = true;
let firstGroupKey = null;
let selectedVehicleId = null;
let filteredTelemetry = [];
let selectedRows = new Set();
let currentPage = 1;
let pageSize = 10;

const pager = new Pagination({
    container: 'runtimePagination', pageSize: 10, pageSizeOptions: [10, 20, 50, 100],
    onPageChange: function(page, size) { currentPage = page; pageSize = size; renderTelemetry(); }
});

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}

function toggleVehicleFilter() {
    const filter = document.getElementById('vehicleFilter');
    const toggle = document.getElementById('vehicleFilterToggle');
    const expanded = !filter.classList.contains('is-expanded');
    filter.classList.toggle('is-expanded', expanded);
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    document.getElementById('vehicleFilterToggleText').textContent = expanded ? '收起' : '展开更多';
}

function queryVehicles() {
    const vin = document.getElementById('filterVin').value.trim().toLowerCase();
    const plate = document.getElementById('filterPlate').value.trim().toLowerCase();
    const model = document.getElementById('filterModel').value.trim().toLowerCase();
    const project = document.getElementById('filterProject').value;
    filteredVehicles = vehicles.filter(item =>
        (!vin || item.vin.toLowerCase().includes(vin)) &&
        (!plate || item.plate.toLowerCase().includes(plate)) &&
        (!model || item.model.toLowerCase().includes(model)) &&
        (!project || item.project === project)
    );
    resetGroupExpansion = true;
    ensureSelectedVehicle();
    renderVehicleGroups();
}

function resetVehicleFilter() {
    ['filterVin', 'filterPlate', 'filterModel'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('filterProject').value = '';
    filteredVehicles = [...vehicles];
    resetGroupExpansion = true;
    ensureSelectedVehicle();
    renderVehicleGroups();
}

function ensureSelectedVehicle() {
    if (!filteredVehicles.some(item => item.id === selectedVehicleId)) {
        selectedVehicleId = filteredVehicles.length
            ? [...filteredVehicles].sort((a, b) => a.vin.localeCompare(b.vin))[0].id
            : null;
        resetTelemetryState();
    }
}

function changeGroupMode(mode) {
    groupMode = mode;
    resetGroupExpansion = true;
    document.getElementById('groupProject').classList.toggle('active', mode === 'project');
    document.getElementById('groupModel').classList.toggle('active', mode === 'model');
    renderVehicleGroups();
}

function toggleGroup(key) {
    collapsedGroups.has(key) ? collapsedGroups.delete(key) : collapsedGroups.add(key);
    renderVehicleGroups();
}

function selectVehicle(id) {
    if (selectedVehicleId === id) return;
    selectedVehicleId = id;
    resetTelemetryFilter(false);
    renderVehicleGroups();
}

function renderVehicleGroups() {
    const holder = document.getElementById('vehicleGroups');
    document.getElementById('vehicleTotal').textContent = `共 ${filteredVehicles.length} 辆`;
    if (!filteredVehicles.length) {
        document.getElementById('groupCount').textContent = '0 个分组';
        holder.innerHTML = '<div class="empty-state"><strong>暂无匹配车辆</strong>请调整筛选条件后重试</div>';
        renderSelectedSummary();
        renderTelemetry();
        return;
    }
    const grouped = filteredVehicles.reduce((result, vehicle) => {
        const raw = groupMode === 'project' ? vehicle.project : vehicle.model;
        const key = raw || '无分组';
        (result[key] ||= []).push(vehicle);
        return result;
    }, {});
    const selectedVehicle = filteredVehicles.find(vehicle => vehicle.id === selectedVehicleId);
    const selectedGroupKey = selectedVehicle
        ? ((groupMode === 'project' ? selectedVehicle.project : selectedVehicle.model) || '无分组')
        : null;
    if (resetGroupExpansion) firstGroupKey = selectedGroupKey;
    const keys = Object.keys(grouped).sort((a, b) => {
        if (a === firstGroupKey) return -1;
        if (b === firstGroupKey) return 1;
        if (a === '无分组') return 1;
        if (b === '无分组') return -1;
        return a.localeCompare(b, 'zh-CN');
    });
    if (resetGroupExpansion) {
        collapsedGroups = new Set(keys.slice(1));
        resetGroupExpansion = false;
    }
    document.getElementById('groupCount').textContent = `${keys.length} 个分组`;
    holder.innerHTML = keys.map(key => {
        const items = grouped[key].sort((a, b) => a.vin.localeCompare(b.vin));
        return `<div class="vehicle-group ${collapsedGroups.has(key) ? 'collapsed' : ''}">
            <button class="group-header" type="button" onclick="toggleGroup('${escapeHtml(key).replace(/'/g, '&#39;')}')" aria-expanded="${!collapsedGroups.has(key)}">
                <span class="group-chevron">▼</span><span class="group-name" title="${escapeHtml(key)}">${escapeHtml(key)}</span><span class="group-count">${items.length}</span>
            </button>
            <div class="group-items">${items.map(vehicle => `<button class="vehicle-card ${vehicle.id === selectedVehicleId ? 'active' : ''}" type="button" onclick="selectVehicle(${vehicle.id})">
                <span class="vehicle-card-top"><span class="vehicle-plate">${escapeHtml(vehicle.plate)}</span><span class="online-dot ${vehicle.online ? '' : 'offline'}" title="${vehicle.online ? '终端在线' : '终端离线'}"></span></span>
                <span class="vehicle-vin">${vehicle.vin}</span><span class="vehicle-model">${escapeHtml(vehicle.model)} · ${vehicle.iot}</span>
            </button>`).join('')}</div>
        </div>`;
    }).join('');
    renderSelectedSummary();
    renderTelemetry();
}

function renderSelectedSummary() {
    const vehicle = vehicles.find(item => item.id === selectedVehicleId);
    const holder = document.getElementById('selectedSummary');
    if (!vehicle) {
        holder.innerHTML = '<span class="detail-title">运行数据明细</span><span class="summary-meta">请先选择车辆</span>';
        return;
    }
    holder.innerHTML = `<span class="detail-title">${escapeHtml(vehicle.plate)}</span>
        <span class="tag ${vehicle.online ? 'tag-green' : 'tag-default'}">${vehicle.online ? '终端在线' : '终端离线'}</span>
        <span class="summary-divider"></span><span class="summary-meta">${vehicle.vin}</span>
        <span class="summary-project">${escapeHtml(vehicle.project || '无分组')} · ${escapeHtml(vehicle.model)}</span>`;
}

function toComparable(value) { return value ? value.replace('T', ' ') : ''; }

function getVehicleTelemetry() {
    const start = toComparable(document.getElementById('timeStart').value);
    const end = toComparable(document.getElementById('timeEnd').value);
    return telemetry.filter(item => item.vehicleId === selectedVehicleId && (!start || item.collectedAt >= start) && (!end || item.collectedAt <= end))
        .sort((a, b) => b.collectedAt.localeCompare(a.collectedAt));
}

function queryTelemetry() {
    const start = toComparable(document.getElementById('timeStart').value);
    const end = toComparable(document.getElementById('timeEnd').value);
    if (start && end && start > end) {
        Common.showToast('开始时间不能晚于结束时间', 'warning');
        return;
    }
    selectedRows.clear();
    currentPage = 1;
    filteredTelemetry = getVehicleTelemetry();
    pager.reset();
}

function resetTelemetryState() {
    selectedRows.clear(); currentPage = 1;
    filteredTelemetry = selectedVehicleId ? getVehicleTelemetry() : [];
    pager.reset();
}

function resetTelemetryFilter(renderGroups = true) {
    document.getElementById('timeStart').value = '';
    document.getElementById('timeEnd').value = '';
    resetTelemetryState();
    if (renderGroups) renderVehicleGroups(); else { renderSelectedSummary(); renderTelemetry(); }
}

function getCurrentPageData() {
    const start = (currentPage - 1) * pageSize;
    return filteredTelemetry.slice(start, start + pageSize);
}

function renderTelemetry() {
    filteredTelemetry = selectedVehicleId ? getVehicleTelemetry() : [];
    const maxPage = Math.max(1, Math.ceil(filteredTelemetry.length / pageSize));
    if (currentPage > maxPage) currentPage = maxPage;
    const rows = getCurrentPageData();
    const tbody = document.getElementById('telemetryBody');
    tbody.innerHTML = rows.length ? rows.map(item => `<tr class="${selectedRows.has(item.id) ? 'selected' : ''}">
        <td class="col-center"><input type="checkbox" aria-label="选择 ${item.collectedAt}" ${selectedRows.has(item.id) ? 'checked' : ''} onchange="toggleRow('${item.id}', this)"></td>
        <td class="col-center num">${item.vin}</td><td title="${escapeHtml(item.project)}">${escapeHtml(item.project)}</td>
        <td class="col-right num">${item.longitude}</td><td class="col-right num">${item.latitude}</td>
        <td>${item.drivingMode}</td><td>${item.takeover}</td><td class="col-right num">${item.speed} km/h</td>
        <td class="col-right num">${item.lateralAcceleration} m/s²</td><td class="col-right num">${item.longitudinalAcceleration} m/s²</td>
        <td class="col-right num">${item.rollRate} °/s</td><td class="col-right num">${item.yawRate} °/s</td>
        <td class="col-center">${item.gear}</td><td class="${item.online ? 'status-online' : 'status-offline'}">${item.online ? '在线' : '离线'}</td>
        <td class="col-right num">${item.soc}</td>
        <td class="col-center num">${item.collectedAt}</td><td class="mode-cell"><span class="tag ${workModeClass(item.workMode)}">${item.workMode}</span></td>
    </tr>`).join('') : '<tr><td colspan="17"><div class="empty-state"><strong>暂无运行数据</strong>请调整采集时间或选择其他车辆</div></td></tr>';
    pager.setTotal(filteredTelemetry.length);
    updateSelectionState();
    if (window.FixedTable) FixedTable.refresh(document.querySelector('.running-table'));
}

function workModeClass(mode) {
    return ({ '工作': 'tag-green', '充电': 'tag-blue', '转场': 'tag-purple', '停靠': 'tag-orange', '休眠': 'tag-default', '关机': 'tag-red' })[mode] || 'tag-default';
}

function toggleRow(id, checkbox) {
    checkbox.checked ? selectedRows.add(id) : selectedRows.delete(id);
    renderTelemetry();
}

function toggleCheckAll(checkbox) {
    getCurrentPageData().forEach(item => checkbox.checked ? selectedRows.add(item.id) : selectedRows.delete(item.id));
    renderTelemetry();
}

function updateSelectionState() {
    const pageData = getCurrentPageData();
    const selectedOnPage = pageData.filter(item => selectedRows.has(item.id)).length;
    const all = pageData.length > 0 && selectedOnPage === pageData.length;
    const checkAll = document.getElementById('checkAll');
    checkAll.checked = all;
    checkAll.indeterminate = selectedOnPage > 0 && !all;
    document.getElementById('selectionHint').innerHTML = selectedRows.size ? `已选 <strong>${selectedRows.size}</strong> 条` : '';
}

const exportHeaders = ['VIN 码', '所属项目', '经度', '纬度', '驾驶模式', '接管状态', '车辆速度', '车辆横向加速度', '车辆纵向加速度', '车辆侧倾角速度', '车辆横摆角速度', '档位', '物联网终端在线状态', 'SOC(%)', '数据采集时间', '车辆作业模式'];
function toExportRow(item) {
    return [item.vin, item.project, item.longitude, item.latitude, item.drivingMode, item.takeover, item.speed, item.lateralAcceleration, item.longitudinalAcceleration, item.rollRate, item.yawRate, item.gear, item.online ? '在线' : '离线', item.soc, item.collectedAt, item.workMode];
}
function exportRows(rows) {
    const vehicle = vehicles.find(item => item.id === selectedVehicleId);
    exportCSV({ filename: `车辆运行数据_${vehicle ? vehicle.plate.replace('·', '') : '未选择'}.csv`, headers: exportHeaders, rows: rows.map(toExportRow) });
    Common.showToast(`已导出 ${rows.length} 条运行数据`, 'success');
}
function doExport() {
    if (!filteredTelemetry.length) { Common.showToast('当前查询条件下暂无可导出数据', 'warning'); return; }
    if (selectedRows.size) {
        exportRows(filteredTelemetry.filter(item => selectedRows.has(item.id)));
        return;
    }
    Common.confirm({
        title: '导出全部查询结果',
        content: `当前未勾选数据，将导出查询条件下全部 ${filteredTelemetry.length} 条运行数据，是否继续？`,
        onOk: function() { exportRows(filteredTelemetry); }
    });
}

['filterVin', 'filterPlate', 'filterModel'].forEach(id => document.getElementById(id).addEventListener('keydown', event => { if (event.key === 'Enter') queryVehicles(); }));
ensureSelectedVehicle();
renderVehicleGroups();
</script>
</body>
</html>
