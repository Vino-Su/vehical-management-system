<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆故障信息 - 运行监管</title>
    <link rel="stylesheet" href="../components/common.css">
    <link rel="stylesheet" href="../components/fixed-table.css">
    <!--
      页面用途：按次记录车辆主动上报的故障代码及整车、上装原始等级，不推断恢复和处置状态。
      核心功能：多条件筛选、复选与当前页全选、分页、按查询结果或选中记录导出。
      交互逻辑：查询和重置回到第一页；未选择记录时导出需二次确认；弹窗支持遮罩与 ESC 关闭。
    -->
    <style>
        .fault-page { min-width: 0; }
        .filter-bar { margin-bottom: 24px !important; padding: 0 !important; }
        .filter-bar .filter-row { align-items: flex-end; }
        .filter-bar .filter-item label { color: var(--text-secondary); }
        .filter-bar[data-progressive-filter] .filter-row.filter-primary { flex-wrap: wrap; }
        .filter-control { width: 176px; }
        .filter-control--wide { width: 206px; }
        .date-range { display: inline-flex; align-items: center; gap: 8px; }
        .date-range .ant-input { width: 202px; }
        .date-range { flex-wrap: wrap; }
        .date-separator { color: var(--text-disabled); }
        .table-toolbar { display: flex; align-items: center; justify-content: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        .fault-table th, .fault-table td { font-variant-numeric: tabular-nums; }
        .table-wrapper .fault-table th, .table-wrapper .fault-table td { text-align: center; }
        .fault-table .fault-code { color: #d4380d; font-family: var(--font-number); font-weight: 600; }
        .fault-definition { max-width: 320px; }
        .empty-row td { height: 240px !important; text-align: center; }
        .empty-state { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); }
        .empty-mark { width: 52px; height: 38px; position: relative; border: 1px solid #d9d9d9; border-radius: 4px; background: #fafafa; }
        .empty-mark::before { content: ""; position: absolute; left: 9px; right: 9px; top: 12px; height: 1px; background: #d9d9d9; box-shadow: 0 7px 0 #e5e5e5; }
        .empty-text { font-size: 14px; }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        @media (max-width: 1500px) {
            .filter-control { width: 156px; }
            .filter-control--wide { width: 184px; }
            .filter-bar[data-progressive-filter] .filter-row.filter-primary { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div id="header"></div>
        <main class="content">
            <section class="page-container fault-page" aria-label="车辆故障信息列表">
                <div class="filter-bar" data-progressive-filter role="search" aria-label="故障台账筛选">
                    <div class="filter-row filter-primary">
                        <div class="filter-item">
                            <label for="filterVin">车架号</label>
                            <input class="ant-input filter-control" id="filterVin" type="text" placeholder="请输入车架号">
                        </div>
                        <div class="filter-item">
                            <label for="filterPlate">车牌号</label>
                            <input class="ant-input filter-control" id="filterPlate" type="text" placeholder="请输入车牌号">
                        </div>
                        <div class="filter-item">
                            <label for="filterIot">网联编号</label>
                            <input class="ant-input filter-control" id="filterIot" type="text" placeholder="请输入网联编号">
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-primary" type="button" onclick="searchFaults()">查询</button>
                            <button class="btn" type="button" onclick="resetFilters()">重置</button>
                        </div>
                        <button class="filter-more-toggle" type="button" aria-expanded="false">
                            <span class="filter-more-text">展开更多</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"></path></svg>
                        </button>
                    </div>
                    <div class="filter-row filter-extra">
                        <div class="filter-item">
                            <label for="filterModel">车型</label>
                            <select class="ant-input filter-control" id="filterModel">
                                <option value="">全部车型</option>
                                <option>独角兽</option><option>麒麟-扫车</option><option>麒麟-洒水车</option>
                                <option>浩克-扫车</option><option>浩克-洒水车</option><option>麒麟-R3S</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="filterSystem">故障系统</label>
                            <select class="ant-input filter-control" id="filterSystem">
                                <option value="">全部系统</option>
                                <optgroup label="底盘"><option>整车</option><option>驱动系统</option><option>电池系统</option><option>制动系统</option><option>转向系统</option></optgroup>
                                <optgroup label="上装"><option>上装系统</option><option>扫盘系统</option><option>滚扫电机</option><option>风机电机</option></optgroup>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="filterProject">所属项目</label>
                            <select class="ant-input filter-control" id="filterProject">
                                <option value="">全部项目</option>
                                <option>嘉定研发</option>
                                <option>椒北街道</option>
                                <option>经开东区项目</option>
                                <option>镜湖区项目</option>
                                <option>鸠江江北项目</option>
                                <option>鸠江开发区项目</option>
                                <option>鸠江项目</option>
                                <option>陵水项目</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="filterCode">故障码</label>
                            <input class="ant-input filter-control" id="filterCode" type="text" placeholder="请输入故障码">
                        </div>
                        <div class="filter-item">
                            <label for="filterStart">故障上报时间</label>
                            <div class="date-range">
                                <input class="ant-input" id="filterStart" type="datetime-local" step="1" aria-label="故障上报开始时间">
                                <span class="date-separator">至</span>
                                <input class="ant-input" id="filterEnd" type="datetime-local" step="1" aria-label="故障上报结束时间">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="table-toolbar">
                    <button class="btn" type="button" onclick="exportFaults()" title="导出车辆故障信息">导出</button>
                </div>

                <div class="table-wrapper fixed-table" id="faultTableWrapper" data-fixed-first="2" data-fixed-start="0" data-fixed-min-width="2190px" role="region" aria-label="故障上报记录，可横向滚动" tabindex="0">
                    <table class="fault-table" id="faultTable">
                        <thead>
                            <tr>
                                <th class="col-center" style="width:56px"><input id="checkAll" type="checkbox" aria-label="全选当前页" onchange="toggleCurrentPage(this)"></th>
                                <th class="col-center" style="width:196px">车架号</th>
                                <th class="col-center" style="width:126px">车牌号</th>
                                <th class="col-center" style="width:110px">网联编号</th>
                                <th style="width:170px">所属项目</th>
                                <th style="width:150px">车型</th>
                                <th style="width:132px">故障系统</th>
                                <th class="col-center" style="width:132px">故障码</th>
                                <th style="width:330px">故障定义</th>
                                <th style="width:148px" title="本次报文的整车原始等级，不代表单条故障严重程度">整车故障等级</th>
                                <th style="width:148px" title="本次报文的上装原始等级，不代表单条故障严重程度">上装故障等级</th>
                                <th class="col-center" style="width:184px">故障上报时间</th>
                                <th class="col-center" style="width:184px">平台接收时间</th>
                            </tr>
                        </thead>
                        <tbody id="faultTableBody"></tbody>
                    </table>
                </div>

                <div class="pagination-area">
                    <div class="pagination-left">
                        <div class="pagination-info">共 <strong id="totalCount">0</strong> 条记录</div>
                        <span class="pagination-pages" id="pageInfo">第 1 / 1 页</span>
                    </div>
                    <div id="pagination"></div>
                </div>
            </section>
        </main>
    </div>
</div>

<script src="../components/common.js"></script>
<script src="../components/pagination-component.js"></script>
<script src="../components/filter-component.js"></script>
<script src="../components/export-component.js"></script>
<script src="../components/fixed-table.js"></script>
<script>
Common.initLayout({
    basePath: '../',
    sidebarId: 'sidebar',
    activeMenuId: 'vehicle-fault',
    headerId: 'header',
    headerOptions: { showProject: false }
});

// 交互演示数据，非厂家故障码字典。车型能力按参考表配置，系统来自上报字段，不按编码前缀推断。

    { vin: 'LSVAU2A39EN000002', plate: '浙JAR6538', iot: '11527', project: '椒北街道', model: '独角兽' },
    { vin: 'LSVAU2A39EN000003', plate: '浙JDB1062', iot: '14158', project: '镜湖区项目', model: '麒麟-洒水车' },
    { vin: 'LSVAU2A39EN000004', plate: '皖BDF218', iot: '11530', project: '经开东区项目', model: '浩克-扫车' },

    { vin: 'LSVAU2A39EN000006', plate: '沪ADP520', iot: '11532', project: '嘉定研发', model: '麒麟-R3S' }

const faultRecords = [
    { id: 1, vehicle: 0, system: '电池系统', code: 'BMS-P0A80', definition: '动力电池组容量衰减异常', vehicleLevel: 2, bodyLevel: null, reportTime: '2026-09-15 09:42:28', receiveTime: '2026-09-15 09:42:30' },
    { id: 2, vehicle: 0, system: '电池系统', code: 'BMS-P0A80', definition: '动力电池组容量衰减异常', vehicleLevel: 2, bodyLevel: null, reportTime: '2026-09-15 09:42:18', receiveTime: '2026-09-15 09:42:20' },
    { id: 3, vehicle: 1, system: '整车', code: 'VCU-U0100', definition: '整车控制器与动力系统通信中断', vehicleLevel: 3, bodyLevel: null, reportTime: '2026-09-15 09:18:36', receiveTime: '2026-09-15 09:18:40' },
    { id: 4, vehicle: 2, system: '转向系统', code: 'EPS-C1001', definition: '转向扭矩传感器信号异常', vehicleLevel: 2, bodyLevel: null, reportTime: '2026-09-15 08:56:04', receiveTime: '2026-09-15 08:56:06' },
    { id: 5, vehicle: 3, system: '驱动系统', code: 'MOT-P0219', definition: '驱动电机控制器温度过高', vehicleLevel: 1, bodyLevel: null, reportTime: '2026-09-15 08:23:51', receiveTime: '2026-09-15 08:23:54' },
    { id: 6, vehicle: 0, system: '制动系统', code: 'EBS-C0040', definition: '制动压力传感器信号异常', vehicleLevel: 2, bodyLevel: null, reportTime: '2026-09-14 17:48:22', receiveTime: '2026-09-14 17:48:24' },
    { id: 7, vehicle: 5, system: '上装系统', code: 'UP-0001', definition: '上装控制器通信异常', vehicleLevel: 0, bodyLevel: 2, reportTime: '2026-09-14 16:35:47', receiveTime: '2026-09-14 16:35:50' },
    { id: 8, vehicle: 1, system: '滚扫电机', code: 'ROLL-0002', definition: '滚扫电机过载', vehicleLevel: null, bodyLevel: 1, reportTime: '2026-09-14 15:09:13', receiveTime: '2026-09-14 15:09:15' },
    { id: 9, vehicle: 3, system: '扫盘系统', code: 'SWP-0003', definition: '左扫盘电机转速异常', vehicleLevel: 0, bodyLevel: 1, reportTime: '2026-09-14 13:27:40', receiveTime: '2026-09-14 13:27:43' },
    { id: 10, vehicle: 0, system: '风机电机', code: 'FAN-0004', definition: '风机电机过温', vehicleLevel: null, bodyLevel: 2, reportTime: '2026-09-14 11:14:08', receiveTime: '2026-09-14 11:14:11' },
    { id: 11, vehicle: 4, system: '上装系统', code: 'UP-0005', definition: '上装控制器供电异常', vehicleLevel: 0, bodyLevel: 1, reportTime: '2026-09-13 18:52:29', receiveTime: '2026-09-13 18:52:32' },
    { id: 12, vehicle: 2, system: '电池系统', code: 'BMS-P0AA6', definition: '高压系统绝缘电阻异常', vehicleLevel: 3, bodyLevel: null, reportTime: '2026-09-13 16:44:15', receiveTime: '2026-09-13 16:44:18' },
    { id: 13, vehicle: 5, system: '扫盘系统', code: 'SWP-0003', definition: '左扫盘电机转速异常', vehicleLevel: 0, bodyLevel: 1, reportTime: '2026-09-13 14:20:06', receiveTime: '2026-09-13 14:20:08' },
    { id: 14, vehicle: 3, system: '整车', code: 'VCU-P0606', definition: '整车控制器自检异常', vehicleLevel: 2, bodyLevel: null, reportTime: '2026-09-13 10:05:38', receiveTime: '2026-09-13 10:05:40' },
    { id: 15, vehicle: 1, system: '转向系统', code: 'EPS-C1012', definition: '转向执行器角度跟随偏差异常', vehicleLevel: 1, bodyLevel: null, reportTime: '2026-09-12 17:36:42', receiveTime: '2026-09-12 17:36:45' },
    { id: 16, vehicle: 4, system: '电池系统', code: 'BMS-P1A10', definition: '电池温度传感器信号异常', vehicleLevel: 1, bodyLevel: null, reportTime: '2026-09-12 15:12:54', receiveTime: '2026-09-12 15:12:56' },
    { id: 17, vehicle: 5, system: '制动系统', code: 'EBS-C0040', definition: '制动压力传感器信号异常', vehicleLevel: null, bodyLevel: null, reportTime: '2026-09-12 11:48:19', receiveTime: '2026-09-12 11:48:22' },
    { id: 18, vehicle: 4, system: '驱动系统', code: 'MOT-P0A3C', definition: '驱动电机逆变器过温', vehicleLevel: 2, bodyLevel: null, reportTime: '2026-09-11 16:30:11', receiveTime: '2026-09-11 16:30:13' },
    { id: 19, vehicle: 1, system: '风机电机', code: 'FAN-0004', definition: '风机电机过温', vehicleLevel: 0, bodyLevel: 2, reportTime: '2026-09-11 14:06:33', receiveTime: '2026-09-11 14:06:36' },
    { id: 20, vehicle: 2, system: '上装系统', code: 'UP-0099', definition: null, vehicleLevel: null, bodyLevel: null, reportTime: '2026-09-11 10:29:47', receiveTime: '2026-09-11 10:29:50' },
    { id: 21, vehicle: 0, system: '上装系统', code: null, definition: null, vehicleLevel: null, bodyLevel: 2, reportTime: '2026-09-10 17:55:20', receiveTime: '2026-09-10 17:55:23' },
    { id: 22, vehicle: 1, system: '滚扫电机', code: 'ROLL-0002', definition: '滚扫电机过载', vehicleLevel: 0, bodyLevel: 1, reportTime: '2026-09-10 13:18:09', receiveTime: '2026-09-10 13:18:12' },
    { id: 23, vehicle: 5, system: '电池系统', code: 'BMS-P0A80', definition: '动力电池组容量衰减异常', vehicleLevel: 1, bodyLevel: null, reportTime: '2026-09-09 16:42:57', receiveTime: '2026-09-09 16:43:00' },
    { id: 24, vehicle: 3, system: '风机电机', code: 'FAN-0004', definition: '风机电机过温', vehicleLevel: null, bodyLevel: 1, reportTime: '2026-09-09 09:27:34', receiveTime: '2026-09-09 09:27:37' },
    { id: 25, vehicle: 4, system: '整车', code: 'VCU-0099', definition: null, vehicleLevel: null, bodyLevel: null, reportTime: null, receiveTime: '2026-09-09 08:15:21' }
].map(function (item) { return Object.assign({}, faultVehicles[item.vehicle], item); })
 .sort(function (a, b) { return (b.reportTime || '').localeCompare(a.reportTime || '') || (b.receiveTime || '').localeCompare(a.receiveTime || '') || b.id - a.id; });

const faultColumns = [
    ['vin', '车架号', 'col-center ellipsis'], ['plate', '车牌号'], ['iot', '网联编号', 'col-center num'],
    ['project', '所属项目', 'ellipsis'], ['model', '车型'], ['system', '故障系统'],
    ['code', '故障码', 'col-center fault-code'], ['definition', '故障定义', 'fault-definition ellipsis'],
    ['vehicleLevel', '整车故障等级', 'col-center num'], ['bodyLevel', '上装故障等级', 'col-center num'],
    ['reportTime', '故障上报时间', 'col-center num'], ['receiveTime', '平台接收时间', 'col-center num']
];

function displayValue(value) {
    return value === null || value === undefined || String(value).trim() === '' ? '—' : String(value);
}

let filteredRecords = faultRecords.slice();
let currentPage = 1;
let pageSize = 10;
let pager = null;
const selectedIds = new Set();

function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char];
    });
}

function currentPageRecords() {
    const start = (currentPage - 1) * pageSize;
    return filteredRecords.slice(start, start + pageSize);
}

function renderTable() {
    const rows = currentPageRecords();
    const tbody = document.getElementById('faultTableBody');
    if (!rows.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="13"><div class="empty-state"><span class="empty-mark" aria-hidden="true"></span><span class="empty-text">暂无符合条件的故障数据</span></div></td></tr>';
    } else {
        tbody.innerHTML = rows.map(function (item) {
            const checked = selectedIds.has(item.id);
            return '<tr' + (checked ? ' class="selected"' : '') + '>' +
                '<td class="col-center"><input type="checkbox" aria-label="选择 ' + escapeHtml(item.vin) + '" data-id="' + item.id + '" ' + (checked ? 'checked' : '') + ' onchange="toggleRecord(' + item.id + ', this)"></td>' +
                faultColumns.map(function (column) {
                    const text = escapeHtml(displayValue(item[column[0]]));
                    return '<td class="' + (column[2] || 'col-center') + '" title="' + text + '">' + text + '</td>';
                }).join('') +
                '</tr>';
        }).join('');
    }
    updateSelectionState();
    renderPagination();
    if (window.FixedTable) requestAnimationFrame(function () { FixedTable.refresh('#faultTableWrapper'); });
}

function renderPagination() {
    document.getElementById('totalCount').textContent = filteredRecords.length;
    const totalPages = Math.max(1, Math.ceil(filteredRecords.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页';
    if (pager) pager.destroy();
    pager = new Pagination({
        container: 'pagination',
        currentPage: currentPage,
        pageSize: pageSize,
        pageSizeOptions: [10, 20, 50, 100],
        showStats: false,
        showPageSize: true,
        onPageChange: function (page, size) {
            currentPage = page;
            pageSize = size;
            renderTable();
        },
        onPageSizeChange: function (size) {
            pageSize = size;
            currentPage = 1;
        }
    });
    pager.setTotal(filteredRecords.length);
}

function toggleRecord(id, checkbox) {
    if (checkbox.checked) selectedIds.add(id);
    else selectedIds.delete(id);
    renderTable();
}

function toggleCurrentPage(checkbox) {
    currentPageRecords().forEach(function (item) {
        if (checkbox.checked) selectedIds.add(item.id);
        else selectedIds.delete(item.id);
    });
    renderTable();
}

function updateSelectionState() {
    const rows = currentPageRecords();
    const selectedOnPage = rows.filter(function (item) { return selectedIds.has(item.id); }).length;
    const checkAll = document.getElementById('checkAll');
    checkAll.checked = rows.length > 0 && selectedOnPage === rows.length;
    checkAll.indeterminate = selectedOnPage > 0 && selectedOnPage < rows.length;
}

function searchFaults(silent) {
    const vin = document.getElementById('filterVin').value.trim().toLowerCase();
    const plate = document.getElementById('filterPlate').value.trim().toLowerCase();
    const iot = document.getElementById('filterIot').value.trim().toLowerCase();
    const project = document.getElementById('filterProject').value;
    const model = document.getElementById('filterModel').value;
    const system = document.getElementById('filterSystem').value;
    const code = document.getElementById('filterCode').value.trim().toLowerCase();
    const startValue = document.getElementById('filterStart').value;
    const endValue = document.getElementById('filterEnd').value;
    const start = startValue.length === 16 ? startValue + ':00' : startValue;
    const end = endValue.length === 16 ? endValue + ':59' : endValue;
    if (start && end && start > end) {
        Common.showToast('故障上报开始时间不能晚于结束时间', 'warning');
        return;
    }
    filteredRecords = faultRecords.filter(function (item) {
        const comparableTime = item.reportTime ? item.reportTime.replace(' ', 'T') : '';
        return (!vin || item.vin.toLowerCase().includes(vin)) &&
            (!plate || item.plate.toLowerCase().includes(plate)) &&
            (!iot || item.iot.toLowerCase().includes(iot)) &&
            (!project || item.project === project) &&
            (!model || item.model === model) &&
            (!system || item.system === system) &&
            (!code || String(item.code || '').toLowerCase().includes(code)) &&
            (!start || (comparableTime && comparableTime >= start)) &&
            (!end || (comparableTime && comparableTime <= end));
    });
    currentPage = 1;
    selectedIds.clear();
    renderTable();
    if (!silent) Common.showToast('查询完成，共 ' + filteredRecords.length + ' 条数据', 'success');
}

function resetFilters() {
    ['filterVin', 'filterPlate', 'filterIot', 'filterProject', 'filterModel', 'filterSystem', 'filterCode', 'filterStart', 'filterEnd'].forEach(function (id) {
        document.getElementById(id).value = '';
    });
    filteredRecords = faultRecords.slice();
    currentPage = 1;
    selectedIds.clear();
    renderTable();
    Common.showToast('筛选条件已重置', 'success');
}

function downloadRecords(records, scopeText) {
    if (!records.length) {
        Common.showToast('当前没有可导出的数据', 'warning');
        return;
    }
    exportCSV({
        filename: '车辆故障信息_' + new Date().toISOString().slice(0, 10) + '.csv',
        headers: faultColumns.map(function (column) { return column[1]; }),
        rows: records.map(function (item) {
            return faultColumns.map(function (column) { return displayValue(item[column[0]]); });
        })
    });
    Common.showToast('已导出' + scopeText + '（共 ' + records.length + ' 条）', 'success');
}

function exportFaults() {
    ListExport.run({
        rows: filteredRecords, selectedIds, currentPage, pageSize,
        onExport: (rows, scope) => downloadRecords(rows, scope.selected ? '选中数据' : '当前查询结果')
    });
}

document.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && event.target.closest('.filter-bar')) searchFaults();
});

// 接收单车监控已有的跳转参数，仍使用与手动查询一致的筛选规则。
const query = new URLSearchParams(window.location.search);
[['filterVin', 'vin'], ['filterPlate', 'plateNo'], ['filterIot', 'iotCode']].forEach(function (entry) {
    document.getElementById(entry[0]).value = query.get(entry[1]) || '';
});
searchFaults(true);
</script>
</body>
